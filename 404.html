<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Padel Radar</title>
<!-- SPA fallback for GitHub Pages: any unknown path goes back to the app. -->
<script>
  var base = location.pathname.split('/').filter(Boolean)[0];
  var root = location.hostname.endsWith('github.io') && base ? '/' + base + '/' : '/';
  location.replace(root + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=./">
</head>
<body><a href="./">Open Padel Radar</a></body>
</html>
