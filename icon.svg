<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Padel Radar</title>
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="sweep" x1="256" y1="256" x2="452" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9d82b" stop-opacity=".85"/>
      <stop offset="1" stop-color="#c9d82b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <!-- court-blue turf -->
    <rect width="512" height="512" fill="#0085b2"/>
    <!-- radar sweep (padel-ball yellow) -->
    <path d="M256 256 L256 56 A200 200 0 0 1 429.2 156 Z" fill="url(#sweep)"/>
    <!-- range rings, drawn like white court lines -->
    <g fill="none" stroke="#fff" stroke-linecap="round">
      <circle cx="256" cy="256" r="200" stroke-width="14" opacity=".95"/>
      <circle cx="256" cy="256" r="132" stroke-width="10" opacity=".7"/>
      <circle cx="256" cy="256" r="64" stroke-width="8" opacity=".5"/>
      <path d="M256 56 V456 M56 256 H456" stroke-width="6" opacity=".35"/>
      <path d="M256 256 L256 56" stroke-width="12"/>
    </g>
    <!-- the blip: a padel ball -->
    <circle cx="352" cy="150" r="36" fill="#c9d82b"/>
    <path d="M326 126 Q352 150 326 176 M378 124 Q352 150 378 176" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".9"/>
    <circle cx="256" cy="256" r="16" fill="#fff"/>
  </g>
</svg>
