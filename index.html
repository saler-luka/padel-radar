<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Padel Radar</title>
<meta name="description" content="Svi padel tereni, ligaške utakmice i slobodni termini za cijeli tjedan, s prognozom i rezervacijama. Na temelju Sporty.plus.">
<meta name="theme-color" content="#0085b2">
<meta name="apple-mobile-web-app-title" content="Padel Radar">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>try{var t=JSON.parse(localStorage.getItem('pw.theme'));if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Court glass: a blue-turf header band with a white court line, then the week board as frosted glass panels.
   Days are columns split into court lanes on a real time axis; phones get a day-by-day agenda. */
:root{
  --bg:#eef5f8; --surface:#ffffff; --fg:#13222c; --muted:#5d6f7b; --line:#d3e3eb;
  --band:#0085b2; --on-band:#ffffff; --band-soft:#cfeaf5;
  --court:#0085b2; --court-soft:#e3f2f8; --free:#4a6f0a; --free-bg:#eef7dc; --free-line:#a3c642; --peak:#7a5600; --peak-bg:#fdf4cf; --peak-line:#e0bb32; --rain:#2f6fd0; --rain-soft:#e8f0fc; --ball:#c9d82b; --now:#e0452b; --win:#13222c;
  --l1:#d4762a; --l2:#7c4bc0; --l3:#1f9d6b; --l4:#c23d6b; --l5:#8a7a12; --l6:#0085b2;
  --f-display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r-tile:10px; --r-panel:14px; --hour:58px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1419; --surface:#12222b; --fg:#e4eef2; --muted:#8ea4af; --line:#223843;
  --band:#0b5f80; --on-band:#ffffff; --band-soft:#a9d9ec;
  --court:#3bb4de; --court-soft:#15313d; --free:#d6e24a; --free-bg:#1d2b12; --free-line:#6f8f24; --peak:#f2d35c; --peak-bg:#2a2410; --peak-line:#8c7421; --rain:#7fb0ff; --rain-soft:#15243c; --ball:#d6e24a; --now:#ff6a4f; --win:#ffffff;
  --l1:#f0954a; --l2:#a77ee8; --l3:#3cc48e; --l4:#ec6a96; --l5:#cdb93a; --l6:#3bb4de;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1419; --surface:#12222b; --fg:#e4eef2; --muted:#8ea4af; --line:#223843;
  --band:#0b5f80; --on-band:#ffffff; --band-soft:#a9d9ec;
  --court:#3bb4de; --court-soft:#15313d; --free:#d6e24a; --free-bg:#1d2b12; --free-line:#6f8f24; --peak:#f2d35c; --peak-bg:#2a2410; --peak-line:#8c7421; --rain:#7fb0ff; --rain-soft:#15243c; --ball:#d6e24a; --now:#ff6a4f; --win:#ffffff;
  --l1:#f0954a; --l2:#a77ee8; --l3:#3cc48e; --l4:#ec6a96; --l5:#cdb93a; --l6:#3bb4de;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);padding-bottom:40px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--court);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
.wrap>*{min-width:0}
#weekView{width:100%;padding-inline:0}

/* Header band: blue turf with the court's white line along the bottom */
.band{background:var(--band);color:var(--on-band);border-bottom:3px solid #fff;margin-bottom:4px}
.band .wrap{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:16px}
.brand{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}
.brand .logo{grid-row:span 2;width:44px;height:44px;border-radius:11px;box-shadow:0 0 0 2px color-mix(in srgb,#fff 70%,transparent)}
.brand h1{font:600 1.7rem/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--band-soft);font-size:.85rem}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav .range{font:500 1.05rem var(--f-display);min-width:11ch;text-align:center;font-variant-numeric:tabular-nums}
.pill{border:1px solid color-mix(in srgb,var(--on-band) 70%,transparent);background:transparent;color:var(--on-band);border-radius:999px;padding:5px 13px;font-size:.85rem}
.pill:hover{background:color-mix(in srgb,var(--on-band) 14%,transparent)}
.pill.solid{background:var(--on-band);color:var(--band);border-color:var(--on-band)}
.pill:focus-visible{outline-color:var(--on-band)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px}
.btn:hover{border-color:var(--court)}
.btn.primary{background:var(--court);border-color:var(--court);color:#fff}
.tabs{display:flex;gap:4px}
.tabs button{border:1px solid transparent;background:none;padding:6px 16px;font:500 .95rem var(--f-display);color:var(--muted);border-radius:999px}
.tabs button[aria-selected="true"]{color:var(--court);background:var(--surface);border-color:var(--line)}

/* Court switch bar: All courts / one court. Pinned under the header on phones. */
.courtbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 16px;color:var(--muted);font:500 .92rem var(--f-display);white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--court);color:#fff}
.courtnote{color:var(--muted);font-size:.82rem;display:inline-flex;align-items:center;gap:8px}
.courtnote .cam{display:inline-flex;align-items:center;gap:5px}
.courtnote .cam i{width:7px;height:7px;border-radius:50%;background:var(--now)}
.board.one{grid-template-columns:52px repeat(7,minmax(124px,1fr));min-width:920px}
@media (max-width:760px){
  .courtbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:8px 16px;border-bottom:1px solid var(--line)}
  .seg{display:flex;width:100%}
  .seg button{flex:1;padding:8px 4px}
  .courtnote{display:none}
}
.summary{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline}
.stat{display:flex;align-items:baseline;gap:6px}
.stat b{font:600 1.6rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.82rem}
.stat.hi b{color:var(--court)}

.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 9px;font-size:.82rem}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--court));flex:none}
.chip[aria-pressed="false"]{opacity:.45}
.chip[aria-pressed="false"] i{background:transparent;outline:1.5px solid var(--c,var(--court))}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums}
.chip.free i{background:linear-gradient(90deg,var(--free-bg) 50%,var(--peak-bg) 50%);border:1.5px solid var(--free-line);border-right-color:var(--peak-line);border-bottom-color:var(--peak-line)}

.status{color:var(--muted);font-size:.85rem}
.status.err{color:var(--now)}
.loading{opacity:.45;transition:opacity .15s;pointer-events:none}
@media (prefers-reduced-motion:reduce){.loading{transition:none}}

/* Week board */
.board-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel)}
.board{display:grid;grid-template-columns:52px repeat(7,minmax(176px,1fr));min-width:1290px;position:relative}
.dayhead{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:10px 8px 0}
.dayhead .d{font:500 1rem var(--f-display);display:flex;justify-content:space-between;align-items:baseline}
.dayhead .d small{font:400 .8rem var(--f-body);color:var(--muted)}
.dayhead.today .d,.dayhead.today .d small{color:var(--court)}
.dayhead.today{box-shadow:inset 0 3px 0 var(--court)}
.lanes-h{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin-top:4px}
.lanes-h span{font-size:.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:6px}
.corner{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:3}
.axis{position:relative}
.axis span{position:absolute;right:6px;transform:translateY(-50%);font:400 .72rem var(--f-mono);color:var(--muted)}
.daycol{position:relative;border-left:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:0 4px;
  background-image:repeating-linear-gradient(to bottom,color-mix(in srgb,var(--line) 70%,transparent) 0 1px,transparent 1px var(--hour))}
.daycol.today{background-color:color-mix(in srgb,var(--court-soft) 60%,transparent)}
.lane{position:relative}
.now{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--now);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--now)}

.slot{position:absolute;left:0;right:0;border-radius:var(--r-tile);padding:5px 6px;overflow:hidden;text-align:left;font-size:.74rem;line-height:1.25;display:flex;flex-direction:column;gap:1px;
  background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.slot .t{font:400 .7rem var(--f-mono);color:var(--muted)}
.slot .l{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .x{white-space:normal;overflow:hidden}
.slot .sub{color:var(--muted)}
.slot .sc{font:500 .72rem var(--f-mono);margin-top:auto}
.slot.league{border-color:color-mix(in srgb,var(--c) 65%,transparent);background:color-mix(in srgb,var(--c) 6%,var(--surface))}
.slot.league .sub,.slot.league .sc{color:var(--c)}
.slot.booking{border-color:color-mix(in srgb,var(--court) 25%,var(--line))}
.slot.free{background:var(--free-bg);border:1px solid var(--free-line);color:var(--free)}
.slot.free .t{color:var(--free);opacity:.75}
.slot.free .l{font-weight:600}
.slot.free .open{font:600 .62rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.slot.mine{background:var(--court);border-color:var(--court);color:#fff}
.slot.mine .t,.slot.mine .sub,.slot.mine .sc{color:color-mix(in srgb,#fff 82%,transparent)}
.slot:hover{border-color:var(--c,var(--court))}
/* Free slots at the week's top price (peak hours) turn padel-ball yellow; cheaper ones stay green */
.slot.free.peak{--free:var(--peak);--free-bg:var(--peak-bg);--free-line:var(--peak-line)}
.slot.free:hover{background:color-mix(in srgb,var(--free-line) 30%,var(--free-bg));border-color:var(--free)}
.slot.past{opacity:.55}
/* Rain plan: outdoor slots where rain is likely */
.slot.wet{box-shadow:inset 3px 0 0 var(--rain)}
.slot.free .open .rw{color:var(--rain)}
.tag.rain{background:var(--rain-soft);color:var(--rain)}
.rainplan{display:flex;flex-direction:column;gap:8px;border:1px solid color-mix(in srgb,var(--rain) 45%,var(--line));border-radius:var(--r-panel);padding:12px 14px;background:var(--rain-soft)}
.rainplan b{color:var(--rain);font-weight:600}
.rainplan .btn{align-self:flex-start}
/* Share + calendar */
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions .btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg)}
.actions svg{width:16px;height:16px;flex:none}
.shareopts{display:flex;flex-wrap:wrap;gap:8px}
.shareopts[hidden]{display:none}
.tag{display:inline-block;font:500 .62rem var(--f-body);padding:0 5px;border-radius:999px;background:var(--court-soft);color:var(--court);vertical-align:1px}
.slot.mine .tag{background:color-mix(in srgb,#fff 22%,transparent);color:#fff}
/* Weather corner badge (yr.no) */
.slot .top{display:flex;align-items:center;justify-content:space-between;gap:2px;min-height:16px}
.slot .top .t{font-size:.68rem;letter-spacing:-.02em}
.wx{display:inline-flex;flex:none;align-items:center;gap:1px;font:500 .68rem var(--f-body);font-variant-numeric:tabular-nums;color:var(--fg);
  pointer-events:none}
.wx img{width:15px;height:15px;flex:none}
.slot.free .wx{background:transparent;color:var(--free)}
.slot.mine .wx{color:#fff}
.agenda .wx{font-size:.82rem}
.agenda .wx img{width:22px;height:22px}
.wxrow{display:inline-flex;align-items:center;gap:6px}
.wxrow img{width:28px;height:28px}
.stream{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 16px;background:var(--fg);color:var(--bg);text-decoration:none;font-weight:500}
.stream:hover{background:color-mix(in srgb,var(--fg) 85%,var(--court))}
.stream i{width:9px;height:9px;border-radius:50%;background:var(--now);box-shadow:0 0 0 3px color-mix(in srgb,var(--now) 30%,transparent)}
.drawer a.stream{color:var(--bg)}
.credit{text-align:center;padding-block:8px 0}
.credit a{color:var(--court)}

/* Agenda (phone) */
.agenda{display:none;flex-direction:column;gap:18px}
.agenda h3{font:500 1.1rem var(--f-display);margin:0 0 6px;display:flex;gap:8px;align-items:baseline}
.agenda h3 small{font:400 .82rem var(--f-body);color:var(--muted)}
.agenda h3.today,.agenda h3.today small{color:var(--court)}
.agenda ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.agenda .slot{position:static;flex-direction:row;align-items:center;gap:10px;padding:9px 12px;font-size:.85rem;width:100%}
.agenda .slot .t{min-width:4.2em}
.agenda .slot .body{min-width:0;flex:1;display:flex;flex-direction:column}
.agenda .slot .court{color:var(--muted);font-size:.75rem}
.agenda .slot.mine .court{color:color-mix(in srgb,#fff 82%,transparent)}
.agenda .slot.league .court{color:var(--c)}
.agenda .slot .sc{margin:0}
.empty{color:var(--muted);font-size:.85rem}
@media (max-width:760px){.board-scroll{display:none}.agenda{display:flex}.brand{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}
.brand .logo{grid-row:span 2;width:44px;height:44px;border-radius:11px;box-shadow:0 0 0 2px color-mix(in srgb,#fff 70%,transparent)}
.brand h1{font-size:1.4rem}.nav .range{min-width:0}}

/* Results */
.results{display:flex;flex-direction:column;gap:18px}
.results h3{font:500 1rem var(--f-display);margin:0 0 6px;color:var(--muted)}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);padding:12px 16px;margin-bottom:8px}
.res .team{min-width:0;display:flex;flex-direction:column}
.res .team b{font-weight:500}
.res .team.w b{font-weight:600;color:var(--win)}
.res .team.w b::after{content:" ●";color:var(--ball);font-size:.7em;vertical-align:2px}
.res .team small{color:var(--muted);font-size:.75rem}
.res .sets{display:flex;gap:10px;font:500 1rem var(--f-mono);align-self:center}
.res .sets span{display:flex;flex-direction:column;align-items:center;line-height:1.35}
.res .sets em{font-style:normal;font-weight:600}
.res .meta{grid-column:1/-1;color:var(--muted);font-size:.74rem;margin-top:4px}

/* Drawer */
.drawer{position:fixed;inset:0;display:flex;justify-content:flex-end;z-index:10;background:color-mix(in srgb,#0a1419 40%,transparent)}
.drawer .panel{width:min(420px,100%);height:100%;background:var(--surface);padding:calc(20px + env(safe-area-inset-top,0px)) 20px 24px;overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:-8px 0 30px rgba(0,0,0,.18);border-left:3px solid var(--court)}
.drawer h2{font:600 1.45rem/1.15 var(--f-display);margin:0;text-wrap:balance}
.drawer .when{font:400 .85rem var(--f-mono);color:var(--muted)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0}
.kv dt{color:var(--muted);font-size:.8rem;padding-top:1px}
.kv dd{margin:0}
.vs{display:flex;flex-direction:column;gap:8px;border-block:1px solid var(--line);padding-block:12px}
.vs .side b{display:block;font-weight:600}
.vs .side small{color:var(--muted)}
.vs .sep{font:500 .75rem var(--f-display);color:var(--muted);letter-spacing:.1em}
.drawer a{color:var(--court)}
.drawer .close{align-self:flex-end}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.8rem;color:var(--muted)}
.field input{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-tile);padding:8px 11px;width:100%}
.hint{color:var(--muted);font-size:.8rem;margin:0}

/* Player profiles */
.plink{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 35%,transparent);text-underline-offset:2px;cursor:pointer}
.plink:hover{color:var(--court);text-decoration-color:currentColor}
.prof{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center}
.prof .av{grid-row:span 2;width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--court-soft);border:2px solid var(--line)}
.prof .av.ph{display:grid;place-items:center;font:600 1.4rem var(--f-display);color:var(--court)}
.prof h2{margin:0}
.prof .where{color:var(--muted);font-size:.85rem}
.pstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pstats div{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-tile);padding:8px 10px;display:flex;flex-direction:column}
.pstats b{font:600 1.35rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.pstats span{color:var(--muted);font-size:.72rem}
.psec h3{font:500 .95rem var(--f-display);margin:0 0 6px;color:var(--muted)}
.form{display:flex;gap:5px}
.form i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 .72rem var(--f-body);font-style:normal;color:#fff}
.form .w{background:var(--l3)}.form .l{background:var(--now)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;border:1px solid var(--line);border-radius:var(--r-tile);padding:7px 10px;font-size:.84rem}
.plist li .d{color:var(--muted);font:400 .74rem var(--f-mono);white-space:nowrap}
.plist li .who{min-width:0;overflow:hidden;text-overflow:ellipsis}
.plist li .who small{display:block;color:var(--muted);font-size:.74rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist li .s{font:500 .8rem var(--f-mono);white-space:nowrap}
.plist li.w .s{color:var(--l3)}.plist li.l .s{color:var(--now)}
@media (max-width:420px){.pstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* Booking */
/* Result entry */
.score{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,44px);gap:6px 6px;align-items:center}
.score .hd{font-size:.72rem;color:var(--muted);text-align:center}
.score .tm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.score .tm small{display:block;font-weight:400;color:var(--muted);font-size:.72rem;overflow:hidden;text-overflow:ellipsis}
.score input{width:44px;text-align:center;font:500 1.05rem var(--f-mono);border:1px solid var(--line);background:var(--surface);border-radius:var(--r-tile);padding:6px 0}
.score input:focus-visible{outline:2px solid var(--court);outline-offset:0}
.recap{font-weight:500}
.recap .sets{font-family:var(--f-mono)}
.confirm{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:var(--r-panel);padding:14px;background:var(--court-soft)}
.confirm .price{font:600 1.5rem var(--f-display);font-variant-numeric:tabular-nums;color:var(--court)}
.msg{font-size:.85rem;margin:0}
.msg.err{color:var(--now)}
.msg.ok{color:var(--l3)}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="brand">
      <img class="logo" src="icon.svg" alt="" width="44" height="44">
      <h1 id="clubName">Padel Radar</h1>

let lang = (() => { try { const v = JSON.parse(localStorage.getItem('pw.lang')); return v === 'en' ? 'en' : 'hr'; } catch(e) { return 'hr'; } })();
function t(key, vars){
  let s = (I18N[lang] && I18N[lang][key]) ?? I18N.en[key] ?? key;
  if (vars) for (const k in vars) s = s.split('{'+k+'}').join(vars[k]);
  return s;
}
// Croatian plurals: 1, 21, 31 → one; 2-4, 22-24 → few; everything else → many (English: one / many).
function tn(key, count, vars){
  const n10 = count % 10, n100 = count % 100;
  const form = lang === 'hr'
    ? (n10 === 1 && n100 !== 11 ? 'one' : (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) ? 'few' : 'many')
    : (count === 1 ? 'one' : 'many');
  return t(key + '_' + form, { n: count, ...(vars||{}) });
}
const LOC = () => t('locale');
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
function dayShort(d){ return cap(d.toLocaleDateString(LOC(), { weekday:'short' }).replace('.', '')); }
function dateLong(d){ return d.toLocaleDateString(LOC(), { weekday:'long', day:'numeric', month:'long' }); }
// Static markup: data-i18n (text), data-i18n-aria (aria-label), data-i18n-title (title).
function applyStaticText(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = t(el.dataset.i18nTitle));
  document.getElementById('credit').innerHTML = t('credit', { yr: '<a href="https://www.yr.no/" target="_blank" rel="noopener">Yr</a>' });
  const lb = document.getElementById('langBtn'); lb.textContent = t('switchTo'); lb.setAttribute('aria-label', t('switchAria'));
}

/* ---------- helpers ---------- */
function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// Sporty+ encodes times as decimal hours ×100: 850 = 8:30, 1450 = 14:30
function hrs(t){ return t/100; }
function hm(t){ const h = Math.floor(t/100), m = Math.round((t%100)*0.6); return h+':'+String(m).padStart(2,'0'); }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function rangeText(m){ const f = d => d.toLocaleDateString(LOC(),{day:'numeric',month:'short'}); return f(m)+' – '+f(addDays(m,6)); }
function sameDay(a,b){ return ymd(a)===ymd(b); }

async function api(path, body){
  const h = { 'Accept':'application/json', 'x-club': String(cfg.club) };
  if (cfg.token) h.Authorization = cfg.token.startsWith('Bearer') ? cfg.token : 'Bearer '+cfg.token;
  const opt = { headers:h };
  if (body !== undefined) { opt.method = 'POST'; h['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(API+path, opt);
  if (!r.ok) {
    let msg = ''; try { const j = await r.json(); msg = j.error || j.message || ''; } catch(_){}
    const e = new Error(msg || (r.status+' '+path)); e.status = r.status; e.apiMessage = msg; throw e;
  }
  const txt = await r.text(); try { return JSON.parse(txt); } catch(_) { return txt; }
}

/* ---------- weather: MET Norway / yr.no locationforecast ----------
   Hourly for ~2.5 days, then every 6 hours up to ~9 days. Cached for 30 minutes per club. */
/* Courts with a Matchi TV camera (Sporty+ court id -> stream link). Only Padel otvoreni for now. */
/* Outdoor courts get the rain plan. Sporty+ has no indoor/outdoor flag (both courts are "open"), so it's set here. */
const COURT_TYPES = { 797: 'indoor', 798: 'outdoor' };   // Padel Dvorana, Padel otvoreni
const OUTDOOR_COURTS = new Set(Object.keys(COURT_TYPES).filter(id => COURT_TYPES[id] === 'outdoor').map(Number));
// Shown name: "Indoor court" / "Vanjski teren" for known courts, the Sporty+ name otherwise.
function courtLabel(c){ const k = COURT_TYPES[c.id]; return k ? t('court_' + k) : c.name; }
// Mid-sentence: English lower-cases it ("The indoor court is free"); Croatian keeps the capital at sentence start.
function courtInSentence(c){ return lang === 'en' && COURT_TYPES[c.id] ? courtLabel(c).toLowerCase() : courtLabel(c); }
function courtShortLabel(c){ const k = COURT_TYPES[c.id]; return k ? t('courtShort_' + k) : c.name.replace(/^padel\s+/i, '').replace(/^./, x => x.toUpperCase()); }
const COURT_CAMERAS = { 798: 'https://www.matchi.tv/create-stream/start?id=9i2bjHsKpf3&v2' };

const WX_ICONS = 'https://cdn.jsdelivr.net/gh/metno/weathericons@89e3173756248b4696b9b10677b66c4ef435db53/weather/svg/';
function wxText(code){ const k = code.replace(/_(day|night|polartwilight)$/,''); const v = t('wx_'+k); return v !== 'wx_'+k ? v : t('wx_other'); }
function setWeather(raw){
  state.wx = (raw||[]).map(x => ({ t:x.t, temp:x.temp, wind:x.wind, sym:x.sym, rain:x.rain, span:x.span }));
}
function loadCachedWeather(){ const c = store.get('wx.'+cfg.club, null); if (c && Array.isArray(c.series)) { setWeather(c.series); return c.at; } return 0; }
async function loadWeather(){
  const lat = parseFloat(state.club?.latitude), lon = parseFloat(state.club?.longitude);
  if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
  const cached = store.get('wx.'+cfg.club, null);
  if (cached && Date.now() - cached.at < 30*60_000 && cached.lat===lat && cached.lon===lon) return;
  try {
    const r = await fetch(`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${lat.toFixed(2)}&lon=${lon.toFixed(2)}`, { headers:{ Accept:'application/json' } });
    if (!r.ok) return;
    const j = await r.json();
    const series = (j.properties?.timeseries || []).map(p => {
      const nx = p.data.next_1_hours ? { d:p.data.next_1_hours, span:1 } : p.data.next_6_hours ? { d:p.data.next_6_hours, span:6 } : null;
      return { t: Date.parse(p.time), temp: p.data.instant.details.air_temperature, wind: p.data.instant.details.wind_speed,
               sym: nx?.d.summary?.symbol_code || null, rain: nx?.d.details?.precipitation_amount ?? null, span: nx?.span || 1 };
    }).filter(x => x.sym);
    setWeather(series);
    store.set('wx.'+cfg.club, { at: Date.now(), lat, lon, series });
    render();
  } catch(e){ /* weather is a nice-to-have; the schedule works without it */ }
}
// The forecast point covering a slot's start time, or null for past slots and beyond the forecast range.
function weatherFor(s){
  const wx = state.wx; if (!wx || !wx.length) return null;
  const start = slotDate(s).getTime();
  if (slotEnd(s).getTime() < Date.now()) return null;
  let best = null;
  for (const x of wx) { if (x.t <= start) best = x; else break; }
  if (!best) best = wx[0].t - start <= 3600_000 ? wx[0] : null;
  if (!best || start - best.t >= best.span*3600_000) return null;
  return best;
}
// Rain over the whole slot (it can span two hourly points), for outdoor courts only.
function rainFor(s){
  if (!OUTDOOR_COURTS.has(s.court.id) || !state.wx || !state.wx.length) return null;
  const a = slotDate(s).getTime(), b = slotEnd(s).getTime();
  if (b < Date.now()) return null;
  const pts = state.wx.filter(x => x.t < b && x.t + x.span*3600_000 > a);
  if (!pts.length) return null;
  let mm = 0;
  for (const x of pts) { const lo = Math.max(a, x.t), hi = Math.min(b, x.t + x.span*3600_000); mm += (x.rain || 0) * (hi - lo) / (x.span*3600_000); }
  mm = Math.round(mm * 10) / 10;
  const wetSym = pts.find(x => /rain|sleet|snow|thunder/.test(x.sym));
  return { mm, wet: mm >= 0.5 || !!wetSym, sym: (wetSym || pts[0]).sym, six: pts.some(x => x.span > 1) };
}
// Indoor alternative at the same start time, or the nearest free indoor slot that day.
function indoorAlternative(s){
  const day = state.days.find(d => sameDay(d.date, s.date)); if (!day) return null;
  const now = Date.now();
  const free = day.slots.filter(x => x.kind==='free' && !OUTDOOR_COURTS.has(x.court.id) && slotDate(x).getTime() > now);
  const same = free.find(x => x.start === s.start);
  if (same) return { slot: same, same: true };
  const near = free.sort((x,y) => Math.abs(x.start - s.start) - Math.abs(y.start - s.start))[0];
  return near ? { slot: near, same: false } : null;
}
function rainPlan(s){
  const r = rainFor(s); if (!r || !r.wet) return '';
  const alt = indoorAlternative(s);
  const what = r.mm ? t('rainAmount', { mm: r.mm.toLocaleString(LOC()), min: Math.round((slotEnd(s)-slotDate(s))/60000) }) : t('rainSym', { desc: esc(wxText(r.sym)).toLowerCase() });
  let body = `<div>${t('rainDuring', { what, six: r.six ? t('rainSix') : '' })}</div>`;
  if (alt) body += `<div>${alt.same ? t('altSame', { court: esc(courtInSentence(alt.slot.court)) }) : t('altNear', { court: esc(courtInSentence(alt.slot.court)), t: hm(s.start), t2: hm(alt.slot.start) })}</div>
    <button class="btn primary" type="button" data-alt="${esc(slotKey(alt.slot))}">${t('playIndoors', { t: hm(alt.slot.start), price: alt.slot.price!=null ? ' · €'+alt.slot.price : '' })}</button>`;
  else body += `<div>${t('noIndoor')}</div>`;
  if (isMine(s) && s.booked) body += `<p class="hint">${t('cancelOutdoor')}</p>`;
  return `<div class="rainplan">${body}</div>`;
}

function wxBadge(s){
  const w = weatherFor(s); if (!w) return '';
  const rain = w.rain ? ', ' + t('rainMm', { mm: w.rain.toLocaleString(LOC()) }) + (w.span>1 ? t('inHours', { h: w.span }) : '') : '';
  return `<span class="wx" title="${esc(wxText(w.sym))}, ${Math.round(w.temp)} °C${rain}"><img src="${WX_ICONS}${w.sym}.svg" alt="${esc(wxText(w.sym))}" loading="lazy">${Math.round(w.temp)}°</span>`;
}

/* Results are public and carry team + player names (slots only carry team ids), but the
   endpoint is slow (~4-6 s per page), so they load in the background and are cached in a
   trimmed form so the next visit has names and scores straight away. */
function trimResult(r){
  const team = t => t && { id:t.id, display_name:t.display_name, players:(t.players||[]).map(p=>({id:p.id, display_name:p.display_name})) };
  return { id:r.id, date:r.date, sets:r.sets, winner_side:r.winner_side, winner_team_id:r.winner_team_id, game_id:r.game_id,
           official:r.official, verified:r.verified, game: r.game ? { round:r.game.round } : null, players:(r.players||[]).map(team) };
}
function setResults(list){
  const seen = new Set(); state.results = [];
  for (const r of list) {
    if (seen.has(r.id)) continue; seen.add(r.id); state.results.push(r);
    for (const t of r.players||[]) if (t) state.teams.set(t.id, t);
    if (r.game_id) state.resultsByGame.set(r.game_id, r);
  }
  state.results.sort((a,b)=> b.date.localeCompare(a.date));
}
function loadCachedResults(){ const c = store.get('results.'+cfg.club, null); if (c && Array.isArray(c)) setResults(c); }
async function loadResults(){
  const pages = await Promise.allSettled([1,2,3,4,5,6].map(p => api(`/v2/result?filter[club]=${cfg.club}&limit=50&page=${p}`)));
  const fresh = pages.flatMap(p => p.status==='fulfilled' ? p.value.data.map(trimResult) : []);
  if (!fresh.length) return;
  setResults(fresh);
  store.set('results.'+cfg.club, state.results);
}

/* ---------- weeks: cached in memory, prefetched, and the current one kept in localStorage ---------- */
const weekCache = new Map();      // monday ymd -> { at, days:[courts[] per day] }
const inflight = new Map();       // monday ymd -> Promise
const FRESH_MS = 60_000;
let showSeq = 0;

function fetchWeek(monday){
  const key = ymd(monday);
  if (inflight.has(key)) return inflight.get(key);
  const q = d => `/v2/court?filter[is_active]=1&filter[club_id]=${cfg.club}&page=1&limit=50&date=${ymd(d)}&parsed2=true` + (cfg.token?'':'&unauth=true');
  const p = Promise.all([...Array(7)].map((_,i) => api(q(addDays(monday,i)))))
    .then(res => {
      // keep only what the page uses, so the cache stays small
      const days = res.map(r => r.data.map(c => ({ id:c.id, name:c.name, reservation_duration:c.reservation_duration, parsed_reservations:c.parsed_reservations })));
      const entry = { at: Date.now(), days };
      weekCache.set(key, entry);
      if (key === ymd(mondayOf(new Date()))) store.set('week.'+cfg.club+'.'+(cfg.token?'auth':'anon'), { key, ...entry });
      return entry;
    })
    .finally(() => inflight.delete(key));
  inflight.set(key, p);
  return p;
}

function applyWeek(monday, entry){
  const dates = [...Array(7)].map((_,i)=>addDays(monday,i));
  const courts = new Map();
  state.days = entry.days.map((list,i) => {
    const slots = [];
    for (const c of list) {
      courts.set(c.id, { id:c.id, name:c.name, dur:c.reservation_duration });
      for (const s of Object.values(c.parsed_reservations||{})) if (!s.hidden) slots.push(normalize(s, c, dates[i]));
    }
    return { date: dates[i], slots };
  });
  state.courts = [...courts.values()];
  const ids = new Set(); state.days.forEach(d=>d.slots.forEach(s=>s.leagueId && ids.add(s.leagueId)));
  const missing = [...ids].filter(id => !state.leagues.has(id));
  if (missing.length) Promise.all(missing.map(loadLeague)).then(() => { if (ymd(state.monday)===ymd(monday)) render(); });
}

function setLoading(on){
  document.getElementById('status').className = 'status';
  document.getElementById('status').textContent = on ? t('loadingWeek') : '';
  document.querySelector('.board-scroll').classList.toggle('loading', on);
  document.getElementById('agenda').classList.toggle('loading', on);
}

// Show a week: instantly from cache when we have it, refreshing in the background if it's stale.
async function showWeek(monday, {force=false}={}){
  state.monday = monday;
  const seq = ++showSeq, key = ymd(monday), cached = weekCache.get(key);
  if (cached) { applyWeek(monday, cached); render(); }
  else { const r = document.getElementById('range'); if (r) r.textContent = rangeText(monday); }
  if (cached && !force && Date.now()-cached.at < FRESH_MS) { setLoading(false); prefetchAround(monday); return; }
  setLoading(!cached);
  try {
    const entry = await fetchWeek(monday);
    if (seq !== showSeq) return;           // user already moved to another week
    applyWeek(monday, entry); render();
    setLoading(false);
    prefetchAround(monday);
  } catch(e) {
    if (seq !== showSeq) return;
    setLoading(false);
    if (!cached){ state.days = []; state.courts = []; render(); }
    const status = document.getElementById('status');
    status.className='status err';
    status.textContent = e.status===401 ? t('tokenRefused') : t('loadFail', { msg: e.message });
  }
}
function prefetchAround(monday){
  for (const d of [7,-7,14]) { const m = addDays(monday,d), c = weekCache.get(ymd(m)); if (!c || Date.now()-c.at > FRESH_MS) fetchWeek(m).catch(()=>{}); }
}
// Used after a booking: refetch the visible week.
async function loadWeek(){ weekCache.delete(ymd(state.monday)); await showWeek(state.monday, {force:true}); }

function normalize(s, court, date){
  const booked = !!s.id;
  const start = booked ? s.start_time : s.time;
  const end = booked ? s.end_time : s.time + (court.reservation_duration/60)*100;
  const comp = s.competition?.object || {};
  const teamIds = [...new Set((s.players||[]).map(p=>p.team_id).filter(Boolean))];
  return {
    raw:s, court, date, booked, start, end,
    price: s.price, leagueId: comp.league_id || null, tournamentId: comp.tournament_id || null,
    kind: !booked ? 'free' : (comp.league_id || comp.tournament_id) ? 'league' : 'booking',
    teamIds, players: s.players||[], recurring: !!s.recurring, openSeats: s.open_seats||0,
    waiting: (s.waiting_list||[]).length, byClub: s.type==='in_behalf', gameId: s.game_id, id: s.id
  };
}

/* ---------- naming ---------- */
function leagueName(id){ return cfg.nick[id] || state.leagues.get(id)?.name || t('leagueN', { id }); }
function leagueColor(id){
  const ids = [...state.leagues.keys()].sort((a,b)=>a-b);
  return `var(${LEAGUE_COLORS[Math.max(0,ids.indexOf(id)) % LEAGUE_COLORS.length]})`;
}
function teamName(id){ return state.teams.get(id)?.display_name || null; }
function teamPlayers(id){ return (state.teams.get(id)?.players||[]).map(p=>p.display_name).join(', '); }
// Player names as profile links (plain text when Sporty+ didn't give us the player's id).
function playerLink(pl){ return pl && pl.id ? `<button type="button" class="plink" data-player="${pl.id}" aria-label="${esc(t('openProfile', { name: pl.display_name }))}">${esc(pl.display_name)}</button>` : esc(pl?.display_name || ''); }
function playersHtml(list){ return (list||[]).map(playerLink).join(', '); }
function namedPlayers(s){ return s.players.map(p=>p.display_name).filter(Boolean); }
// A booking is yours when you or your team is on it (player ids are only visible with a login token).
function isMine(s){
  const m = state.me; if (!m || !s.booked) return false;
  const teamId = m.team?.id;
  return s.players.some(p => (p.id && p.id===m.id) || (teamId && p.team_id===teamId));
}
function freePrices(){ return allSlots().filter(x=>x.kind==='free' && x.price!=null).map(x=>x.price); }
function slotClass(s){ return s.kind + (isMine(s)?' mine':'') + (rainFor(s)?.wet ? ' wet' : '') + (s.kind==='free' && s.price!=null && s.price === state.peak && state.low < state.peak ? ' peak' : ''); }
function slotTitle(s){
  if (s.kind==='free') return s.price!=null ? t('freePrice', { p: s.price }) : t('free');
  if (s.kind==='league'){
    const names = s.teamIds.map(teamName);
    if (s.teamIds.length===2 && names.every(Boolean)) return names.join(' – ');
    if (names.some(Boolean)) return names.filter(Boolean).join(' – ');
    return t('leagueMatch');
  }
  if (isMine(s)) return t('yourBooking');
  const np = namedPlayers(s);
  if (np.length) return np.join(', ');
  return s.byClub ? t('clubBooking') : t('booked');
}
function filterKey(s){ return s.kind==='league' ? 'L'+(s.leagueId||'t'+s.tournamentId) : s.kind; }
function scoreLine(r){ return (r.sets||[]).filter(x=>x[0]||x[1]).map(x=>x[0]+'-'+x[1]).join(' '); }

/* ---------- court switch ---------- */
function shownCourts(){
  const one = state.courts.filter(c => String(c.id) === String(cfg.court));
  return cfg.court === 'all' || !one.length ? state.courts : one;
}
function inCourt(s){ const c = shownCourts(); return c.length === state.courts.length || c.some(x => x.id === s.court.id); }
function renderCourtBar(){
  const el = document.getElementById('courtBar');
  if (state.courts.length < 2) { el.innerHTML = ''; return; }
  const sel = shownCourts().length === 1 ? String(shownCourts()[0].id) : 'all';
  const now = new Date();
  const freeToday = id => allSlots().filter(s => s.kind==='free' && sameDay(s.date, now) && slotEnd(s) >= now && (id==='all' || s.court.id===id)).length;
  const opts = [['all',t('allCourts')], ...state.courts.map(c => [String(c.id), courtShortLabel(c)])];
  const one = sel !== 'all' ? state.courts.find(c => String(c.id) === sel) : null;
  const n = freeToday(one ? one.id : 'all');
  el.innerHTML = `<div class="seg" role="group" aria-label="${t('showCourts')}">${opts.map(([v,l]) => `<button type="button" data-court="${v}" aria-pressed="${v===sel}">${esc(l)}</button>`).join('')}</div>
    <span class="courtnote">${one ? esc(courtLabel(one))+' · ' : ''}${tn('freeToday', n)}${one && COURT_CAMERAS[one.id] ? ' · <span class="cam"><i aria-hidden="true"></i>'+t('camera')+'</span>' : ''}</span>`;
  el.querySelectorAll('[data-court]').forEach(b => b.onclick = () => { cfg.court = b.dataset.court; store.set('court', cfg.court); render(); });
}

/* ---------- render ---------- */
function render(){
  document.getElementById('range').textContent = rangeText(state.monday);
  const fp = freePrices(); state.peak = fp.length ? Math.max(...fp) : 0; state.low = fp.length ? Math.min(...fp) : 0;
  renderCourtBar(); renderSummary(); renderFilters(); renderBoard(); renderAgenda();
}

function visible(s){
  if (!inCourt(s)) return false;
  if (s.kind==='free' && slotEnd(s) < new Date()) return false;
  return !cfg.hidden[filterKey(s)];
}

function bookingPayload(s){
  // Same shape the official app sends for a booking in your own name; times are the slot objects as /v2/court returns them.
  const me = state.me?.team ? state.me.team : {};
  return { date: ymd(s.date), times:[s.raw], players:[me, {}], repeat:0, group:{}, every_other_week:false, court_id: s.court.id,
           name:'', monthly_prepayment:false, version:'20250422', cart:[] };
}

function myName(){ const m = state.me; return m ? (m.display_name || [m.first_name, m.last_name].filter(Boolean).join(' ')) : ''; }

function bookingSection(s){
  if (s.kind!=='free' || slotDate(s) < new Date()) return '';
  if (!cfg.token) return `<div class="confirm"><b>${t('wantCourt')}</b><p class="hint">${t('loginToBookHint')}</p><button class="btn primary" type="button" onclick="openLogin()" style="align-self:flex-start">${t('loginToBook')}</button></div>`;

    <div><div class="hint">${t('bookForYourself')}</div><b>${esc(myName() || t('inYourName'))}</b></div>

    <p class="hint">${t('paidAtClub')}</p>
    <button class="btn primary" id="bookGo" style="align-self:flex-start">${t('bookBtn', { t: esc(hm(s.start)), court: esc(courtLabel(s.court)) })}</button>

/* ---------- Enter a result for your own past match ----------
   Same request the official app sends from a booking: POST /v2/result with the booking's game id,
   both teams, and five [a,b] sets (unplayed sets stay 0-0). Scores follow the order of the players array. */
function canEnterResult(s){
  return !!(cfg.token && state.me && s.booked && s.gameId && isMine(s) && slotEnd(s) < new Date()
    && !state.resultsByGame.has(s.gameId) && s.teamIds.length === 2);
}
function teamLabel(id){ return teamName(id) || (state.me?.team?.id === id ? t('yourTeam') : t('teamN', { id })); }
function resultSection(s){
  if (!cfg.token || !state.me || !s.booked || !isMine(s) || slotEnd(s) >= new Date() || state.resultsByGame.has(s.gameId)) return '';
  if (!canEnterResult(s)) return `<p class="hint">${t('resultNeedTeams')}</p>`;
  const row = (id, i) => `<span class="tm">${esc(teamLabel(id))}${teamPlayers(id)?`<small>${esc(teamPlayers(id))}</small>`:''}</span>` +
    [0,1,2].map(k => `<input id="sc${i}${k}" inputmode="numeric" maxlength="1" aria-label="${esc(t('setAria', { team: teamLabel(id), n: k+1 }))}" autocomplete="off">`).join('');
  return `<div class="confirm" id="resBox">
    <div><div class="hint">${t('yourMatch')}</div><b>${t('enterResult')}</b></div>
    <div class="score"><span></span>${[1,2,3].map(k => `<span class="hd">${t('setN', { n: k })}</span>`).join('')}
      ${row(s.teamIds[0],0)}${row(s.teamIds[1],1)}</div>
    <p class="hint">${t('leaveSet3')}</p>
    <button class="btn primary" id="resGo" type="button" style="align-self:flex-start">${t('reviewResult')}</button>
    <p class="msg" id="resMsg" aria-live="polite"></p></div>`;
}
// Returns { sets:[[a,b]x5], error } after checking it looks like a real padel score.
function readScore(){
  const v = (i,k) => document.getElementById('sc'+i+k).value.trim();
  const sets = [], won = [0,0];
  for (let k = 0; k < 3; k++) {
    const a = v(0,k), b = v(1,k);
    if (a === '' && b === '') { if (k < 2) return { error: t('errTwoSets') }; continue; }
    if (a === '' || b === '') return { error: t('errBoth', { n: k+1 }) };
    const x = +a, y = +b;
    if (!Number.isInteger(x) || !Number.isInteger(y) || x > 7 || y > 7) return { error: t('errRange', { n: k+1 }) };
    const hi = Math.max(x,y), lo = Math.min(x,y);
    if (!((hi === 6 && lo <= 4) || (hi === 7 && (lo === 5 || lo === 6)))) return { error: t('errUnfinished', { n: k+1, x, y }) };
    if (k === 2 && won[0] !== won[1]) return { error: t('errDecided') };
    won[x > y ? 0 : 1]++; sets.push([x,y]);
  }
  if (won[0] === won[1]) return { error: t('errWinner') };
  while (sets.length < 5) sets.push([0,0]);
  return { sets, winner: won[0] > won[1] ? 0 : 1 };
}
function wireResult(s){
  const go = document.getElementById('resGo'); if (!go) return;
  const msg = document.getElementById('resMsg');
  const inputs = [...document.querySelectorAll('#resBox input')];
  let armed = null;
  const disarm = () => { if (armed) { armed = null; go.textContent = t('reviewResult'); msg.className = 'msg'; msg.textContent = ''; } };
  inputs.forEach((el, n) => {
    el.addEventListener('input', () => { el.value = el.value.replace(/[^0-9]/g,''); disarm(); if (el.value && inputs[n+1]) inputs[n+1].focus(); });
  });
  inputs[0].focus();
  go.onclick = async () => {
    if (!armed) {
      const r = readScore();
      if (r.error) { msg.className = 'msg err'; msg.textContent = r.error; return; }
      armed = r;
      const line = r.sets.filter(x => x[0]||x[1]).map(x => x[0]+'-'+x[1]).join(' ');
      msg.className = 'msg';
      msg.innerHTML = `<span class="recap">${t('wonLine', { team: esc(teamLabel(s.teamIds[r.winner])), sets: `<span class="sets">${line}</span>` })}</span><br>${t('officialNote')}`;
      go.textContent = t('submitResult');
      return;
    }
    go.disabled = true; go.textContent = t('submitting');
    const payload = {
      created_at: new Date().toISOString(), verified: null, points: 0, surface: {},
      game_id: s.gameId,
      players: s.teamIds.map(id => ({ id, type: 'team' })),
      sets: armed.sets, tie_break: armed.sets.map(() => [0,0])
    };
    try {
      const res = await api('/v2/result', payload);
      const saved = res && (res.data || res);
      if (saved && saved.id) {
        const t = trimResult({ ...saved,
          game_id: saved.game_id || s.gameId,
          date: saved.date || ymd(new Date()) + ' ' + new Date().toTimeString().slice(0,8),
          sets: saved.sets || payload.sets,
          winner_side: saved.winner_side ?? armed.winner,
          players: saved.players || s.teamIds.map(id => state.teams.get(id) || { id, display_name: teamLabel(id) }) });
        setResults([t, ...state.results]); store.set('results.'+cfg.club, state.results);
      }
      msg.className = 'msg ok'; msg.textContent = t('resultSaved');
      go.hidden = true; inputs.forEach(el => el.disabled = true);
      render();
      loadResults().then(() => { render(); if (!document.getElementById('resultsView').hidden) renderResults(); });
    } catch(e) {
      msg.className = 'msg err';
      msg.textContent = e.status===401 ? t('loginExpired') : t('resultRefused', { msg: e.apiMessage || e.message });
      go.disabled = false; go.textContent = t('submitResult');
    }
  };
}

function renderBoard(){
  const board = document.getElementById('board');
  if (!state.days.length){ board.innerHTML=''; return; }
  const all = allSlots();
  const courts = shownCourts(), single = courts.length === 1 && state.courts.length > 1;
  board.classList.toggle('one', single);
  const min = Math.floor(Math.min(...all.map(s=>hrs(s.start)), 8));
  const max = Math.ceil(Math.max(...all.map(s=>hrs(s.end)), 22));
  const H = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour'));
  const height = (max-min)*H;
  const now = new Date();
  let html = `<div class="corner"></div>`;
  state.days.forEach((d,i)=>{
    const t = sameDay(d.date, now);
    html += `<div class="dayhead${t?' today':''}"><div class="d">${dayShort(d.date)} <small>${d.date.getDate()}.${d.date.getMonth()+1}.</small></div>
      <div class="lanes-h">${courts.map(c=>`<span title="${esc(c.name)}">${esc(courtLabel(c))}</span>`).join('')}</div></div>`;
  });
  html += `<div class="axis" style="height:${height}px">${[...Array(max-min+1)].map((_,i)=>i&&i<max-min?`<span style="top:${i*H}px">${min+i}:00</span>`:'').join('')}</div>`;
  state.days.forEach((d)=>{
    const t = sameDay(d.date, now);
    html += `<div class="daycol${t?' today':''}" style="height:${height}px">`;
    for (const c of courts){
      html += `<div class="lane">`;
      for (const s of d.slots.filter(s=>s.court.id===c.id && visible(s))){
        const top = (hrs(s.start)-min)*H, h = (hrs(s.end)-hrs(s.start))*H - 3;
        const style = `top:${top+1}px;height:${h}px;${s.kind==='league'?'--c:'+leagueColor(s.leagueId):''}`;
        const past = slotEnd(s) < now ? ' past':'';
        html += `<button class="slot ${slotClass(s)}${past}" style="${style}" data-id="${slotKey(s)}">${slotInner(s,!single)}</button>`;
      }
      html += `</div>`;
    }
    if (t){ const nh = now.getHours()+now.getMinutes()/60; if (nh>=min && nh<=max) html += `<div class="now" style="top:${(nh-min)*H}px"></div>`; }
    html += `</div>`;
  });
  board.innerHTML = html;
  board.querySelectorAll('.slot').forEach(b=>b.onclick=()=>openSlot(b.dataset.id));
}

const icsEsc = t => String(t).replace(/\\/g,'\\\\').replace(/[,;]/g, m => '\\'+m).replace(/\n/g,'\\n');
const icsTime = d => d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');

  try { history.replaceState(null, '', '#s=' + encodeURIComponent(key)); } catch(e){}
  const rn = document.getElementById('renameL');
  if (rn) rn.onclick = () => {
    const dd = rn.parentElement;
    dd.innerHTML = `<div class="field"><input id="nickIn" value="${esc(cfg.nick[s.leagueId]||state.leagues.get(s.leagueId)?.name||'')}" placeholder="${t('nickPlaceholder')}"><button class="btn primary" id="nickSave" style="align-self:flex-start">${t('saveName')}</button></div>`;
    const inp = document.getElementById('nickIn'); inp.focus();
    const save = () => { const v = inp.value.trim(); if (v) cfg.nick[s.leagueId]=v; else delete cfg.nick[s.leagueId]; store.set('nick',cfg.nick); render(); openSlot(key); };
    document.getElementById('nickSave').onclick = save; inp.onkeydown = e=>{ if(e.key==='Enter') save(); };
  };
}

/* ---------- Log in with your Sporty+ account ----------
   Same flow as the official app: the password goes straight from this browser to Sporty+
   (api.sporty.plus) and is never stored. Only the returned session token is kept, in this browser. */
const AUTH = 'https://api.sporty.plus/api/v3';
async function authPost(path, body, token){
  const h = { 'Accept':'application/json', 'Content-Type':'application/json' };
  if (token) h.Authorization = token;
  const r = await fetch(AUTH+path, { method:'POST', headers:h, body: JSON.stringify(body||{}) });
  let j = {}; try { j = await r.json(); } catch(_){}
  if (!r.ok) {
    const e = new Error(j.errors?.[0]?.detail || j.message || j.error || t('sportyAnswered', { s: r.status }));
    e.status = r.status; e.data = j; throw e;
  }
  return j;
}
function loginErrorText(e){
  if (e.status===429) return t('tooMany');
  if (e.status===422) return e.message.includes('credentials') ? t('badCreds') : e.message;
  if (!e.status) return t('noReach');
  return e.message || t('noReach');
}
async function useToken(raw){
  cfg.token = raw.startsWith('Bearer') ? raw : 'Bearer '+raw;
  store.set('token', cfg.token);
  state.teams.clear(); state.resultsByGame.clear(); state.leagues.clear(); weekCache.clear();
  await loadMe(); updateAccountBtn(); boot();
}
function updateAccountBtn(){
  const b = document.getElementById('accountBtn');
  b.textContent = state.me ? (myName().split(' ')[0] || t('account')) : (cfg.token ? t('account') : t('login'));
  b.classList.toggle('solid', !cfg.token);
}

function openLogin(){
  if (cfg.token) return openAccount();
  openDrawer(`<h2>${t('loginTitle')}</h2>
    <p class="hint">${t('loginHint', { club: esc(state.club?.name || t('theClub')) })}</p>
    <form id="loginForm" class="wrap" style="padding:0;gap:12px" novalidate>
      <div class="field"><label for="lEmail">${t('email')}</label><input id="lEmail" type="email" autocomplete="username" placeholder="ana.horvat@gmail.com" required></div>
      <div class="field"><label for="lPass">${t('password')}</label><input id="lPass" type="password" autocomplete="current-password" required></div>
      <div class="field" id="lCodeRow" hidden><label for="lCode">${t('codeLabel')}</label><input id="lCode" inputmode="numeric" autocomplete="one-time-code" placeholder="123456"></div>
      <button class="btn primary" id="lGo" type="submit" style="align-self:flex-start">${t('login')}</button>
      <p class="msg" id="lMsg" aria-live="polite"></p>
    </form>`);
  const f = document.getElementById('loginForm'), msg = document.getElementById('lMsg'), go = document.getElementById('lGo');
  let challenge = null;
  document.getElementById('lEmail').focus();
  f.onsubmit = async (ev) => {
    ev.preventDefault();
    const email = document.getElementById('lEmail').value.trim(), pass = document.getElementById('lPass').value;
    const code = document.getElementById('lCode').value.trim();
    msg.className = 'msg err';
    if (!challenge && (!email || !pass)) { msg.textContent = t('errEmailPass'); return; }
    if (challenge && !code) { msg.textContent = t('errCode'); return; }
    go.disabled = true; go.textContent = t('loggingIn'); msg.textContent = '';
    try {
      const r = challenge
        ? await authPost('/login/two-factor-challenge', { challenge, code, recovery_code: null })
        : await authPost('/login', { client:'native', email, password: pass });
      if (!r.token) throw new Error(t('noSession'));
      msg.className = 'msg ok'; msg.textContent = t('loggedIn');
      await useToken(r.token);
      setTimeout(closeDrawer, 600);
    } catch(e) {
      if (!challenge && e.data && e.data.error==='two_factor_required' && e.data.challenge) {
        challenge = e.data.challenge;
        document.getElementById('lCodeRow').hidden = false; document.getElementById('lCode').focus();
        msg.className = 'msg'; msg.textContent = t('twoStep');
      } else msg.textContent = challenge && e.status===422 ? t('badCode') : loginErrorText(e);
      go.disabled = false; go.textContent = challenge ? t('confirmCode') : t('login');
    }
  };
}

function logout(){
  const tok = cfg.token;
  cfg.token = ''; store.set('token',''); state.me = null;
  authPost('/logout', {}, tok).catch(()=>{});   // end the session on Sporty+ too; logging out here works either way
  state.teams.clear(); state.resultsByGame.clear(); state.leagues.clear(); weekCache.clear(); profileCache.clear();
  closeDrawer(); updateAccountBtn(); boot();
}
function openAccount(){
  if (state.me?.id) return openProfile(state.me.id);
  openDrawer(`<h2>${esc(myName() || t('yourAccount'))}</h2>
    <p class="hint">${t('accountHint')}</p>
    <button class="btn" id="logoutBtn" style="align-self:flex-start">${t('logout')}</button>`);
  document.getElementById('logoutBtn').onclick = logout;
}

/* ---------- player profiles ----------
   Like the official app, profiles are for logged-in members. We show only what other members see there:
   name, photo, city and country, plus statistics from published results. Email, phone, birth year, age range and
   ranking are never shown (Modesto hides personal data and ranks). */
const profileCache = new Map();   // 'p'+id -> { at, player }, 'r'+id -> { at, results, total }
const FRESH_PROFILE = 5*60_000;
async function cached(key, load){ const c = profileCache.get(key); if (c && Date.now() - c.at < FRESH_PROFILE) return c; const v = { at: Date.now(), ...(await load()) }; profileCache.set(key, v); return v; }
const loadPlayer = id => cached('p'+id, async () => { const pl = await api(`/v2/player/${id}`); return { player: pl.data || pl }; });
const loadPlayerResults = id => cached('r'+id, async () => { const rs = await api(`/v2/result?filter[player]=${id}&limit=50&page=1`); return { results: (rs.data || []).map(trimResult), total: rs.meta?.total ?? (rs.data||[]).length }; });
// One player's view of a result: which side they were on, partner(s), opponents, win/loss, sets.
function resultFor(r, id){
  const side = (r.players||[]).findIndex(tm => (tm?.players||[]).some(x => x.id === id) || tm?.id === id);
  if (side < 0) return null;
  const mine = r.players[side], other = r.players[1-side];
  const sets = (r.sets||[]).filter(x => x[0]||x[1]);
  const setsWon = sets.filter(x => side === 0 ? x[0] > x[1] : x[1] > x[0]).length;
  return { r, side, won: r.winner_side === side, partners: (mine?.players||[]).filter(x => x.id !== id), opponents: other?.players?.length ? other.players : (other ? [other] : []),
           score: sets.map(x => side === 0 ? x[0]+'-'+x[1] : x[1]+'-'+x[0]).join(' '), setsWon, setsLost: sets.length - setsWon };
}
function initials(name){ return (name||'?').split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase(); }
async function openProfile(id){
  id = Number(id);
  const self = state.me?.id === id;
  if (!cfg.token) {
    openDrawer(`<h2>${t('profile')}</h2><p class="hint">${t('profileLogin')}</p><button class="btn primary" type="button" id="pfLogin" style="align-self:flex-start">${t('profileLoginBtn')}</button>`);
    document.getElementById('pfLogin').onclick = openLogin; return;
  }
  const token = Symbol(); openProfile.current = token;   // ignore late answers for a profile that's no longer open
  openDrawer(`<h2>${self ? t('myProfile') : t('profile')}</h2><p class="hint">${t('profileLoading')}</p>`);
  panel.dataset.key = '';
  const resultsP = loadPlayerResults(id);   // slow endpoint: start it now, render it when it lands
  let pl;
  try { pl = (await loadPlayer(id)).player; } catch(e) {
    if (openProfile.current !== token || drawer.hidden) return;
    openDrawer(`<h2>${t('profile')}</h2><p class="msg err">${e.status===401 ? t('tokenRefusedShort') : t('profileFail')}</p>`); return;
  }
  if (openProfile.current !== token || drawer.hidden) return;
  renderProfile(id, pl, null, self);
  let data = null;
  try { data = await resultsP; } catch(e) { data = { results: [], total: 0, failed: true }; }
  if (openProfile.current !== token || drawer.hidden) return;
  renderProfile(id, pl, data, self);
}
function renderProfile(id, pl, data, self){
  const scroll = panel.scrollTop;
  const name = pl.display_name || [pl.first_name, pl.last_name].filter(Boolean).join(' ');
  const mine = (data?.results || []).map(r => resultFor(r, id)).filter(Boolean).sort((a,b) => b.r.date.localeCompare(a.r.date));
  const wins = mine.filter(x => x.won).length, losses = mine.length - wins;
  const sw = mine.reduce((a,x) => a + x.setsWon, 0), sl = mine.reduce((a,x) => a + x.setsLost, 0);
  const partners = new Map();
  for (const x of mine) for (const pp of x.partners) { const e = partners.get(pp.id) || { pl: pp, n: 0, w: 0 }; e.n++; if (x.won) e.w++; partners.set(pp.id, e); }
  const topPartners = [...partners.values()].sort((a,b) => b.n - a.n).slice(0,3);
  const where = [pl.city?.name, pl.country ? ((pl.country.emoji ? pl.country.emoji+' ' : '') + pl.country.name) : null].filter(Boolean).join(' · ');
  const av = pl.image ? `<img class="av" src="${esc(pl.image)}" alt="">` : `<span class="av ph" aria-hidden="true">${esc(initials(name))}</span>`;
  let body = `${self ? `<div class="hint">${t('myProfile')}</div>` : ''}<div class="prof">${av}<h2>${esc(name)}</h2><div class="where">${esc(where)}</div></div>`;
  if (!data) body += `<p class="hint">${t('pf_loadingResults')}</p>`;
  else if (data.failed) body += `<p class="msg err">${t('profileFail')}</p>`;
  else if (mine.length) {
    body += `<div class="pstats">
      <div><b>${mine.length}</b><span>${t('pf_matches')}</span></div>
      <div><b>${wins}</b><span>${t('pf_wins')}</span></div>
      <div><b>${losses}</b><span>${t('pf_losses')}</span></div>
      <div><b>${Math.round(100*wins/mine.length)}%</b><span>${t('pf_winRate')}</span></div></div>
      <p class="hint">${t('pf_sets')}: ${sw}–${sl}${data.total > mine.length ? ' · ' + t('pf_basedOn', { n: mine.length }) : ''}</p>
      <div class="psec"><h3>${t('pf_form')}</h3><div class="form">${mine.slice(0,5).map(x => `<i class="${x.won?'w':'l'}" title="${x.won?t('pf_win'):t('pf_loss')} ${esc(x.score)}">${x.won?'✓':'✕'}</i>`).join('')}</div></div>`;
    if (topPartners.length) body += `<div class="psec"><h3>${t('pf_partners')}</h3><ul class="plist">${topPartners.map(e => `<li><span class="d">${tn('pf_matchesN', e.n)}</span><span class="who">${playerLink(e.pl)}</span><span class="s">${e.w}–${e.n-e.w}</span></li>`).join('')}</ul></div>`;
    body += `<div class="psec"><h3>${t('pf_recent')}</h3><ul class="plist">${mine.slice(0,8).map(x => `<li class="${x.won?'w':'l'}">
        <span class="d">${new Date(x.r.date.slice(0,10)+'T12:00').toLocaleDateString(LOC(),{day:'numeric',month:'short'})}</span>
        <span class="who">${t('pf_vs', { who: playersHtml(x.opponents) })}${x.partners.length ? `<small>${t('pf_with', { who: playersHtml(x.partners) })}</small>` : ''}</span>
        <span class="s">${x.won?'✓':'✕'} ${esc(x.score)}</span></li>`).join('')}</ul></div>`;
  } else body += `<p class="hint">${t('pf_noResults')}</p>`;
  if (self) {
    const now = new Date();
    const upcoming = [...weekCache.entries()].sort().flatMap(([key, entry]) => {
      const m = new Date(key + 'T12:00'); const dates = [...Array(7)].map((_,i) => addDays(mondayOf(m), i));
      return entry.days.flatMap((list,i) => list.flatMap(c => Object.values(c.parsed_reservations||{}).filter(s => !s.hidden).map(s => normalize(s, c, dates[i]))));
    }).filter(s => isMine(s) && slotEnd(s) >= now).sort((a,b) => slotDate(a) - slotDate(b));
    body += `<div class="psec"><h3>${t('pf_upcoming')}</h3>${upcoming.length ? `<ul class="plist">${upcoming.slice(0,6).map(s => `<li><span class="d">${dayShort(s.date)} ${s.date.getDate()}.${s.date.getMonth()+1}.</span><span class="who"><button type="button" class="plink" data-slot="${esc(slotKey(s))}">${esc(slotTitle(s))}</button><small>${esc(courtLabel(s.court))}</small></span><span class="s">${hm(s.start)}</span></li>`).join('')}</ul>` : `<p class="hint">${t('pf_noUpcoming')}</p>`}</div>`;
  }
  body += `<p class="hint"><a href="https://${cfg.sub}.sporty.plus/app/player/${id}" target="_blank" rel="noopener">${t('pf_openSporty')}</a></p>`;
  if (self) body += `<p class="hint">${t('accountHint')}</p><button class="btn" id="logoutBtn" type="button" style="align-self:flex-start">${t('logout')}</button>`;
  openDrawer(body);
  panel.dataset.key = ''; panel.scrollTop = scroll;
  const lo = document.getElementById('logoutBtn'); if (lo) lo.onclick = logout;
  panel.querySelectorAll('[data-slot]').forEach(b => b.onclick = async () => {
    const key = b.dataset.slot, d = new Date(key.slice(0,10)+'T12:00');
    if (ymd(mondayOf(d)) !== ymd(state.monday)) await showWeek(mondayOf(d));
    openSlot(key);
  });
}
// Any player name link, anywhere (slot panel, results, profiles) opens that profile.
document.addEventListener('click', e => { const b = e.target.closest('[data-player]'); if (b) { e.preventDefault(); openProfile(b.dataset.player); } });

function openSettings(){
  openDrawer(`<h2>${t('settings')}</h2>
    <div class="field"><label for="sClub">${t('clubId')}</label><input id="sClub" inputmode="numeric" value="${esc(cfg.club)}"></div>
    <div class="field"><label for="sSub">${t('clubAddr')}</label><input id="sSub" value="${esc(cfg.sub)}"></div>
    <details><summary class="hint" style="cursor:pointer">${t('devOptions')}</summary>
      <div class="field" style="margin-top:10px"><label for="sTok">${t('sessionToken')}</label><input id="sTok" type="password" value="${esc(cfg.token)}" placeholder="Bearer …" autocomplete="off"></div>
      <p class="hint" style="margin-top:6px">${t('tokenHint')}</p>
    </details>
    <button class="btn primary" id="sSave" style="align-self:flex-start">${t('saveReload')}</button>`);
  document.getElementById('sSave').onclick = () => {
    cfg.club = parseInt(document.getElementById('sClub').value,10) || 139;
    cfg.sub = document.getElementById('sSub').value.trim() || 'modesto';
    cfg.token = document.getElementById('sTok').value.trim().replace(/^"|"$/g,'');
    store.set('club',cfg.club); store.set('sub',cfg.sub); store.set('token',cfg.token);
    closeDrawer(); state.teams.clear(); state.resultsByGame.clear(); state.leagues.clear(); weekCache.clear(); boot();
  };
}

/* ---------- results tab ---------- */
function renderResults(){
  const el = document.getElementById('resultsView');
  if (!state.results.length){ el.innerHTML = `<p class="empty">${t('noResults')}</p>`; return; }
  const groups = new Map();
  for (const r of state.results){ const d = r.date.slice(0,10); if(!groups.has(d)) groups.set(d,[]); groups.get(d).push(r); }
  el.innerHTML = [...groups].map(([d,list])=>`<div><h3>${dateLong(new Date(d+'T12:00'))}</h3>
    ${list.map(r=>{
      const sets = (r.sets||[]).filter(x=>x[0]||x[1]);
      const [a,b] = r.players||[];
      const team = (t,i)=>`<div class="team${r.winner_side===i?' w':''}"><b>${esc(t?.display_name||'—')}</b><small>${playersHtml(t?.players)}</small></div>`;
      const g = r.game || {};
      return `<div class="res"><div style="display:flex;flex-direction:column;gap:6px;min-width:0">${team(a,0)}${team(b,1)}</div>
        <div class="sets">${sets.map(x=>`<span><em style="${x[0]>x[1]?'':'font-weight:400;opacity:.6'}">${x[0]}</em><em style="${x[1]>x[0]?'':'font-weight:400;opacity:.6'}">${x[1]}</em></span>`).join('')}</div>
        <div class="meta">${r.date.slice(11,16)}${g.round?' · '+t('roundN', { n: g.round }):''}${r.official?' · '+t('official'):''}${r.verified?' · '+t('verified'):''}</div></div>`;
    }).join('')}</div>`).join('');
}

/* ---------- wiring ---------- */
const tabWeek = document.getElementById('tabWeek'), tabRes = document.getElementById('tabResults');
function showTab(which){
  tabWeek.setAttribute('aria-selected', which==='week'); tabRes.setAttribute('aria-selected', which==='results');
  document.getElementById('weekView').hidden = which!=='week';
  document.getElementById('resultsView').hidden = which!=='results';
  if (which==='results') renderResults();
  store.set('tab', which);
}
tabWeek.onclick = ()=>showTab('week'); tabRes.onclick = ()=>showTab('results');
document.getElementById('prev').onclick = ()=>showWeek(addDays(state.monday,-7));
document.getElementById('next').onclick = ()=>showWeek(addDays(state.monday,7));
document.getElementById('today').onclick = ()=>showWeek(mondayOf(new Date()));
document.getElementById('refresh').onclick = ()=>{ weekCache.clear(); boot(); };
document.getElementById('settingsBtn').onclick = openSettings;
document.getElementById('accountBtn').onclick = openLogin;

/* ---------- theme: Auto follows the device, or pick Light / Dark ---------- */
const THEMES = ['auto','light','dark'];
function applyTheme(th){
  if (th==='auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = th;
  const b = document.getElementById('themeBtn'), label = window.t('theme_'+th); b.textContent = label; b.setAttribute('aria-label', window.t('themeAria', { x: label }));
}
let theme = store.get('theme','auto'); if (!THEMES.includes(theme)) theme = 'auto';
applyTheme(theme);
document.getElementById('themeBtn').onclick = () => { theme = THEMES[(THEMES.indexOf(theme)+1)%3]; store.set('theme',theme); applyTheme(theme); };

/* ---------- language switch: Croatian <-> English ---------- */
function setLang(l){
  lang = l === 'en' ? 'en' : 'hr'; store.set('lang', lang);
  applyStaticText(); applyTheme(theme); updateAccountBtn();
  const openKey = !drawer.hidden ? panel.dataset.key : null;
  render(); if (!document.getElementById('resultsView').hidden) renderResults();
  if (openKey && allSlots().some(x => slotKey(x) === openKey)) openSlot(openKey); else if (!drawer.hidden) closeDrawer();
}
document.getElementById('langBtn').onclick = () => setLang(lang === 'hr' ? 'en' : 'hr');
applyStaticText();
document.addEventListener('keydown', e => {
  if (!drawer.hidden || e.target.closest('input,textarea')) return;
  if (e.key==='ArrowLeft') document.getElementById('prev').click();
  if (e.key==='ArrowRight') document.getElementById('next').click();
});

// A shared link (#s=date|court|start) opens that week and that slot, on load or when the hash changes.
async function openSharedSlot(){
  if (!location.hash.startsWith('#s=')) return false;
  const key = decodeURIComponent(location.hash.slice(3));
  const d = /^\d{4}-\d{2}-\d{2}\|\d+\|\d+$/.test(key) ? new Date(key.slice(0,10) + 'T12:00') : null;
  if (!d || isNaN(d)) return false;
  drawer.hidden = true;   // don't leave the previous slot open while the linked week loads
  await showWeek(mondayOf(d));
  if (allSlots().some(x => slotKey(x) === key)) openSlot(key); else closeDrawer();
  return true;
}
window.addEventListener('hashchange', () => {
  if (!drawer.hidden && location.hash === '#s=' + encodeURIComponent(panel.dataset.key || '')) return; // set by openSlot itself
  openSharedSlot();
});

async function boot(){
  // Paint straight away from what this browser saw last time, then refresh everything in parallel.
  loadCachedResults();
  loadCachedWeather();
  const saved = store.get('week.'+cfg.club+'.'+(cfg.token?'auth':'anon'), null);
  if (saved && saved.key === ymd(mondayOf(new Date())) && !weekCache.has(saved.key)) weekCache.set(saved.key, { at: 0, days: saved.days });
  showTab(store.get('tab','week'));
  loadClub().then(loadWeather);
  updateAccountBtn();
  loadMe().then(() => { updateAccountBtn(); if (state.me) render(); });
  if (!(await openSharedSlot())) await showWeek(state.monday);
  // The results endpoint is heavy and slows the server down for everything else, so it goes last.
  loadResults().then(() => { render(); if (!document.getElementById('resultsView').hidden) renderResults(); });
}
boot();
setInterval(()=>{ if (!document.hidden && drawer.hidden) { renderBoard(); loadWeather(); } }, 60000); // keep the "now" line moving
