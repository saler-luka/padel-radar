/* ---------- Log in with your Sporty+ account ----------
   Same flow as the official app: the password goes straight from this browser to Sporty+
   (api.sporty.plus) and is never stored. Only the returned session token is kept, in this browser. */
const AUTH = 'https://api.sporty.plus/api/v3';
async function authPost(path, body, token){
  const h = { 'Accept':'application/json', 'Content-Type':'application/json' };
  if (token) h.Authorization = token;
  const r = await fetch(AUTH+path, { method:'POST', headers:h, body: JSON.stringify(body||{}) });
  let j = {}; try { j = await r.json(); } catch(_){}
  if (!r.ok) {
    const e = new Error(j.errors?.[0]?.detail || j.message || j.error || t('sportyAnswered', { s: r.status }));
    e.status = r.status; e.data = j; throw e;
  }
  return j;
}
function loginErrorText(e){
  if (e.status===429) return t('tooMany');
  if (e.status===422) return e.message.includes('credentials') ? t('badCreds') : e.message;
  if (!e.status) return t('noReach');
  return e.message || t('noReach');
}
async function useToken(raw){
  cfg.token = raw.startsWith('Bearer') ? raw : 'Bearer '+raw;
  store.set('token', cfg.token);
  state.teams.clear(); state.resultsByGame.clear(); state.leagues.clear(); standingsCache.clear(); weekCache.clear();
  await loadMe(); updateAccountBtn(); boot();
  if (!document.getElementById('leaguesView').hidden) renderLeagues();
  if (!document.getElementById('ratingView').hidden) renderRating();
}
function updateAccountBtn(){
  const b = document.getElementById('accountBtn'), me = state.me;
  b.classList.toggle('me', !!me);
  b.classList.toggle('solid', !cfg.token);
  if (!me) { b.textContent = cfg.token ? t('account') : t('login'); b.removeAttribute('aria-label'); return; }
  // Logged in: a tile with the profile photo (or initials) and the first name underneath.
  const name = myName(), face = img => img ? `<img class="av" src="${esc(img)}" alt="">` : `<span class="av ph" aria-hidden="true">${esc(initials(name))}</span>`;
  b.innerHTML = `${face(me.image)}<span class="nm">${esc(name.split(' ')[0] || t('account'))}</span>`;
  b.setAttribute('aria-label', t('myProfile') + (name ? ': ' + name : ''));
  // /v2/me may not carry the photo; the public player record does.
  if (!me.image && me.id) loadPlayer(me.id).then(({ player }) => {
    if (player?.image && state.me === me) b.querySelector('.av').outerHTML = face(player.image);
  }).catch(()=>{});
}

function openLogin(){
  navReset();
  if (cfg.token) return openAccount();
  openDrawer(`<h2>${t('loginTitle')}</h2>
    <p class="hint">${t('loginHint', { club: esc(state.club?.name || t('theClub')) })}</p>
    <form id="loginForm" class="wrap" style="padding:0;gap:12px" novalidate>
      <div class="field"><label for="lEmail">${t('email')}</label><input id="lEmail" type="email" autocomplete="username" placeholder="ana.horvat@gmail.com" required></div>
      <div class="field"><label for="lPass">${t('password')}</label><input id="lPass" type="password" autocomplete="current-password" required></div>
      <div class="field" id="lCodeRow" hidden><label for="lCode">${t('codeLabel')}</label><input id="lCode" inputmode="numeric" autocomplete="one-time-code" placeholder="123456"></div>
      <button class="btn primary" id="lGo" type="submit" style="align-self:flex-start">${t('login')}</button>
      <p class="msg" id="lMsg" aria-live="polite"></p>
    </form>`);
  const f = document.getElementById('loginForm'), msg = document.getElementById('lMsg'), go = document.getElementById('lGo');
  let challenge = null;
  document.getElementById('lEmail').focus();
  f.onsubmit = async (ev) => {
    ev.preventDefault();
    const email = document.getElementById('lEmail').value.trim(), pass = document.getElementById('lPass').value;
    const code = document.getElementById('lCode').value.trim();
    msg.className = 'msg err';
    if (!challenge && (!email || !pass)) { msg.textContent = t('errEmailPass'); return; }
    if (challenge && !code) { msg.textContent = t('errCode'); return; }
    go.disabled = true; go.textContent = t('loggingIn'); msg.textContent = '';
    try {
      const r = challenge
        ? await authPost('/login/two-factor-challenge', { challenge, code, recovery_code: null })
        : await authPost('/login', { client:'native', email, password: pass });
      if (!r.token) throw new Error(t('noSession'));
      msg.className = 'msg ok'; msg.textContent = t('loggedIn');
      await useToken(r.token);
      setTimeout(closeDrawer, 600);
    } catch(e) {
      if (!challenge && e.data && e.data.error==='two_factor_required' && e.data.challenge) {
        challenge = e.data.challenge;
        document.getElementById('lCodeRow').hidden = false; document.getElementById('lCode').focus();
        msg.className = 'msg'; msg.textContent = t('twoStep');
      } else msg.textContent = challenge && e.status===422 ? t('badCode') : loginErrorText(e);
      go.disabled = false; go.textContent = challenge ? t('confirmCode') : t('login');
    }
  };
}

/* ---------- player profiles ----------
   Like the official app, profiles are for logged-in members. We show only what other members see there:
   name, photo, city and country, plus statistics from published results. Email, phone, birth year, age range and
   ranking are never shown (Modesto hides personal data and ranks). */
const profileCache = new Map();   // 'p'+id -> { at, player }, 'r'+id -> { at, results, total }
const FRESH_PROFILE = 5*60_000;
async function cached(key, load){ const c = profileCache.get(key); if (c && Date.now() - c.at < FRESH_PROFILE) return c; const v = { at: Date.now(), ...(await load()) }; profileCache.set(key, v); return v; }
const loadPlayer = id => cached('p'+id, async () => { const pl = await api(`/v2/player/${id}`); return { player: pl.data || pl }; });
const loadPlayerResults = id => cached('r'+id, async () => { const rs = await api(`/v2/result?filter[player]=${id}&limit=50&page=1`); return { results: (rs.data || []).map(trimResult), total: rs.meta?.total ?? (rs.data||[]).length }; });
// One player's view of a result: which side they were on, partner(s), opponents, win/loss, sets.
function resultFor(r, id){
  const side = (r.players||[]).findIndex(tm => (tm?.players||[]).some(x => x.id === id) || tm?.id === id);
  if (side < 0) return null;
  const mine = r.players[side], other = r.players[1-side];
  const sets = (r.sets||[]).filter(x => x[0]||x[1]);
  const setsWon = sets.filter(x => side === 0 ? x[0] > x[1] : x[1] > x[0]).length;
  return { r, side, won: r.winner_side === side, partners: (mine?.players||[]).filter(x => x.id !== id), opponents: other?.players?.length ? other.players : (other ? [other] : []),
           score: sets.map(x => side === 0 ? x[0]+'-'+x[1] : x[1]+'-'+x[0]).join(' '), setsWon, setsLost: sets.length - setsWon };
}
function initials(name){ return (name||'?').split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase(); }
/* ---------- pair (team) profiles ----------
   A league pair is its own Sporty+ team. Its results come from /v2/result?filter[team]=id (public); its name and
   players come from the results we already have, or /v2/team/{id} (login) when the pair has no results yet.
   Never use /v2/player/{id} for a pair: player and team ids overlap, so it returns a different person. */
function teamLink(id, label){
  return `<button type="button" class="plink" data-team="${id}" aria-label="${esc(t('openTeam', { name: label }))}">${esc(label)}</button>`;
}

function teamResultFor(r, id){

/* ---------- Modesto Masters points ----------

   Sporty+ player ids. Total = sum of rounds; ties keep the file's player order, exactly like their table. */
const MASTERS_URL = 'https://t00bz.github.io/modesto-masters/data/standings.json';

/* ---------- Padel Radar rating: our own Elo for doubles, from every club result ----------
   History: all /v2/result pages (about 11 × 100), kept compact in localStorage. Each visit fetches page 1 for new results;
   once a day everything is fetched again in case older results were entered late or corrected.
   Elo: a side's strength is the average of its players. Expected score E = 1 / (1 + 10^((Rb − Ra)/400)); every player
   on a side moves by K × margin × (result − E). K is 40 for a player's first 10 matches, then 24; margin goes from
   0.75 (7-6 7-6) to 1.25 (a 12-game difference or more). Pairs (team ids) get their own rating the same way.
   League level: Modesto's main league is a pyramid of groups ("Ploča" A, B1, B2, C1 … E2). Players rarely meet across
   groups, so plain Elo can rank a dominant lower-group pair above the top group. Each Ploča level has a par rating
   (A 1700, B1 1600, B2 1550, C1 1500 … E2 1250): a newcomer whose first match is in Ploča starts at that group's par
   (others at 1500), and every Ploča match pulls the rating 5% towards the group's par on top of the Elo change.
   Other leagues and friendlies use plain Elo. Backtest (2026-10-20): the favourite won 73% vs 67% with plain Elo.
   The same match is sometimes stored twice (e.g. as a league and a friendly result): same day, same pairs, same sets
   counts once. */
const RT_START = 1500, RT_MIN = 5, RT_FULL_MS = 24*3600e3, RT_ANCHOR = 0.05;

// "Ploča A" / "A Ploča" / "Ploča B1" / "Grupa E1" … → 0, 1, 1.5, 2 …; anything else (Grupa 1, Žene…) is not on the ladder.
function ladderLevel(name){
  const m = String(name || '').trim().match(/^(?:(?:Ploča|Grupa)\s*)?([A-E])\s*([12])?(?:\s*Ploča)?$/i);
  return m ? 'ABCDE'.indexOf(m[1].toUpperCase()) + (m[2] === '2' ? 0.5 : 0) : null;
}
function compactResult(r){
  const sets = (r.sets||[]).filter(x => x && (x[0]||x[1]));
  const side = tm => !tm ? null : { t: tm.id, p: (tm.players||[]).length ? tm.players.map(p => p.id) : [tm.id], n: (tm.players||[]).length ? tm.players.map(p => p.display_name || '') : [tm.display_name || ''], tn: tm.display_name || '' };
  const lg = r.game && String(r.game.type_type).includes('League') ? r.game.type_id : null;   // league group id
  return { id: r.id, g: r.game_id || null, lg, d: r.date, s: sets, w: r.winner_side, a: side(r.players?.[0]), b: side(r.players?.[1]) };
}
let historyPromise = null;
const HISTORY_KEY = () => 'history3.' + cfg.club, LEVELS_KEY = () => 'lgLevels.' + cfg.club;
async function loadHistory(onProgress){
  const key = HISTORY_KEY(), saved = store.get(key, null);
  try { ['history.', 'history2.', 'roster.'].forEach(k => localStorage.removeItem('pw.' + k + cfg.club)); } catch(e) {}   // older formats
  let list = saved?.list || [], at = saved?.at || 0;
  const page = p => api(`/v2/result?filter[club]=${cfg.club}&limit=100&page=${p}`);
  if (!list.length || Date.now() - at > RT_FULL_MS) {
    const first = await page(1), last = first.meta?.last_page || 1, all = [first];
    onProgress?.(1, last);
    let done = 1;   // the endpoint is slow (~8 s a page), so ask for all the other pages at once
    all.push(...await Promise.all(Array.from({ length: last - 1 }, (_, i) => page(i + 2).then(r => { onProgress?.(++done, last); return r; }))));
    list = all.flatMap(r => (r.data||[]).map(compactResult)); at = Date.now();
  } else {
    const known = new Set(list.map(r => r.id));
    for (let p = 1; p <= 5; p++) {   // newest first: stop at the first page we already have
      const fresh = ((await page(p)).data||[]).map(compactResult), add = fresh.filter(r => !known.has(r.id));
      list = add.concat(list); add.forEach(r => known.add(r.id));
      if (add.length < fresh.length || !fresh.length) break;
    }
  }
  try { store.set(key, { at, list }); } catch(e) {}
  return list;
}
// Ladder level of every league group in the history. /v2/league_group/{id} is public and quick; names never change,
// so levels are kept for good and only new groups are looked up.
async function loadLevels(list){
  const levels = store.get(LEVELS_KEY(), {});
  const missing = [...new Set(list.map(r => r.lg).filter(id => id && !(id in levels)))];
  if (missing.length) {
    const got = await Promise.allSettled(missing.map(id => api(`/v2/league_group/${id}`).then(g => [id, ladderLevel((g.data || g).name)])));
    got.forEach(x => { if (x.status === 'fulfilled') levels[x.value[0]] = x.value[1]; });
    try { store.set(LEVELS_KEY(), levels); } catch(e) {}
  }
  return levels;
}
// Pairs in the current Ploča round. Group ids are global (other clubs' groups sit next to ours), so start at the newest
// Ploča group we have results for and walk to the neighbouring ids only while they are Ploča groups with the next order.
const ROSTER_KEY = () => 'roster2.' + cfg.club, RT_ACTIVE_DAYS = 45;   // team id -> { name, id } of its group
async function loadRoster(list, levels){
  const ids = list.map(r => r.lg).filter(id => id && levels[id] != null);
  if (!ids.length) return {};
  const fetchG = id => api(`/v2/league_group/${id}`).then(g => g.data || g).catch(() => null), max = Math.max(...ids);
  const top = await fetchG(max); if (!top || ladderLevel(top.name) === null) return {};
  const groups = [top];
  for (const dir of [-1, 1]) {
    let prev = top;
    for (let id = max + dir; Math.abs(id - max) < 15; id += dir) {
      const g = await fetchG(id);
      if (!g || ladderLevel(g.name) === null || g.order !== prev.order + dir) break;
      groups.push(g); prev = g;
    }
  }
  const roster = {};
  for (const g of groups) for (const p of g.players || []) roster[p.id] = { name: String(g.name).trim(), id: g.id };
  try { store.set(ROSTER_KEY(), roster); } catch(e) {}
  return roster;
}
function dedupeResults(list){
  const seen = new Map();
  for (const r of list) {
    if (!r.a || !r.b) continue;
    const flip = r.a.t > r.b.t, sets = r.s.map(x => flip ? [x[1], x[0]] : x);
    const k = [String(r.d).slice(0, 10), Math.min(r.a.t, r.b.t), Math.max(r.a.t, r.b.t), JSON.stringify(sets)].join('|');
    const old = seen.get(k);
    if (!old || (!old.lg && r.lg)) seen.set(k, r);   // keep the league copy
  }
  return [...seen.values()];
}
function computeRatings(list, levels = {}, roster = {}){

  const games = r => r.s.reduce((a, x) => [a[0] + x[0], a[1] + x[1]], [0, 0]);
  const sorted = dedupeResults(list).filter(r => (r.w === 0 || r.w === 1) && r.s.length).sort((x, y) => x.d.localeCompare(y.d) || x.id - y.id);
  for (const r of sorted) {
    const when = new Date(r.d.replace(' ', 'T')).getTime(), lv = r.lg != null ? levels[r.lg] ?? null : null;
    const g = games(r), margin = 0.75 + 0.5 * Math.min(Math.abs(g[0] - g[1]), 12) / 12;
    const A = r.a.p.map((id, i) => get(P, id, r.a.n[i])), B = r.b.p.map((id, i) => get(P, id, r.b.n[i]));
    const pairs = r.a.p.length > 1 && r.b.p.length > 1 ? [get(T, r.a.t, r.a.tn), get(T, r.b.t, r.b.tn)] : null;
    if (lv !== null) for (const x of [...A, ...B]) if (!x.n) x.r = x.best = rtPar(lv);   // newcomer: start at the group's level
    const avg = xs => xs.reduce((s, x) => s + x.r, 0) / xs.length;
    if (pairs) [[pairs[0], A], [pairs[1], B]].forEach(([tp, xs]) => { if (!tp.n) tp.r = tp.best = avg(xs); });   // a new pair starts from its players
    for (const x of [...A, ...B, ...(pairs || [])]) { x.last = when; x.lastLadder = lv !== null; if (r.lg) x.lastLg = r.lg; }
    const ea = 1 / (1 + Math.pow(10, (avg(B) - avg(A)) / 400)), sa = r.w === 0 ? 1 : 0;
    if (r.g) {   // the chance we'd have shown before this match: pair rating once established, else the players' average
      const str = (tp, xs) => tp && tp.n >= RT_MIN ? tp.r : avg(xs);
      pre.set(r.g, { t: r.a.t, p: 1 / (1 + Math.pow(10, (str(pairs?.[1], B) - str(pairs?.[0], A)) / 400)) });
    }
    const move = (xs, s, e) => xs.forEach(x => {
      if (when >= weekAgo && x.week === null) x.week = x.r;   // rating before this week's first match
      x.r += (x.n < 10 ? 40 : 24) * margin * (s - e);
      if (lv !== null) x.r += RT_ANCHOR * (rtPar(lv) - x.r);   // pull towards the group's level
      x.n++; if (s) x.w++; x.best = Math.max(x.best, x.r); x.hist.push([when, x.r]); x.form.push(s ? 1 : 0); });
    move(A, sa, ea); move(B, 1 - sa, 1 - ea);

      const [ta, tb] = pairs;
      ta.players = r.a.p.map((id, i) => ({ id, display_name: r.a.n[i] })); tb.players = r.b.p.map((id, i) => ({ id, display_name: r.b.n[i] }));

    const ranked = all.filter(x => x.n >= RT_MIN).sort((a, b) => b.r - a.r);
    ranked.forEach((x, i) => x.rank = i + 1);
    const before = all.filter(x => x.n - x.played7 >= RT_MIN).sort((a, b) => (b.r - b.weekDelta) - (a.r - a.weekDelta));

  const currentPairs = [...T.values()].filter(x => x.current).sort((a, b) => b.r - a.r);
  currentPairs.forEach((x, i) => x.crank = i + 1);
  currentPairs.filter(x => x.n > x.played7).sort((a, b) => (b.r - b.weekDelta) - (a.r - a.weekDelta)).forEach((x, i) => x.crankBefore = i + 1);
  // each player's current pair (the most recent one, if several)
  const pairOf = new Map();
  for (const x of currentPairs) for (const p of x.players || []) { const o = pairOf.get(p.id); if (!o || x.last > o.last) pairOf.set(p.id, x); }

}
// With a saved history the rating is ready at once and refreshes in the background (page 1 alone takes ~8 s);
// the very first time it has to wait for every page (~30 s, with progress).
function loadRatings(onProgress){
  if (historyPromise) return historyPromise;
  const saved = store.get(HISTORY_KEY(), null);
  const fresh = loadHistory(saved?.list?.length ? null : onProgress).then(async list => {
    const levels = await loadLevels(list);
    state.rating = computeRatings(list, levels, await loadRoster(list, levels).catch(() => store.get(ROSTER_KEY(), {})));
    if (!document.getElementById('ratingView').hidden) renderRating();
    return state.rating;
  });
  if (saved?.list?.length) { state.rating = computeRatings(saved.list, store.get(LEVELS_KEY(), {}), store.get(ROSTER_KEY(), {})); fresh.catch(() => {}); historyPromise = Promise.resolve(state.rating); }
  else historyPromise = fresh.catch(e => { historyPromise = null; throw e; });
  return historyPromise;
}
const rtNum = r => String(Math.round(r));   // no thousands dot: "1.617" reads like a decimal
// Movement only for those who played this week: without a match, a rank change just means someone else moved.
const rtMove = (x, cur) => { const r = cur ? x.crank : x.rank, b = cur ? x.crankBefore : x.rankBefore;
  if (!r) return ''; if (!x.played7 || !b) return '<span class="eq">–</span>'; const d = b - r;
  return d > 0 ? `<span class="up" title="${t('rt_upN', { n: d })}">▲${d}</span>` : d < 0 ? `<span class="dn" title="${t('rt_downN', { n: -d })}">▼${-d}</span>` : '<span class="eq">–</span>'; };
const rtDelta = d => { const v = Math.round(d); return v > 0 ? `<span class="up">▲ +${v}</span>` : v < 0 ? `<span class="dn">▼ ${v}</span>` : `<span class="eq">±0</span>`; };

  const pts = hist.slice(-40); if (pts.length < 2) return '';

/* ---------- match prediction (in the match panel only) ----------
   Win chance from the Padel Radar rating: a pair's own rating once it has RT_MIN matches together, otherwise the
   average of its two players. Finished matches show the chance as it stood before the match (state.rating.pre). */
function sideStrength(teamId){
  const R = state.rating; if (!R) return null;
  const pair = R.pairs.get(teamId);
  if (pair && pair.n >= RT_MIN) return pair.r;
  const players = state.teams.get(teamId)?.players || pair?.players || [];
  if (!players.length) return null;
  return players.reduce((s, p) => s + (R.players.get(p.id)?.r ?? RT_START), 0) / players.length;
}
function predictionSection(s){
  if (!(s.kind === 'league' || s.kind === 'booking') || (s.teamIds||[]).length !== 2) return '';
  if (!state.rating) {
    const key = slotKey(s);
    loadRatings().then(() => { if (!drawer.hidden && panel.dataset.key === key) openSlot(key); }).catch(() => {});
    return `<div class="predict"><span class="hint">${t('pd_loading')}</span></div>`;
  }
  const [a, b] = s.teamIds, r = state.resultsByGame.get(s.gameId), done = !!r || slotEnd(s) < new Date();
  let pa;
  if (done) {   // what we'd have said before the match
    const pre = state.rating.pre.get(s.gameId); if (!pre) return '';
    pa = pre.t === a ? pre.p : 1 - pre.p;
  } else {
    const ra = sideStrength(a), rb = sideStrength(b); if (ra === null || rb === null) return '';
    pa = 1 / (1 + Math.pow(10, (rb - ra) / 400));
  }
  const A = Math.round(pa * 100), B = 100 - A;
  const winner = r ? (r.winner_team_id === a ? 'a' : r.winner_team_id === b ? 'b' : null) : null;
  const upset = winner && (winner === 'a' ? A : B) < 50;
  const rating = id => { const v = sideStrength(id); return v === null ? '' : rtNum(v); };
  return `<div class="predict${upset ? ' upset' : ''}">
    <div class="pdrow"><span class="hint">${done ? t('pd_was') : t('pd_title')}</span>${upset ? `<span class="badge">${t('pd_upset')}</span>` : `<span class="hint">${t('rt_title')}</span>`}</div>
    <div class="pdrow"><b class="pa">${A}%</b><b class="pb">${B}%</b></div>
    <div class="pdbar" role="img" aria-label="${esc(t('pd_aria', { a: teamLabel(a), pa: A, b: teamLabel(b), pb: B }))}"><i class="pa" style="width:${A}%"></i><i class="pb" style="width:${B}%"></i></div>
    <div class="pdrow hint"><span>${esc(teamLabel(a))}${done ? '' : ' · ' + rating(a)}</span><span>${done ? '' : rating(b) + ' · '}${esc(teamLabel(b))}</span></div>
    ${upset ? `<span class="hint">${t('pd_upsetLine', { who: esc(teamLabel(winner === 'a' ? a : b)), p: winner === 'a' ? A : B })}</span>` : ''}</div>`;
}

/* ---------- head-to-head: two players or two pairs face to face ----------
   From the whole result history (de-duplicated): every match where the two were on opposite sides, whoever their
   partners were. Players are compared by player id, pairs by team id. Opened from profiles ("Usporedi s…"). */
const LADDER_NAMES = ['A', 'B1', 'B2', 'C1', 'C2', 'D1', 'D2', 'E1', 'E2'];
const h2hName = (kind, id) => (kind === 't' ? state.rating?.pairs.get(id) : state.rating?.players.get(id))?.name || (kind === 't' ? teamLabel(id) : t('playerN', { id }));

  const mine = kind === 'p' ? (meId && meId !== id ? meId : null) : (myPair && myPair.id !== id ? myPair.id : null);
  return `<div class="h2hbtns"><button type="button" class="btn" data-h2hpick="${kind}:${id}">⇄ ${t('h2h_compare')}</button>${mine ? `<button type="button" class="btn" data-h2h="${kind}:${mine}:${id}">${kind === 'p' ? t('h2h_withMe') : t('h2h_withMyPair')}</button>` : ''}</div>`;
}
function h2hMeetings(kind, a, b){
  const side = (r, id) => kind === 't' ? (r.a.t === id ? 0 : r.b.t === id ? 1 : -1) : (r.a.p.includes(id) ? 0 : r.b.p.includes(id) ? 1 : -1);
  const levels = store.get(LEVELS_KEY(), {}), out = [];
  for (const r of dedupeResults(store.get(HISTORY_KEY(), {}).list || [])) {
    if (!(r.w === 0 || r.w === 1) || !r.s.length) continue;
    const sa = side(r, a), sb = side(r, b); if (sa < 0 || sb < 0 || sa === sb) continue;
    const A = sa === 0 ? r.a : r.b, B = sa === 0 ? r.b : r.a, lv = r.lg != null ? levels[r.lg] : undefined;
    const partner = (S, id) => S.p.map((pid, i) => pid === id ? null : S.n[i]).filter(Boolean).join(', ');
    out.push({ r, won: r.w === sa, sets: r.s.map(x => sa === 0 ? x : [x[1], x[0]]),
      with: kind === 'p' ? partner(A, a) : '', withB: kind === 'p' ? partner(B, b) : '',
      where: lv != null ? 'Ploča ' + (LADDER_NAMES[Math.round(lv * 2)] || '') : r.lg ? t('h2h_league') : t('h2h_friendly') });
  }

}
async function openH2H(kind, a, b){
  a = Number(a); b = Number(b);

  const ms = h2hMeetings(kind, a, b), wins = ms.filter(m => m.won).length;
  let sw = 0, sl = 0, gw = 0, gl = 0;
  for (const m of ms) for (const [x, y] of m.sets) { if (x > y) sw++; else sl++; gw += x; gl += y; }
  const R = state.rating, ent = id => kind === 't' ? R.pairs.get(id) : R.players.get(id);
  const ra = kind === 't' ? sideStrength(a) : ent(a)?.r, rb = kind === 't' ? sideStrength(b) : ent(b)?.r;
  const pa = ra != null && rb != null ? Math.round(100 / (1 + Math.pow(10, (rb - ra) / 400))) : null;
  const who = (id, cls) => { const e = ent(id), nm = h2hName(kind, id);
    return `<div><span class="av h2hav ${cls}" aria-hidden="true">${esc(initials(nm))}</span>${kind === 't' ? teamLink(id, nm) : `<button type="button" class="plink" data-player="${id}">${esc(nm)}</button>`}<span class="hint">${e ? rtNum(e.r) + (e.rank || e.crank ? ' · ' + (kind === 't' ? (e.crank ?? e.rank) : e.rank) + '.' : '') : ''}</span></div>`; };
  const bar = (x, y) => x + y ? `<div class="h2hsplit"><i class="pa" style="width:${100 * x / (x + y)}%"></i><i class="pb" style="width:${100 * y / (x + y)}%"></i></div>` : '';

  else body += `<p class="hint">${t('h2h_never')}</p>`;
  if (pa != null) body += `<div class="h2hnext"><span class="hint">${kind === 't' ? t('h2h_nextPair') : t('h2h_nextPlayers')}</span><span><b class="pa">${pa}%</b> – <b class="pb">${100 - pa}%</b></span></div>`;
  if (ms.length) body += `<div class="psec"><h3>${t('h2h_meetings')}</h3><ul class="plist h2hlist">${ms.slice(0, 30).map(m => `<li class="${m.won ? 'w' : 'l'}">
      <span class="d">${day(m.r.d)}</span>
      <span class="who">${esc(m.where)}${kind === 'p' && (m.with || m.withB) ? `<small>${m.with ? esc(t('h2h_with', { who: m.with })) : ''}${m.with && m.withB ? ' · ' : ''}${m.withB ? esc(t('h2h_theyWith', { name: h2hName(kind, b).split(' ')[0], who: m.withB })) : ''}</small>` : ''}</span>
      <span class="s">${m.won ? '✓' : '✕'} ${m.sets.map(x => x.join('-')).join(' ')}</span></li>`).join('')}</ul>${ms.length > 30 ? `<p class="hint">${t('h2h_more', { n: ms.length - 30 })}</p>` : ''}</div>`;

// Pick who to compare with: most-met opponents first, or search by name.

async function openProfile(id){
  id = Number(id);

  if (!cfg.token) {
    openDrawer(`<h2>${t('profile')}</h2><p class="hint">${t('profileLogin')}</p><button class="btn primary" type="button" id="pfLogin" style="align-self:flex-start">${t('profileLoginBtn')}</button>`);
    document.getElementById('pfLogin').onclick = openLogin; return;
  }
  const token = Symbol(); openProfile.current = token;   // ignore late answers for a profile that's no longer open
  openDrawer(`<h2>${self ? t('myProfile') : t('profile')}</h2><p class="hint">${t('profileLoading')}</p>`);
  panel.dataset.key = '';
  const resultsP = loadPlayerResults(id);   // slow endpoint: start it now, render it when it lands
  const mastersP = loadMasters();
  const ratingP = state.rating ? null : loadRatings().catch(() => null);
  let pl, data = null;
  try { pl = (await loadPlayer(id)).player; } catch(e) {
    if (openProfile.current !== token || drawer.hidden) return;

function renderProfile(id, pl, data, self){
  const scroll = panel.scrollTop;
  const name = pl.display_name || [pl.first_name, pl.last_name].filter(Boolean).join(' ');
  const mine = (data?.results || []).map(r => resultFor(r, id)).filter(Boolean).sort((a,b) => b.r.date.localeCompare(a.r.date));
  const wins = mine.filter(x => x.won).length, losses = mine.length - wins;
  const sw = mine.reduce((a,x) => a + x.setsWon, 0), sl = mine.reduce((a,x) => a + x.setsLost, 0);
  const partners = new Map();
  for (const x of mine) for (const pp of x.partners) { const e = partners.get(pp.id) || { pl: pp, n: 0, w: 0 }; e.n++; if (x.won) e.w++; partners.set(pp.id, e); }
  const topPartners = [...partners.values()].sort((a,b) => b.n - a.n).slice(0,3);
  const where = [pl.city?.name, pl.country ? ((pl.country.emoji ? pl.country.emoji+' ' : '') + pl.country.name) : null].filter(Boolean).join(' · ');
  const av = pl.image ? `<img class="av" src="${esc(pl.image)}" alt="">` : `<span class="av ph" aria-hidden="true">${esc(initials(name))}</span>`;
  let body = `${self ? `<div class="hint">${t('myProfile')}</div>` : ''}<div class="prof">${av}<h2>${esc(name)}</h2><div class="where">${esc(where)}</div></div>`;
  body += currentPairBadge(id);
  body += mastersSection(id);
  body += ratingSection(id);
  body += h2hButtons('p', id);
  if (!data) body += `<p class="hint">${t('pf_loadingResults')}</p>`;
  else if (data.failed) body += `<p class="msg err">${t('profileFail')}</p>`;
  else if (mine.length) {
    body += `<div class="pstats">
      <div><b>${mine.length}</b><span>${t('pf_matches')}</span></div>
      <div><b>${wins}</b><span>${t('pf_wins')}</span></div>
      <div><b>${losses}</b><span>${t('pf_losses')}</span></div>
      <div><b>${Math.round(100*wins/mine.length)}%</b><span>${t('pf_winRate')}</span></div></div>
      <p class="hint">${t('pf_sets')}: ${sw}–${sl}${data.total > mine.length ? ' · ' + t('pf_basedOn', { n: mine.length }) : ''}</p>
      <div class="psec"><h3>${t('pf_form')}</h3><div class="form">${mine.slice(0,5).map(x => `<i class="${x.won?'w':'l'}" title="${x.won?t('pf_win'):t('pf_loss')} ${esc(x.score)}">${x.won?'✓':'✕'}</i>`).join('')}</div></div>`;
    if (topPartners.length) body += `<div class="psec"><h3>${t('pf_partners')}</h3><ul class="plist">${topPartners.map(e => `<li><span class="d">${tn('pf_matchesN', e.n)}</span><span class="who">${playerLink(e.pl)}</span><span class="s">${e.w}–${e.n-e.w}</span></li>`).join('')}</ul></div>`;
    body += `<div class="psec"><h3>${t('pf_recent')}</h3><ul class="plist">${mine.slice(0,8).map(x => `<li class="${x.won?'w':'l'}">
        <span class="d">${new Date(x.r.date.slice(0,10)+'T12:00').toLocaleDateString(LOC(),{day:'numeric',month:'short'})}</span>
        <span class="who">${t('pf_vs', { who: playersHtml(x.opponents) })}${x.partners.length ? `<small>${t('pf_with', { who: playersHtml(x.partners) })}</small>` : ''}</span>
        <span class="s">${x.won?'✓':'✕'} ${esc(x.score)}</span></li>`).join('')}</ul></div>`;
  } else body += `<p class="hint">${t('pf_noResults')}</p>`;
  if (self) {
    const now = new Date();
    const upcoming = [...weekCache.entries()].sort().flatMap(([key, entry]) => {
      const m = new Date(key + 'T12:00'); const dates = [...Array(7)].map((_,i) => addDays(mondayOf(m), i));
      return entry.days.flatMap((list,i) => list.flatMap(c => Object.values(c.parsed_reservations||{}).filter(s => !s.hidden).map(s => normalize(s, c, dates[i]))));
    }).filter(s => isMine(s) && slotEnd(s) >= now).sort((a,b) => slotDate(a) - slotDate(b));
    body += `<div class="psec"><h3>${t('pf_upcoming')}</h3>${upcoming.length ? `<ul class="plist">${upcoming.slice(0,6).map(s => `<li><span class="d">${dayShort(s.date)} ${s.date.getDate()}.${s.date.getMonth()+1}.</span><span class="who"><button type="button" class="plink" data-slot="${esc(slotKey(s))}">${esc(slotTitle(s))}</button><small>${esc(courtLabel(s.court))}</small></span><span class="s">${hm(s.start)}</span></li>`).join('')}</ul>` : `<p class="hint">${t('pf_noUpcoming')}</p>`}</div>`;
  }
  body += `<p class="hint"><a href="https://${cfg.sub}.sporty.plus/app/player/${id}" target="_blank" rel="noopener">${t('pf_openSporty')}</a></p>`;
  if (self) body += `<p class="hint">${t('accountHint')}</p><button class="btn" id="logoutBtn" type="button" style="align-self:flex-start">${t('logout')}</button>`;
  openDrawer(body);
  panel.dataset.key = ''; panel.scrollTop = scroll;
  const lo = document.getElementById('logoutBtn'); if (lo) lo.onclick = logout;
  panel.querySelectorAll('[data-slot]').forEach(b => b.onclick = async () => {
    const key = b.dataset.slot, d = new Date(key.slice(0,10)+'T12:00');
    if (ymd(mondayOf(d)) !== ymd(state.monday)) await showWeek(mondayOf(d));
    openSlot(key);
  });
}
// Any player name link, anywhere (slot panel, results, profiles) opens that profile.
document.addEventListener('click', e => { const b = e.target.closest('[data-player]'); if (b) { e.preventDefault(); openProfile(b.dataset.player); } });

function openSettings(){
  navReset();
  const sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
  const moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>';
  openDrawer(`<h2>${t('settings')}</h2>
    <div class="field"><span class="flabel" id="sThemeL">${t('theme')}</span><div class="seg pick" role="group" aria-labelledby="sThemeL">
      <button type="button" data-theme-pick="light" aria-pressed="${curTheme()==='light'}">${sun}${t('theme_light')}</button><button type="button" data-theme-pick="dark" aria-pressed="${curTheme()==='dark'}">${moon}${t('theme_dark')}</button></div></div>
    <div class="field"><span class="flabel" id="sLangL">${t('language')}</span><div class="seg pick" role="group" aria-labelledby="sLangL">
      <button type="button" data-lang-pick="hr" lang="hr" aria-pressed="${lang==='hr'}">Hrvatski</button><button type="button" data-lang-pick="en" lang="en" aria-pressed="${lang==='en'}">English</button></div></div>
    <details><summary class="hint" style="cursor:pointer">${t('devOptions')}</summary>
      <div class="field" style="margin-top:10px"><label for="sClub">${t('clubId')}</label><input id="sClub" inputmode="numeric" value="${esc(cfg.club)}"></div>
      <div class="field" style="margin-top:10px"><label for="sSub">${t('clubAddr')}</label><input id="sSub" value="${esc(cfg.sub)}"></div>
      <div class="field" style="margin-top:10px"><label for="sTok">${t('sessionToken')}</label><input id="sTok" type="password" value="${esc(cfg.token)}" placeholder="Bearer …" autocomplete="off"></div>
      <p class="hint" style="margin-top:6px">${t('tokenHint')}</p>
      <button class="btn primary" id="sSave" style="margin-top:12px">${t('saveReload')}</button>
    </details>`);
  panel.querySelectorAll('[data-theme-pick]').forEach(b => b.onclick = () => { theme = b.dataset.themePick; store.set('theme', theme); applyTheme(); });
  panel.querySelectorAll('[data-lang-pick]').forEach(b => b.onclick = () => { if (b.dataset.langPick !== lang) { setLang(b.dataset.langPick); openSettings(); } });
  document.getElementById('sSave').onclick = () => {
    cfg.club = parseInt(document.getElementById('sClub').value,10) || 139;
    cfg.sub = document.getElementById('sSub').value.trim() || 'modesto';
    cfg.token = document.getElementById('sTok').value.trim().replace(/^"|"$/g,'');
    store.set('club',cfg.club); store.set('sub',cfg.sub); store.set('token',cfg.token);
    closeDrawer(); state.teams.clear(); state.resultsByGame.clear(); state.leagues.clear(); standingsCache.clear(); weekCache.clear(); state.rating = null; historyPromise = null; boot();
  };
}

/* ---------- results tab ---------- */
function renderResults(){
  const el = document.getElementById('resultsView');
  if (!state.results.length){ el.innerHTML = `<p class="empty">${t('noResults')}</p>`; return; }
  const groups = new Map();
  for (const r of state.results){ const d = r.date.slice(0,10); if(!groups.has(d)) groups.set(d,[]); groups.get(d).push(r); }
  el.innerHTML = [...groups].map(([d,list])=>`<div><h3>${dateLong(new Date(d+'T12:00'))}</h3>
    ${list.map(r=>{
      const sets = (r.sets||[]).filter(x=>x[0]||x[1]);
      const [a,b] = r.players||[];
      const team = (t,i)=>`<div class="team${r.winner_side===i?' w':''}"><b>${t?.id && (t.players||[]).length > 1 ? teamLink(t.id, t.display_name||'—') : esc(t?.display_name||'—')}</b><small>${playersHtml(t?.players)}</small></div>`;
      const g = r.game || {};
      return `<div class="res"><div style="display:flex;flex-direction:column;gap:6px;min-width:0">${team(a,0)}${team(b,1)}</div>
        <div class="sets">${sets.map(x=>`<span><em style="${x[0]>x[1]?'':'font-weight:400;opacity:.6'}">${x[0]}</em><em style="${x[1]>x[0]?'':'font-weight:400;opacity:.6'}">${x[1]}</em></span>`).join('')}</div>
        <div class="meta">${r.date.slice(11,16)}${g.round?' · '+t('roundN', { n: g.round }):''}${r.official?' · '+t('official'):''}${r.verified?' · '+t('verified'):''}</div></div>`;
    }).join('')}</div>`).join('');
}

/* ---------- wiring ---------- */
const tabWeek = document.getElementById('tabWeek'), tabRes = document.getElementById('tabResults'), tabLg = document.getElementById('tabLeagues'), tabRt = document.getElementById('tabRating');
function showTab(which){
  if (!['week','results','leagues','rating'].includes(which)) which = 'week';
  tabWeek.setAttribute('aria-selected', which==='week'); tabRes.setAttribute('aria-selected', which==='results'); tabLg.setAttribute('aria-selected', which==='leagues'); tabRt.setAttribute('aria-selected', which==='rating');
  document.getElementById('weekView').hidden = which!=='week';
  document.getElementById('resultsView').hidden = which!=='results';
  document.getElementById('leaguesView').hidden = which!=='leagues';
  document.getElementById('ratingView').hidden = which!=='rating';
  if (which==='results') renderResults();
  if (which==='leagues') renderLeagues();
  if (which==='rating') renderRating();
  store.set('tab', which);
}
tabWeek.onclick = ()=>showTab('week'); tabRes.onclick = ()=>showTab('results'); tabLg.onclick = ()=>showTab('leagues'); tabRt.onclick = ()=>showTab('rating');
document.getElementById('tabCal').onclick = openCalendar;
document.getElementById('prev').onclick = ()=>showWeek(addDays(state.monday,-7));
document.getElementById('next').onclick = ()=>showWeek(addDays(state.monday,7));
document.getElementById('today').onclick = ()=>showWeek(mondayOf(new Date()));
document.getElementById('refresh').onclick = ()=>{ weekCache.clear(); boot(); };
document.getElementById('settingsBtn').onclick = openSettings;
document.getElementById('accountBtn').onclick = openLogin;
// Logo: back to the start screen (this week's schedule, panel closed, top of the page). Ctrl/middle-click still opens a new tab.
document.getElementById('homeLink').onclick = ev => {
  if (ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.button) return;
  ev.preventDefault();
  if (!drawer.hidden) closeDrawer();
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  showTab('week');
  showWeek(mondayOf(new Date()));
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

/* ---------- theme: Light or Dark, picked in Settings. Until the user picks one, follow the device. ---------- */
const darkMq = matchMedia('(prefers-color-scheme: dark)');
let theme = store.get('theme',''); if (!['light','dark'].includes(theme)) theme = '';   // '' = not picked yet
const curTheme = () => theme || (darkMq.matches ? 'dark' : 'light');
function applyTheme(){
  if (theme) document.documentElement.dataset.theme = theme; else delete document.documentElement.dataset.theme;
  document.querySelectorAll('[data-theme-pick]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themePick === curTheme()));
}
applyTheme();
darkMq.addEventListener('change', () => { if (!theme) applyTheme(); });

/* ---------- language switch: Croatian <-> English ---------- */
function setLang(l){
  lang = l === 'en' ? 'en' : 'hr'; store.set('lang', lang);
  applyStaticText(); updateAccountBtn();
  const openKey = !drawer.hidden ? panel.dataset.key : null;
  render(); if (!document.getElementById('resultsView').hidden) renderResults();
  if (!document.getElementById('leaguesView').hidden) renderLeagues();
  if (!document.getElementById('ratingView').hidden) renderRating();
  if (openKey && allSlots().some(x => slotKey(x) === openKey)) openSlot(openKey); else if (!drawer.hidden) closeDrawer();
}
applyStaticText();
document.addEventListener('keydown', e => {
  if (!drawer.hidden || !calModal.hidden || !confirmModal.hidden || e.target.closest('input,textarea')) return;
  if (e.key==='ArrowLeft') document.getElementById('prev').click();
  if (e.key==='ArrowRight') document.getElementById('next').click();
});

// A shared link (#s=date|court|start) opens that week and that slot, on load or when the hash changes.
async function openSharedSlot(){
  if (!location.hash.startsWith('#s=')) return false;
  const key = decodeURIComponent(location.hash.slice(3));
  const d = /^\d{4}-\d{2}-\d{2}\|\d+\|\d+$/.test(key) ? new Date(key.slice(0,10) + 'T12:00') : null;
  if (!d || isNaN(d)) return false;
  drawer.hidden = true;   // don't leave the previous slot open while the linked week loads
  await showWeek(mondayOf(d));
  if (allSlots().some(x => slotKey(x) === key)) openSlot(key); else closeDrawer();
  return true;
}
window.addEventListener('hashchange', () => {
  if (!drawer.hidden && location.hash === '#s=' + encodeURIComponent(panel.dataset.key || '')) return; // set by openSlot itself
  openSharedSlot();
});

async function boot(){
  // Paint straight away from what this browser saw last time, then refresh everything in parallel.
  loadCachedResults();
  loadCachedWeather();
  const saved = store.get('week.'+cfg.club+'.'+(cfg.token?'auth':'anon'), null);
  if (saved && saved.key === ymd(mondayOf(new Date())) && !weekCache.has(saved.key)) weekCache.set(saved.key, { at: 0, days: saved.days });
  showTab(store.get('tab','week'));
  loadClub().then(loadWeather);
  updateAccountBtn();
  loadMe().then(() => { updateAccountBtn(); if (state.me) render(); });
  if (!(await openSharedSlot())) await showWeek(state.monday);
  // The results endpoint is heavy and slows the server down for everything else, so it goes last.
  loadResults().then(() => { render(); if (!document.getElementById('resultsView').hidden) renderResults(); });
}
boot();
setInterval(()=>{ if (!document.hidden && drawer.hidden) { renderBoard(); loadWeather(); } }, 60000); // keep the "now" line moving
</script>
