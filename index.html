<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Padel Radar</title>
<meta name="description" content="Every padel court, league match and free slot for the week, with weather and booking. Built on Sporty.plus.">
<meta name="theme-color" content="#0085b2">
<meta name="apple-mobile-web-app-title" content="Padel Radar">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>try{var t=JSON.parse(localStorage.getItem('pw.theme'));if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Court glass: a blue-turf header band with a white court line, then the week board as frosted glass panels.
   Days are columns split into court lanes on a real time axis; phones get a day-by-day agenda. */
:root{
  --bg:#eef5f8; --surface:#ffffff; --fg:#13222c; --muted:#5d6f7b; --line:#d3e3eb;
  --band:#0085b2; --on-band:#ffffff; --band-soft:#cfeaf5;
  --court:#0085b2; --court-soft:#e3f2f8; --free:#4a6f0a; --free-bg:#eef7dc; --free-line:#a3c642; --peak:#7a5600; --peak-bg:#fdf4cf; --peak-line:#e0bb32; --ball:#c9d82b; --now:#e0452b; --win:#13222c;
  --l1:#d4762a; --l2:#7c4bc0; --l3:#1f9d6b; --l4:#c23d6b; --l5:#8a7a12; --l6:#0085b2;
  --f-display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r-tile:10px; --r-panel:14px; --hour:58px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1419; --surface:#12222b; --fg:#e4eef2; --muted:#8ea4af; --line:#223843;
  --band:#0b5f80; --on-band:#ffffff; --band-soft:#a9d9ec;
  --court:#3bb4de; --court-soft:#15313d; --free:#d6e24a; --free-bg:#1d2b12; --free-line:#6f8f24; --peak:#f2d35c; --peak-bg:#2a2410; --peak-line:#8c7421; --ball:#d6e24a; --now:#ff6a4f; --win:#ffffff;
  --l1:#f0954a; --l2:#a77ee8; --l3:#3cc48e; --l4:#ec6a96; --l5:#cdb93a; --l6:#3bb4de;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1419; --surface:#12222b; --fg:#e4eef2; --muted:#8ea4af; --line:#223843;
  --band:#0b5f80; --on-band:#ffffff; --band-soft:#a9d9ec;
  --court:#3bb4de; --court-soft:#15313d; --free:#d6e24a; --free-bg:#1d2b12; --free-line:#6f8f24; --peak:#f2d35c; --peak-bg:#2a2410; --peak-line:#8c7421; --ball:#d6e24a; --now:#ff6a4f; --win:#ffffff;
  --l1:#f0954a; --l2:#a77ee8; --l3:#3cc48e; --l4:#ec6a96; --l5:#cdb93a; --l6:#3bb4de;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);padding-bottom:40px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--court);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
.wrap>*{min-width:0}
#weekView{width:100%;padding-inline:0}

/* Header band: blue turf with the court's white line along the bottom */
.band{background:var(--band);color:var(--on-band);border-bottom:3px solid #fff;margin-bottom:4px}
.band .wrap{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:16px}
.brand{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}
.brand .logo{grid-row:span 2;width:44px;height:44px;border-radius:11px;box-shadow:0 0 0 2px color-mix(in srgb,#fff 70%,transparent)}
.brand h1{font:600 1.7rem/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--band-soft);font-size:.85rem}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav .range{font:500 1.05rem var(--f-display);min-width:11ch;text-align:center;font-variant-numeric:tabular-nums}
.pill{border:1px solid color-mix(in srgb,var(--on-band) 70%,transparent);background:transparent;color:var(--on-band);border-radius:999px;padding:5px 13px;font-size:.85rem}
.pill:hover{background:color-mix(in srgb,var(--on-band) 14%,transparent)}
.pill.solid{background:var(--on-band);color:var(--band);border-color:var(--on-band)}
.pill:focus-visible{outline-color:var(--on-band)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px}
.btn:hover{border-color:var(--court)}
.btn.primary{background:var(--court);border-color:var(--court);color:#fff}
.tabs{display:flex;gap:4px}
.tabs button{border:1px solid transparent;background:none;padding:6px 16px;font:500 .95rem var(--f-display);color:var(--muted);border-radius:999px}
.tabs button[aria-selected="true"]{color:var(--court);background:var(--surface);border-color:var(--line)}

/* Court switch bar: All courts / one court. Pinned under the header on phones. */
.courtbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 16px;color:var(--muted);font:500 .92rem var(--f-display);white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--court);color:#fff}
.courtnote{color:var(--muted);font-size:.82rem;display:inline-flex;align-items:center;gap:8px}
.courtnote .cam{display:inline-flex;align-items:center;gap:5px}
.courtnote .cam i{width:7px;height:7px;border-radius:50%;background:var(--now)}
.board.one{grid-template-columns:52px repeat(7,minmax(124px,1fr));min-width:920px}
@media (max-width:760px){
  .courtbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:8px 16px;border-bottom:1px solid var(--line)}
  .seg{display:flex;width:100%}
  .seg button{flex:1;padding:8px 4px}
  .courtnote{display:none}
}
.summary{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline}
.stat{display:flex;align-items:baseline;gap:6px}
.stat b{font:600 1.6rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.82rem}
.stat.hi b{color:var(--court)}

.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 9px;font-size:.82rem}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--court));flex:none}
.chip[aria-pressed="false"]{opacity:.45}
.chip[aria-pressed="false"] i{background:transparent;outline:1.5px solid var(--c,var(--court))}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums}
.chip.free i{background:linear-gradient(90deg,var(--free-bg) 50%,var(--peak-bg) 50%);border:1.5px solid var(--free-line);border-right-color:var(--peak-line);border-bottom-color:var(--peak-line)}

.status{color:var(--muted);font-size:.85rem}
.status.err{color:var(--now)}
.loading{opacity:.45;transition:opacity .15s;pointer-events:none}
@media (prefers-reduced-motion:reduce){.loading{transition:none}}

/* Week board */
.board-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel)}
.board{display:grid;grid-template-columns:52px repeat(7,minmax(176px,1fr));min-width:1290px;position:relative}
.dayhead{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:10px 8px 0}
.dayhead .d{font:500 1rem var(--f-display);display:flex;justify-content:space-between;align-items:baseline}
.dayhead .d small{font:400 .8rem var(--f-body);color:var(--muted)}
.dayhead.today .d,.dayhead.today .d small{color:var(--court)}
.dayhead.today{box-shadow:inset 0 3px 0 var(--court)}
.lanes-h{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin-top:4px}
.lanes-h span{font-size:.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:6px}
.corner{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:3}
.axis{position:relative}
.axis span{position:absolute;right:6px;transform:translateY(-50%);font:400 .72rem var(--f-mono);color:var(--muted)}
.daycol{position:relative;border-left:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:0 4px;
  background-image:repeating-linear-gradient(to bottom,color-mix(in srgb,var(--line) 70%,transparent) 0 1px,transparent 1px var(--hour))}
.daycol.today{background-color:color-mix(in srgb,var(--court-soft) 60%,transparent)}
.lane{position:relative}
.now{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--now);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--now)}

.slot{position:absolute;left:0;right:0;border-radius:var(--r-tile);padding:5px 6px;overflow:hidden;text-align:left;font-size:.74rem;line-height:1.25;display:flex;flex-direction:column;gap:1px;
  background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.slot .t{font:400 .7rem var(--f-mono);color:var(--muted)}
.slot .l{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .x{white-space:normal;overflow:hidden}
.slot .sub{color:var(--muted)}
.slot .sc{font:500 .72rem var(--f-mono);margin-top:auto}
.slot.league{border-color:color-mix(in srgb,var(--c) 65%,transparent);background:color-mix(in srgb,var(--c) 6%,var(--surface))}
.slot.league .sub,.slot.league .sc{color:var(--c)}
.slot.booking{border-color:color-mix(in srgb,var(--court) 25%,var(--line))}
.slot.free{background:var(--free-bg);border:1px solid var(--free-line);color:var(--free)}
.slot.free .t{color:var(--free);opacity:.75}
.slot.free .l{font-weight:600}
.slot.free .open{font:600 .62rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.slot.mine{background:var(--court);border-color:var(--court);color:#fff}
.slot.mine .t,.slot.mine .sub,.slot.mine .sc{color:color-mix(in srgb,#fff 82%,transparent)}
.slot:hover{border-color:var(--c,var(--court))}
/* Free slots at the week's top price (peak hours) turn padel-ball yellow; cheaper ones stay green */
.slot.free.peak{--free:var(--peak);--free-bg:var(--peak-bg);--free-line:var(--peak-line)}
.slot.free:hover{background:color-mix(in srgb,var(--free-line) 30%,var(--free-bg));border-color:var(--free)}
.slot.past{opacity:.55}
.tag{display:inline-block;font:500 .62rem var(--f-body);padding:0 5px;border-radius:999px;background:var(--court-soft);color:var(--court);vertical-align:1px}
.slot.mine .tag{background:color-mix(in srgb,#fff 22%,transparent);color:#fff}
/* Weather corner badge (yr.no) */
.slot .top{display:flex;align-items:center;justify-content:space-between;gap:2px;min-height:16px}
.slot .top .t{font-size:.68rem;letter-spacing:-.02em}
.wx{display:inline-flex;flex:none;align-items:center;gap:1px;font:500 .68rem var(--f-body);font-variant-numeric:tabular-nums;color:var(--fg);
  pointer-events:none}
.wx img{width:15px;height:15px;flex:none}
.slot.free .wx{background:transparent;color:var(--free)}
.slot.mine .wx{color:#fff}
.agenda .wx{font-size:.82rem}
.agenda .wx img{width:22px;height:22px}
.wxrow{display:inline-flex;align-items:center;gap:6px}
.wxrow img{width:28px;height:28px}
.stream{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 16px;background:var(--fg);color:var(--bg);text-decoration:none;font-weight:500}
.stream:hover{background:color-mix(in srgb,var(--fg) 85%,var(--court))}
.stream i{width:9px;height:9px;border-radius:50%;background:var(--now);box-shadow:0 0 0 3px color-mix(in srgb,var(--now) 30%,transparent)}
.drawer a.stream{color:var(--bg)}
.credit{text-align:center;padding-block:8px 0}
.credit a{color:var(--court)}

/* Agenda (phone) */
.agenda{display:none;flex-direction:column;gap:18px}
.agenda h3{font:500 1.1rem var(--f-display);margin:0 0 6px;display:flex;gap:8px;align-items:baseline}
.agenda h3 small{font:400 .82rem var(--f-body);color:var(--muted)}
.agenda h3.today,.agenda h3.today small{color:var(--court)}
.agenda ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.agenda .slot{position:static;flex-direction:row;align-items:center;gap:10px;padding:9px 12px;font-size:.85rem;width:100%}
.agenda .slot .t{min-width:4.2em}
.agenda .slot .body{min-width:0;flex:1;display:flex;flex-direction:column}
.agenda .slot .court{color:var(--muted);font-size:.75rem}
.agenda .slot.mine .court{color:color-mix(in srgb,#fff 82%,transparent)}
.agenda .slot.league .court{color:var(--c)}
.agenda .slot .sc{margin:0}
.empty{color:var(--muted);font-size:.85rem}
@media (max-width:760px){.board-scroll{display:none}.agenda{display:flex}.brand{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}
.brand .logo{grid-row:span 2;width:44px;height:44px;border-radius:11px;box-shadow:0 0 0 2px color-mix(in srgb,#fff 70%,transparent)}
.brand h1{font-size:1.4rem}.nav .range{min-width:0}}

/* Results */
.results{display:flex;flex-direction:column;gap:18px}
.results h3{font:500 1rem var(--f-display);margin:0 0 6px;color:var(--muted)}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);padding:12px 16px;margin-bottom:8px}
.res .team{min-width:0;display:flex;flex-direction:column}
.res .team b{font-weight:500}
.res .team.w b{font-weight:600;color:var(--win)}
.res .team.w b::after{content:" ●";color:var(--ball);font-size:.7em;vertical-align:2px}
.res .team small{color:var(--muted);font-size:.75rem}
.res .sets{display:flex;gap:10px;font:500 1rem var(--f-mono);align-self:center}
.res .sets span{display:flex;flex-direction:column;align-items:center;line-height:1.35}
.res .sets em{font-style:normal;font-weight:600}
.res .meta{grid-column:1/-1;color:var(--muted);font-size:.74rem;margin-top:4px}

/* Drawer */
.drawer{position:fixed;inset:0;display:flex;justify-content:flex-end;z-index:10;background:color-mix(in srgb,#0a1419 40%,transparent)}
.drawer .panel{width:min(420px,100%);height:100%;background:var(--surface);padding:calc(20px + env(safe-area-inset-top,0px)) 20px 24px;overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:-8px 0 30px rgba(0,0,0,.18);border-left:3px solid var(--court)}
.drawer h2{font:600 1.45rem/1.15 var(--f-display);margin:0;text-wrap:balance}
.drawer .when{font:400 .85rem var(--f-mono);color:var(--muted)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0}
.kv dt{color:var(--muted);font-size:.8rem;padding-top:1px}
.kv dd{margin:0}
.vs{display:flex;flex-direction:column;gap:8px;border-block:1px solid var(--line);padding-block:12px}
.vs .side b{display:block;font-weight:600}
.vs .side small{color:var(--muted)}
.vs .sep{font:500 .75rem var(--f-display);color:var(--muted);letter-spacing:.1em}
.drawer a{color:var(--court)}
.drawer .close{align-self:flex-end}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.8rem;color:var(--muted)}
.field input{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-tile);padding:8px 11px;width:100%}
.hint{color:var(--muted);font-size:.8rem;margin:0}

/* Booking */
/* Result entry */
.score{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,44px);gap:6px 6px;align-items:center}
.score .hd{font-size:.72rem;color:var(--muted);text-align:center}
.score .tm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.score .tm small{display:block;font-weight:400;color:var(--muted);font-size:.72rem;overflow:hidden;text-overflow:ellipsis}
.score input{width:44px;text-align:center;font:500 1.05rem var(--f-mono);border:1px solid var(--line);background:var(--surface);border-radius:var(--r-tile);padding:6px 0}
.score input:focus-visible{outline:2px solid var(--court);outline-offset:0}
.recap{font-weight:500}
.recap .sets{font-family:var(--f-mono)}
.confirm{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:var(--r-panel);padding:14px;background:var(--court-soft)}
.confirm .price{font:600 1.5rem var(--f-display);font-variant-numeric:tabular-nums;color:var(--court)}
.msg{font-size:.85rem;margin:0}
.msg.err{color:var(--now)}
.msg.ok{color:var(--l3)}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="brand">
      <img class="logo" src="icon.svg" alt="" width="44" height="44">
      <h1 id="clubName">Padel Radar</h1>
      <p id="clubSub">Padel Radar · live from Sporty.plus</p>
    </div>
    <div class="nav">
      <button class="pill" id="prev" aria-label="Previous week">←</button>
      <button class="pill solid" id="today">This week</button>
      <span class="range" id="range"></span>
      <button class="pill" id="next" aria-label="Next week">→</button>
      <button class="pill" id="refresh" title="Reload data" aria-label="Reload data">↻</button>
      <button class="pill" id="themeBtn" title="Switch between automatic, light and dark">Auto</button>
      <button class="pill" id="settingsBtn">Settings</button>
      <button class="pill solid" id="accountBtn">Log in</button>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="tabs" role="tablist">
    <button role="tab" id="tabWeek" aria-selected="true">Schedule</button>
    <button role="tab" id="tabResults" aria-selected="false">Results</button>
  </div>

  <section id="weekView" class="wrap" style="gap:12px">
    <div class="courtbar" id="courtBar"></div>
    <div class="summary" id="summary"></div>
    <div class="filters" id="filters"></div>
    <div class="status" id="status">Loading…</div>
    <div class="board-scroll"><div class="board" id="board"></div></div>
    <div class="agenda" id="agenda"></div>
  </section>

  <section id="resultsView" class="results" hidden></section>
  <p class="hint credit">Weather forecast from <a href="https://www.yr.no/" target="_blank" rel="noopener">Yr</a>, delivered by the Norwegian Meteorological Institute (MET Norway).</p>
</div>

<div class="drawer" id="drawer" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>

<script>
const API = 'https://api.tenis.plus';
const LEAGUE_COLORS = ['--l1','--l2','--l3','--l4','--l5','--l6'];
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

const store = {
  get(k, d){ try{ const v = localStorage.getItem('pw.'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem('pw.'+k, JSON.stringify(v)); }catch(e){} }
};
const cfg = {
  club: store.get('club', 139),
  sub: store.get('sub', 'modesto'),
  token: store.get('token', ''),
  nick: store.get('nick', {}),          // league id -> nickname
  hidden: store.get('hidden', {free:false}), // filter keys -> hidden?
  court: store.get('court', 'all')          // 'all' or a Sporty+ court id
};

const state = { monday: mondayOf(new Date()), days: [], courts: [], teams: new Map(), results: [], resultsByGame: new Map(), leagues: new Map(), club: null, me: null };

/* ---------- helpers ---------- */
function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// Sporty+ encodes times as decimal hours ×100: 850 = 8:30, 1450 = 14:30
function hrs(t){ return t/100; }
function hm(t){ const h = Math.floor(t/100), m = Math.round((t%100)*0.6); return h+':'+String(m).padStart(2,'0'); }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function rangeText(m){ const f = d => d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); return f(m)+' – '+f(addDays(m,6)); }
function sameDay(a,b){ return ymd(a)===ymd(b); }

async function api(path, body){
  const h = { 'Accept':'application/json', 'x-club': String(cfg.club) };
  if (cfg.token) h.Authorization = cfg.token.startsWith('Bearer') ? cfg.token : 'Bearer '+cfg.token;
  const opt = { headers:h };
  if (body !== undefined) { opt.method = 'POST'; h['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(API+path, opt);
  if (!r.ok) {
    let msg = ''; try { const j = await r.json(); msg = j.error || j.message || ''; } catch(_){}
    const e = new Error(msg || (r.status+' '+path)); e.status = r.status; e.apiMessage = msg; throw e;
  }
  const txt = await r.text(); try { return JSON.parse(txt); } catch(_) { return txt; }
}

/* ---------- weather: MET Norway / yr.no locationforecast ----------
   Hourly for ~2.5 days, then every 6 hours up to ~9 days. Cached for 30 minutes per club. */
/* Courts with a Matchi TV camera (Sporty+ court id -> stream link). Only Padel otvoreni for now. */
const COURT_CAMERAS = { 798: 'https://www.matchi.tv/create-stream/start?id=9i2bjHsKpf3&v2' };

const WX_ICONS = 'https://cdn.jsdelivr.net/gh/metno/weathericons@89e3173756248b4696b9b10677b66c4ef435db53/weather/svg/';
const WX_TEXT = { clearsky:'Clear sky', fair:'Fair', partlycloudy:'Partly cloudy', cloudy:'Cloudy', fog:'Fog',
  lightrain:'Light rain', rain:'Rain', heavyrain:'Heavy rain', lightrainshowers:'Light rain showers', rainshowers:'Rain showers',
  heavyrainshowers:'Heavy rain showers', lightsleet:'Light sleet', sleet:'Sleet', lightsnow:'Light snow', snow:'Snow',
  heavysnow:'Heavy snow', rainandthunder:'Rain and thunder', rainshowersandthunder:'Rain showers and thunder' };
function wxText(code){ const k = code.replace(/_(day|night|polartwilight)$/,''); return WX_TEXT[k] || k.replace(/and/g,' and ').replace(/^./, c=>c.toUpperCase()); }
function setWeather(raw){
  state.wx = (raw||[]).map(x => ({ t:x.t, temp:x.temp, wind:x.wind, sym:x.sym, rain:x.rain, span:x.span }));
}
function loadCachedWeather(){ const c = store.get('wx.'+cfg.club, null); if (c && Array.isArray(c.series)) { setWeather(c.series); return c.at; } return 0; }
async function loadWeather(){
  const lat = parseFloat(state.club?.latitude), lon = parseFloat(state.club?.longitude);
  if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
  const cached = store.get('wx.'+cfg.club, null);
  if (cached && Date.now() - cached.at < 30*60_000 && cached.lat===lat && cached.lon===lon) return;
  try {
    const r = await fetch(`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${lat.toFixed(2)}&lon=${lon.toFixed(2)}`, { headers:{ Accept:'application/json' } });
    if (!r.ok) return;
    const j = await r.json();
    const series = (j.properties?.timeseries || []).map(p => {
      const nx = p.data.next_1_hours ? { d:p.data.next_1_hours, span:1 } : p.data.next_6_hours ? { d:p.data.next_6_hours, span:6 } : null;
      return { t: Date.parse(p.time), temp: p.data.instant.details.air_temperature, wind: p.data.instant.details.wind_speed,
               sym: nx?.d.summary?.symbol_code || null, rain: nx?.d.details?.precipitation_amount ?? null, span: nx?.span || 1 };
    }).filter(x => x.sym);
    setWeather(series);
    store.set('wx.'+cfg.club, { at: Date.now(), lat, lon, series });
    render();
  } catch(e){ /* weather is a nice-to-have; the schedule works without it */ }
}
// The forecast point covering a slot's start time, or null for past slots and beyond the forecast range.
function weatherFor(s){
  const wx = state.wx; if (!wx || !wx.length) return null;
  const start = slotDate(s).getTime();
  if (slotEnd(s).getTime() < Date.now()) return null;
  let best = null;
  for (const x of wx) { if (x.t <= start) best = x; else break; }
  if (!best) best = wx[0].t - start <= 3600_000 ? wx[0] : null;
  if (!best || start - best.t >= best.span*3600_000) return null;
  return best;
}
function wxBadge(s){
  const w = weatherFor(s); if (!w) return '';
  const rain = w.rain ? `, ${w.rain} mm rain${w.span>1?' in '+w.span+' h':''}` : '';
  return `<span class="wx" title="${esc(wxText(w.sym))}, ${Math.round(w.temp)} °C${rain}"><img src="${WX_ICONS}${w.sym}.svg" alt="${esc(wxText(w.sym))}" loading="lazy">${Math.round(w.temp)}°</span>`;
}

/* Results are public and carry team + player names (slots only carry team ids), but the
   endpoint is slow (~4-6 s per page), so they load in the background and are cached in a
   trimmed form so the next visit has names and scores straight away. */
function trimResult(r){
  const team = t => t && { id:t.id, display_name:t.display_name, players:(t.players||[]).map(p=>({display_name:p.display_name})) };
  return { id:r.id, date:r.date, sets:r.sets, winner_side:r.winner_side, winner_team_id:r.winner_team_id, game_id:r.game_id,
           official:r.official, verified:r.verified, game: r.game ? { round:r.game.round } : null, players:(r.players||[]).map(team) };
}
function setResults(list){
  const seen = new Set(); state.results = [];
  for (const r of list) {
    if (seen.has(r.id)) continue; seen.add(r.id); state.results.push(r);
    for (const t of r.players||[]) if (t) state.teams.set(t.id, t);
    if (r.game_id) state.resultsByGame.set(r.game_id, r);
  }
  state.results.sort((a,b)=> b.date.localeCompare(a.date));
}
function loadCachedResults(){ const c = store.get('results.'+cfg.club, null); if (c && Array.isArray(c)) setResults(c); }
async function loadResults(){
  const pages = await Promise.allSettled([1,2,3,4,5,6].map(p => api(`/v2/result?filter[club]=${cfg.club}&limit=50&page=${p}`)));
  const fresh = pages.flatMap(p => p.status==='fulfilled' ? p.value.data.map(trimResult) : []);
  if (!fresh.length) return;
  setResults(fresh);
  store.set('results.'+cfg.club, state.results);
}

/* ---------- weeks: cached in memory, prefetched, and the current one kept in localStorage ---------- */
const weekCache = new Map();      // monday ymd -> { at, days:[courts[] per day] }
const inflight = new Map();       // monday ymd -> Promise
const FRESH_MS = 60_000;
let showSeq = 0;

function fetchWeek(monday){
  const key = ymd(monday);
  if (inflight.has(key)) return inflight.get(key);
  const q = d => `/v2/court?filter[is_active]=1&filter[club_id]=${cfg.club}&page=1&limit=50&date=${ymd(d)}&parsed2=true` + (cfg.token?'':'&unauth=true');
  const p = Promise.all([...Array(7)].map((_,i) => api(q(addDays(monday,i)))))
    .then(res => {
      // keep only what the page uses, so the cache stays small
      const days = res.map(r => r.data.map(c => ({ id:c.id, name:c.name, reservation_duration:c.reservation_duration, parsed_reservations:c.parsed_reservations })));
      const entry = { at: Date.now(), days };
      weekCache.set(key, entry);
      if (key === ymd(mondayOf(new Date()))) store.set('week.'+cfg.club+'.'+(cfg.token?'auth':'anon'), { key, ...entry });
      return entry;
    })
    .finally(() => inflight.delete(key));
  inflight.set(key, p);
  return p;
}

function applyWeek(monday, entry){
  const dates = [...Array(7)].map((_,i)=>addDays(monday,i));
  const courts = new Map();
  state.days = entry.days.map((list,i) => {
    const slots = [];
    for (const c of list) {
      courts.set(c.id, { id:c.id, name:c.name, dur:c.reservation_duration });
      for (const s of Object.values(c.parsed_reservations||{})) if (!s.hidden) slots.push(normalize(s, c, dates[i]));
    }
    return { date: dates[i], slots };
  });
  state.courts = [...courts.values()];
  const ids = new Set(); state.days.forEach(d=>d.slots.forEach(s=>s.leagueId && ids.add(s.leagueId)));
  const missing = [...ids].filter(id => !state.leagues.has(id));
  if (missing.length) Promise.all(missing.map(loadLeague)).then(() => { if (ymd(state.monday)===ymd(monday)) render(); });
}

function setLoading(on){

  document.querySelector('.board-scroll').classList.toggle('loading', on);
  document.getElementById('agenda').classList.toggle('loading', on);
}

// Show a week: instantly from cache when we have it, refreshing in the background if it's stale.
async function showWeek(monday, {force=false}={}){
  state.monday = monday;
  const seq = ++showSeq, key = ymd(monday), cached = weekCache.get(key);
  if (cached) { applyWeek(monday, cached); render(); }
  else { const r = document.getElementById('range'); if (r) r.textContent = rangeText(monday); }
  if (cached && !force && Date.now()-cached.at < FRESH_MS) { setLoading(false); prefetchAround(monday); return; }
  setLoading(!cached);
  try {
    const entry = await fetchWeek(monday);
    if (seq !== showSeq) return;           // user already moved to another week
    applyWeek(monday, entry); render();
    setLoading(false);
    prefetchAround(monday);
  } catch(e) {
    if (seq !== showSeq) return;
    setLoading(false);
    if (!cached){ state.days = []; state.courts = []; render(); }
    const status = document.getElementById('status');
    status.className='status err';
    status.textContent = e.status===401 ? 'The login token was refused. Clear it in Settings or paste a fresh one.' : 'Could not load the schedule ('+e.message+'). Check your connection and press ↻.';
  }
}
function prefetchAround(monday){
  for (const d of [7,-7,14]) { const m = addDays(monday,d), c = weekCache.get(ymd(m)); if (!c || Date.now()-c.at > FRESH_MS) fetchWeek(m).catch(()=>{}); }
}
// Used after a booking: refetch the visible week.
async function loadWeek(){ weekCache.delete(ymd(state.monday)); await showWeek(state.monday, {force:true}); }

function normalize(s, court, date){
  const booked = !!s.id;
  const start = booked ? s.start_time : s.time;
  const end = booked ? s.end_time : s.time + (court.reservation_duration/60)*100;
  const comp = s.competition?.object || {};
  const teamIds = [...new Set((s.players||[]).map(p=>p.team_id).filter(Boolean))];
  return {
    raw:s, court, date, booked, start, end,
    price: s.price, leagueId: comp.league_id || null, tournamentId: comp.tournament_id || null,
    kind: !booked ? 'free' : (comp.league_id || comp.tournament_id) ? 'league' : 'booking',
    teamIds, players: s.players||[], recurring: !!s.recurring, openSeats: s.open_seats||0,
    waiting: (s.waiting_list||[]).length, byClub: s.type==='in_behalf', gameId: s.game_id, id: s.id
  };
}

/* ---------- naming ---------- */
function leagueName(id){ return cfg.nick[id] || state.leagues.get(id)?.name || ('League #'+id); }
function leagueColor(id){

  return `var(${LEAGUE_COLORS[Math.max(0,ids.indexOf(id)) % LEAGUE_COLORS.length]})`;

function teamName(id){ return state.teams.get(id)?.display_name || null; }
function teamPlayers(id){ return (state.teams.get(id)?.players||[]).map(p=>p.display_name).join(', '); }
function namedPlayers(s){ return s.players.map(p=>p.display_name).filter(Boolean); }
// A booking is yours when you or your team is on it (player ids are only visible with a login token).
function isMine(s){
  const m = state.me; if (!m || !s.booked) return false;
  const teamId = m.team?.id;
  return s.players.some(p => (p.id && p.id===m.id) || (teamId && p.team_id===teamId));
}
function freePrices(){ return allSlots().filter(x=>x.kind==='free' && x.price!=null).map(x=>x.price); }
function slotClass(s){ return s.kind + (isMine(s)?' mine':'') + (s.kind==='free' && s.price!=null && s.price === state.peak && state.low < state.peak ? ' peak' : ''); }
function slotTitle(s){
  if (s.kind==='free') return s.price!=null ? `Free · €${s.price}` : 'Free';
  if (s.kind==='league'){
    const names = s.teamIds.map(teamName);
    if (s.teamIds.length===2 && names.every(Boolean)) return names.join(' – ');
    if (names.some(Boolean)) return names.filter(Boolean).join(' – ');
    return 'League match';
  }
  if (isMine(s)) return 'Your booking';
  const np = namedPlayers(s);
  if (np.length) return np.join(', ');
  return s.byClub ? 'Club booking' : 'Booked';
}
function filterKey(s){ return s.kind==='league' ? 'L'+(s.leagueId||'t'+s.tournamentId) : s.kind; }
function scoreLine(r){ return (r.sets||[]).filter(x=>x[0]||x[1]).map(x=>x[0]+'-'+x[1]).join(' '); }

function shownCourts(){

function shortCourt(name){ const n = name.replace(/^padel\s+/i, ''); return n.charAt(0).toUpperCase() + n.slice(1); }

  el.querySelectorAll('[data-court]').forEach(b => b.onclick = () => { cfg.court = b.dataset.court; store.set('court', cfg.court); render(); });
}

/* ---------- Enter a result for your own past match ----------
   Same request the official app sends from a booking: POST /v2/result with the booking's game id,
   both teams, and five [a,b] sets (unplayed sets stay 0-0). Scores follow the order of the players array. */
function canEnterResult(s){
  return !!(cfg.token && state.me && s.booked && s.gameId && isMine(s) && slotEnd(s) < new Date()
    && !state.resultsByGame.has(s.gameId) && s.teamIds.length === 2);
}
function teamLabel(id){ return teamName(id) || (state.me?.team?.id === id ? 'Your team' : 'Team #'+id); }
function resultSection(s){
  if (!cfg.token || !state.me || !s.booked || !isMine(s) || slotEnd(s) >= new Date() || state.resultsByGame.has(s.gameId)) return '';
  if (!canEnterResult(s)) return `<p class="hint">To enter a result here, both teams need to be on the booking. You can still enter it in Sporty.plus.</p>`;
  const row = (id, i) => `<span class="tm">${esc(teamLabel(id))}${teamPlayers(id)?`<small>${esc(teamPlayers(id))}</small>`:''}</span>` +
    [0,1,2].map(k => `<input id="sc${i}${k}" inputmode="numeric" maxlength="1" aria-label="${esc(teamLabel(id))}, set ${k+1}" autocomplete="off">`).join('');
  return `<div class="confirm" id="resBox">
    <div><div class="hint">Your match</div><b>Enter the result</b></div>
    <div class="score"><span></span><span class="hd">Set 1</span><span class="hd">Set 2</span><span class="hd">Set 3</span>
      ${row(s.teamIds[0],0)}${row(s.teamIds[1],1)}</div>
    <p class="hint">Leave set 3 empty if you won in two sets.</p>
    <button class="btn primary" id="resGo" type="button" style="align-self:flex-start">Review result</button>
    <p class="msg" id="resMsg" aria-live="polite"></p></div>`;
}
// Returns { sets:[[a,b]x5], error } after checking it looks like a real padel score.
function readScore(){
  const v = (i,k) => document.getElementById('sc'+i+k).value.trim();
  const sets = [], won = [0,0];
  for (let k = 0; k < 3; k++) {
    const a = v(0,k), b = v(1,k);
    if (a === '' && b === '') { if (k < 2) return { error: 'Enter at least two sets.' }; continue; }
    if (a === '' || b === '') return { error: `Fill in both scores for set ${k+1}.` };
    const x = +a, y = +b;
    if (!Number.isInteger(x) || !Number.isInteger(y) || x > 7 || y > 7) return { error: `Set ${k+1} needs scores from 0 to 7.` };
    const hi = Math.max(x,y), lo = Math.min(x,y);
    if (!((hi === 6 && lo <= 4) || (hi === 7 && (lo === 5 || lo === 6)))) return { error: `Set ${k+1} (${x}-${y}) isn't a finished set. Sets end 6-0 to 6-4, 7-5 or 7-6.` };
    if (k === 2 && won[0] !== won[1]) return { error: 'The match was already decided in two sets, so leave set 3 empty.' };
    won[x > y ? 0 : 1]++; sets.push([x,y]);
  }
  if (won[0] === won[1]) return { error: 'One team needs to win two sets.' };
  while (sets.length < 5) sets.push([0,0]);
  return { sets, winner: won[0] > won[1] ? 0 : 1 };
}
function wireResult(s){
  const go = document.getElementById('resGo'); if (!go) return;
  const msg = document.getElementById('resMsg');
  const inputs = [...document.querySelectorAll('#resBox input')];
  let armed = null;
  const disarm = () => { if (armed) { armed = null; go.textContent = 'Review result'; msg.className = 'msg'; msg.textContent = ''; } };
  inputs.forEach((el, n) => {
    el.addEventListener('input', () => { el.value = el.value.replace(/[^0-9]/g,''); disarm(); if (el.value && inputs[n+1]) inputs[n+1].focus(); });
  });
  inputs[0].focus();
  go.onclick = async () => {
    if (!armed) {
      const r = readScore();
      if (r.error) { msg.className = 'msg err'; msg.textContent = r.error; return; }
      armed = r;
      const line = r.sets.filter(x => x[0]||x[1]).map(x => x[0]+'-'+x[1]).join(' ');
      msg.className = 'msg';
      msg.innerHTML = `<span class="recap">${esc(teamLabel(s.teamIds[r.winner]))} won <span class="sets">${line}</span></span><br>This is saved to Sporty.plus as an official result and counts towards rankings and league tables.`;
      go.textContent = 'Submit result';
      return;
    }
    go.disabled = true; go.textContent = 'Submitting…';
    const payload = {
      created_at: new Date().toISOString(), verified: null, points: 0, surface: {},
      game_id: s.gameId,
      players: s.teamIds.map(id => ({ id, type: 'team' })),
      sets: armed.sets, tie_break: armed.sets.map(() => [0,0])
    };
    try {
      const res = await api('/v2/result', payload);
      const saved = res && (res.data || res);
      if (saved && saved.id) {
        const t = trimResult({ ...saved,
          game_id: saved.game_id || s.gameId,
          date: saved.date || ymd(new Date()) + ' ' + new Date().toTimeString().slice(0,8),
          sets: saved.sets || payload.sets,
          winner_side: saved.winner_side ?? armed.winner,
          players: saved.players || s.teamIds.map(id => state.teams.get(id) || { id, display_name: teamLabel(id) }) });
        setResults([t, ...state.results]); store.set('results.'+cfg.club, state.results);
      }
      msg.className = 'msg ok'; msg.textContent = 'Result saved. The other team may need to confirm it in Sporty.plus.';
      go.hidden = true; inputs.forEach(el => el.disabled = true);
      render();
      loadResults().then(() => { render(); if (!document.getElementById('resultsView').hidden) renderResults(); });
    } catch(e) {
      msg.className = 'msg err';
      msg.textContent = e.status===401 ? 'Your login has expired. Log in again and retry.' : 'Sporty.plus didn’t accept the result: ' + (e.apiMessage || e.message);
      go.disabled = false; go.textContent = 'Submit result';
    }

function wireBooking(s){
  const go = document.getElementById('bookGo'); if (!go) return;
  const msg = document.getElementById('bookMsg');
  api('/v2/reservation/price', bookingPayload(s)).then(p => {
    const n = typeof p==='number' ? p : Object.values(p||{}).filter(v=>typeof v==='number').reduce((a,b)=>a+b, NaN);
    if (Number.isFinite(n)) document.getElementById('bookPrice').textContent = '€'+n;
  }).catch(()=>{});
  let armed = false;
  go.onclick = async () => {
    if (!armed){ armed = true; go.textContent = 'Tap again to confirm'; msg.className='msg'; msg.textContent = `${s.court.name}, ${s.date.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})} at ${hm(s.start)}.`; return; }
    go.disabled = true; go.textContent = 'Booking…';
    try {
      await api('/v2/reservation', bookingPayload(s));
      msg.className = 'msg ok'; msg.textContent = 'Booked. Updating the schedule…'; go.hidden = true;
      await loadWeek(); render();
      setTimeout(closeDrawer, 1200);
    } catch(e) {
      msg.className = 'msg err';
      msg.textContent = e.status===401 ? 'Your login token was refused. Paste a fresh one in Settings.' : 'Sporty.plus refused the booking: ' + (e.apiMessage || e.message);
      go.disabled = false; go.textContent = 'Try again'; armed = true;
    }
  };
}

function slotDate(s){ const d = new Date(s.date); const h = Math.floor(s.start/100); d.setHours(h, Math.round((s.start%100)*0.6)); return d; }
function slotEnd(s){ const d = new Date(s.date); d.setHours(Math.floor(s.end/100), Math.round((s.end%100)*0.6)); return d; }

function slotInner(s, compact){
  if (s.kind==='free') return `<span class="top"><span class="t">${hm(s.start)}</span>${wxBadge(s)}</span><span class="open">Free</span><span class="l">${s.price!=null?'€'+s.price:''}</span>`;
  const r = state.resultsByGame.get(s.gameId);
  const tags = [s.recurring?'<span class="tag" title="Recurring booking">weekly</span>':'', s.openSeats?`<span class="tag" title="Open seats">+${s.openSeats}</span>`:''].join(' ');
  const sub = s.kind==='league' ? leagueName(s.leagueId) : s.kind==='booking' ? (s.players.length? s.players.length+' player'+(s.players.length>1?'s':''):'') : '';
  return `<span class="top"><span class="t">${compact ? hm(s.start) : hm(s.start)+'–'+hm(s.end)}</span>${wxBadge(s)}</span>
    <span class="${compact?'l':'x'}">${esc(slotTitle(s))}</span>

    ${r?`<span class="sc">${esc(scoreLine(r))}</span>`:''}`;
}

function renderBoard(){
  const board = document.getElementById('board');
  if (!state.days.length){ board.innerHTML=''; return; }
  const all = allSlots();
  const courts = shownCourts(), single = courts.length === 1 && state.courts.length > 1;
  board.classList.toggle('one', single);
  const min = Math.floor(Math.min(...all.map(s=>hrs(s.start)), 8));
  const max = Math.ceil(Math.max(...all.map(s=>hrs(s.end)), 22));
  const H = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour'));
  const height = (max-min)*H;
  const now = new Date();
  let html = `<div class="corner"></div>`;
  state.days.forEach((d,i)=>{
    const t = sameDay(d.date, now);
    html += `<div class="dayhead${t?' today':''}"><div class="d">${DAYS[i]} <small>${d.date.getDate()}.${d.date.getMonth()+1}.</small></div>
      <div class="lanes-h">${courts.map(c=>`<span title="${esc(c.name)}">${esc(c.name)}</span>`).join('')}</div></div>`;
  });
  html += `<div class="axis" style="height:${height}px">${[...Array(max-min+1)].map((_,i)=>i&&i<max-min?`<span style="top:${i*H}px">${min+i}:00</span>`:'').join('')}</div>`;
  state.days.forEach((d)=>{
    const t = sameDay(d.date, now);
    html += `<div class="daycol${t?' today':''}" style="height:${height}px">`;
    for (const c of courts){
      html += `<div class="lane">`;
      for (const s of d.slots.filter(s=>s.court.id===c.id && visible(s))){
        const top = (hrs(s.start)-min)*H, h = (hrs(s.end)-hrs(s.start))*H - 3;
        const style = `top:${top+1}px;height:${h}px;${s.kind==='league'?'--c:'+leagueColor(s.leagueId):''}`;
        const past = slotEnd(s) < now ? ' past':'';
        html += `<button class="slot ${slotClass(s)}${past}" style="${style}" data-id="${slotKey(s)}">${slotInner(s,!single)}</button>`;
      }
      html += `</div>`;
    }
    if (t){ const nh = now.getHours()+now.getMinutes()/60; if (nh>=min && nh<=max) html += `<div class="now" style="top:${(nh-min)*H}px"></div>`; }
    html += `</div>`;
  });
  board.innerHTML = html;
  board.querySelectorAll('.slot').forEach(b=>b.onclick=()=>openSlot(b.dataset.id));
}

/* ---------- Log in with your Sporty+ account ----------
   Same flow as the official app: the password goes straight from this browser to Sporty+
   (api.sporty.plus) and is never stored. Only the returned session token is kept, in this browser. */
const AUTH = 'https://api.sporty.plus/api/v3';
async function authPost(path, body, token){
  const h = { 'Accept':'application/json', 'Content-Type':'application/json' };
  if (token) h.Authorization = token;
  const r = await fetch(AUTH+path, { method:'POST', headers:h, body: JSON.stringify(body||{}) });
  let j = {}; try { j = await r.json(); } catch(_){}
  if (!r.ok) {
    const e = new Error(j.errors?.[0]?.detail || j.message || j.error || ('Sporty.plus answered '+r.status));
    e.status = r.status; e.data = j; throw e;
  }
  return j;
}
function loginErrorText(e){
  if (e.status===429) return 'Too many attempts. Wait a minute and try again.';
  if (e.status===422) return e.message.includes('credentials') ? 'That email and password don’t match a Sporty.plus account.' : e.message;
  return e.message || 'Could not reach Sporty.plus. Check your connection and try again.';
}
async function useToken(raw){
  cfg.token = raw.startsWith('Bearer') ? raw : 'Bearer '+raw;
  store.set('token', cfg.token);
  state.teams.clear(); state.resultsByGame.clear(); state.leagues.clear(); weekCache.clear();
  await loadMe(); updateAccountBtn(); boot();
}
function updateAccountBtn(){
  const b = document.getElementById('accountBtn');
  b.textContent = state.me ? (myName().split(' ')[0] || 'Account') : (cfg.token ? 'Account' : 'Log in');
  b.classList.toggle('solid', !cfg.token);
}

function openLogin(){
  if (cfg.token) return openAccount();
  openDrawer(`<h2>Log in with Sporty.plus</h2>
    <p class="hint">Use the same email and password as the ${esc(state.club?.name || 'club')} app. Your password goes straight to Sporty.plus and isn't saved here.</p>
    <form id="loginForm" class="wrap" style="padding:0;gap:12px" novalidate>
      <div class="field"><label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="username" placeholder="ana.horvat@gmail.com" required></div>
      <div class="field"><label for="lPass">Password</label><input id="lPass" type="password" autocomplete="current-password" required></div>
      <div class="field" id="lCodeRow" hidden><label for="lCode">Code from your authenticator app</label><input id="lCode" inputmode="numeric" autocomplete="one-time-code" placeholder="123456"></div>
      <button class="btn primary" id="lGo" type="submit" style="align-self:flex-start">Log in</button>
      <p class="msg" id="lMsg" aria-live="polite"></p>
    </form>`);
  const f = document.getElementById('loginForm'), msg = document.getElementById('lMsg'), go = document.getElementById('lGo');
  let challenge = null;
  document.getElementById('lEmail').focus();
  f.onsubmit = async (ev) => {
    ev.preventDefault();
    const email = document.getElementById('lEmail').value.trim(), pass = document.getElementById('lPass').value;
    const code = document.getElementById('lCode').value.trim();
    msg.className = 'msg err';
    if (!challenge && (!email || !pass)) { msg.textContent = 'Enter your email and password.'; return; }
    if (challenge && !code) { msg.textContent = 'Enter the code from your authenticator app.'; return; }
    go.disabled = true; go.textContent = 'Logging in…'; msg.textContent = '';
    try {
      const r = challenge
        ? await authPost('/login/two-factor-challenge', { challenge, code, recovery_code: null })
        : await authPost('/login', { client:'native', email, password: pass });
      if (!r.token) throw new Error('Sporty.plus did not return a session. Try again.');
      msg.className = 'msg ok'; msg.textContent = 'Logged in. Loading your view…';
      await useToken(r.token);
      setTimeout(closeDrawer, 600);
    } catch(e) {
      if (!challenge && e.data && e.data.error==='two_factor_required' && e.data.challenge) {
        challenge = e.data.challenge;
        document.getElementById('lCodeRow').hidden = false; document.getElementById('lCode').focus();
        msg.className = 'msg'; msg.textContent = 'Your account uses two-step login. Enter the code to finish.';
      } else msg.textContent = challenge && e.status===422 ? 'That code isn’t right. Try again.' : loginErrorText(e);
      go.disabled = false; go.textContent = challenge ? 'Confirm code' : 'Log in';
    }
  };
}

  loadCachedWeather();
  const saved = store.get('week.'+cfg.club+'.'+(cfg.token?'auth':'anon'), null);
  if (saved && saved.key === ymd(mondayOf(new Date())) && !weekCache.has(saved.key)) weekCache.set(saved.key, { at: 0, days: saved.days });
  showTab(store.get('tab','week'));
  loadClub().then(loadWeather);
  updateAccountBtn();
  loadMe().then(() => { updateAccountBtn(); if (state.me) render(); });
  await showWeek(state.monday);
  // The results endpoint is heavy and slows the server down for everything else, so it goes last.
  loadResults().then(() => { render(); if (!document.getElementById('resultsView').hidden) renderResults(); });
}
boot();
setInterval(()=>{ if (!document.hidden && drawer.hidden) { renderBoard(); loadWeather(); } }, 60000); // keep the "now" line moving
</script>
</body>
