<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Padel Radar</title>
<meta name="description" content="Svi padel tereni, ligaške utakmice i slobodni termini za cijeli tjedan, s prognozom i rezervacijama. Na temelju Sporty.plus.">
<meta name="theme-color" content="#0085b2">
<meta name="apple-mobile-web-app-title" content="Padel Radar">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>try{var t=JSON.parse(localStorage.getItem('pw.theme'));if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Court glass: a blue-turf header band with a white court line, then the week board as frosted glass panels.
   Days are columns split into court lanes on a real time axis; phones get a day-by-day agenda. */
:root{
  --bg:#eef5f8; --surface:#ffffff; --fg:#13222c; --muted:#5d6f7b; --line:#d3e3eb;
  --band:#0085b2; --on-band:#ffffff; --band-soft:#cfeaf5;
  --court:#0085b2; --court-soft:#e3f2f8; --free:#2d6a4f; --free-bg:#e3f3e9; --free-line:#a8d4bd; --peak:#7a5a20; --peak-bg:#f5ead7; --peak-line:#d8c7a6; --rain:#2f6fd0; --rain-soft:#e8f0fc; --taken:#d64545; --taken-soft:#fde8e8; --ball:#c9d82b; --now:#e0452b; --win:#13222c;
  --l1:#d4762a; --l2:#7c4bc0; --l3:#1f9d6b; --l4:#c23d6b; --l5:#8a7a12; --l6:#0085b2;
  --f-display:"Barlow Condensed",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r-tile:10px; --r-panel:14px; --hour:58px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1419; --surface:#12222b; --fg:#e4eef2; --muted:#8ea4af; --line:#223843;
  --band:#0b5f80; --on-band:#ffffff; --band-soft:#a9d9ec;
  --court:#3bb4de; --court-soft:#15313d; --free:#8fd3b0; --free-bg:#173126; --free-line:#2f5a45; --peak:#e0c792; --peak-bg:#33291a; --peak-line:#5a4c33; --rain:#7fb0ff; --rain-soft:#15243c; --taken:#ff6b6b; --taken-soft:#3a1d20; --ball:#d6e24a; --now:#ff6a4f; --win:#ffffff;
  --l1:#f0954a; --l2:#a77ee8; --l3:#3cc48e; --l4:#ec6a96; --l5:#cdb93a; --l6:#3bb4de;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1419; --surface:#12222b; --fg:#e4eef2; --muted:#8ea4af; --line:#223843;
  --band:#0b5f80; --on-band:#ffffff; --band-soft:#a9d9ec;
  --court:#3bb4de; --court-soft:#15313d; --free:#8fd3b0; --free-bg:#173126; --free-line:#2f5a45; --peak:#e0c792; --peak-bg:#33291a; --peak-line:#5a4c33; --rain:#7fb0ff; --rain-soft:#15243c; --taken:#ff6b6b; --taken-soft:#3a1d20; --ball:#d6e24a; --now:#ff6a4f; --win:#ffffff;
  --l1:#f0954a; --l2:#a77ee8; --l3:#3cc48e; --l4:#ec6a96; --l5:#cdb93a; --l6:#3bb4de;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);padding-bottom:40px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--court);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
.wrap>*{min-width:0}
#weekView{width:100%;padding-inline:0}

/* Header band: blue turf with the court's white line along the bottom */
.band{background:var(--band);color:var(--on-band);border-bottom:3px solid #fff;margin-bottom:4px}
.band .wrap{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:16px}
.brand{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;color:inherit;text-decoration:none;border-radius:12px}
.brand:hover .logo{box-shadow:0 0 0 2px #fff}
.brand:focus-visible{outline-color:var(--on-band);outline-offset:4px}
.brand .logo{grid-row:span 2;width:44px;height:44px;border-radius:11px;box-shadow:0 0 0 2px color-mix(in srgb,#fff 70%,transparent)}
.brand h1{font:600 1.87rem/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--band-soft);font-size:.85rem}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav .range{font:500 1.16rem var(--f-display);min-width:11ch;text-align:center;font-variant-numeric:tabular-nums}
.pill{border:1px solid color-mix(in srgb,var(--on-band) 70%,transparent);background:transparent;color:var(--on-band);border-radius:999px;padding:5px 13px;font-size:.85rem}
.pill:hover{background:color-mix(in srgb,var(--on-band) 14%,transparent)}
.pill.solid{background:var(--on-band);color:var(--band);border-color:var(--on-band)}
.pill:focus-visible{outline-color:var(--on-band)}
.acts{display:flex;align-items:center;gap:6px}
.pill.icon{display:inline-grid;place-items:center;padding:5px 9px}
.pill.icon svg{width:18px;height:18px;display:block}
/* Logged in: profile tile with photo and first name */
.pill.me{display:inline-flex;flex-direction:column;align-items:center;gap:2px;border-radius:14px;padding:4px 10px 3px;background:color-mix(in srgb,var(--on-band) 16%,transparent)}
.pill.me:hover{background:color-mix(in srgb,var(--on-band) 26%,transparent)}
.pill.me .av{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--band-soft);color:var(--band);display:grid;place-items:center;font:600 0.79rem var(--f-display)}
.pill.me .nm{font-size:.72rem;line-height:1.1;max-width:10ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px}
.btn:hover{border-color:var(--court)}
.btn.primary{background:var(--court);border-color:var(--court);color:#fff}
.tabs{display:flex;gap:4px}
.tabs button{border:1px solid transparent;background:none;padding:6px 16px;font:500 1.04rem var(--f-display);color:var(--muted);border-radius:999px}
.tabs button[aria-selected="true"]{color:var(--court);background:var(--surface);border-color:var(--line)}

/* Court switch bar: All courts / one court. Pinned under the header on phones. */
.seg.pick button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg.pick svg{width:16px;height:16px}
.flabel{font-size:.85rem;color:var(--muted)}
.tabs .caltab{display:inline-flex;align-items:center;gap:6px}
.tabs .caltab svg{width:16px;height:16px}
.tabs .caltab:hover{color:var(--fg)}
/* Calendar popup */
.modal{position:fixed;inset:0;z-index:11;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,#0a1419 45%,transparent)}
.mbox{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:0 18px 50px rgba(0,0,0,.25);padding:16px;display:flex;flex-direction:column;gap:12px}
.chead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chead h2{font:600 1.26rem var(--f-display);margin:0}
.btn.icon{width:36px;height:36px;padding:0;display:grid;place-items:center;font-size:1.2rem;line-height:1}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cgrid .ch{text-align:center;font-size:.72rem;color:var(--muted);padding-bottom:2px}
.cday{border:1px solid transparent;background:none;border-radius:10px;padding:5px 0 3px;display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:0}
.cday b{font:500 1.08rem var(--f-display);font-variant-numeric:tabular-nums}
.cday small{font:500 .68rem var(--f-body);color:var(--free);min-height:1.1em;font-variant-numeric:tabular-nums}
.cday small.none{color:var(--muted)}
.cday:hover{border-color:var(--court)}
.cday.wk{background:var(--court-soft)}
.cday.today{border-color:var(--court)}
.cday.today b{color:var(--court)}
.cday.past b,.cday.out b{color:var(--muted);font-weight:400}
.cday.out{opacity:.6}
/* Cancel booking: button in the panel, confirm popup above it */
.btn.danger{border-color:var(--taken);color:var(--taken)}
.btn.danger:hover{background:var(--taken-soft)}
.btn.dangersolid{background:var(--taken);border-color:var(--taken);color:#fff;font-weight:600}
.btn.dangersolid:hover{filter:brightness(1.08)}
.cancelrow{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.cancelnote{display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cancelnote b{font-weight:600}
#confirmModal{z-index:12}
#confirmBox h2{font:600 1.32rem var(--f-display);margin:0}
.cfwhat{display:flex;flex-direction:column;gap:2px;background:var(--court-soft);border-radius:10px;padding:10px 12px}
.cfwhat span{color:var(--muted);font-size:.85rem}
#confirmBox .hint{margin:0}
.cfbtns{display:flex;flex-wrap:wrap;gap:8px}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dayhead.flash{animation:flash 1.4s ease-out}
@keyframes flash{from{background:var(--court-soft)}to{background:var(--surface)}}
@media (prefers-reduced-motion:reduce){.dayhead.flash{animation:none}}
.seg.pick{display:flex}
.seg.pick button{flex:1}
.courtbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 16px;color:var(--muted);font:500 1.01rem var(--f-display);white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--court);color:#fff}
.courtnote{color:var(--muted);font-size:.82rem;display:inline-flex;align-items:center;gap:8px}
.courtnote .cam{display:inline-flex;align-items:center;gap:5px}
.courtnote .cam i{width:7px;height:7px;border-radius:50%;background:var(--now)}
.board.one{grid-template-columns:52px repeat(7,minmax(124px,1fr));min-width:920px}
@media (max-width:760px){
  .courtbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:8px 16px;border-bottom:1px solid var(--line)}
  .seg{display:flex;width:100%}
  .seg button{flex:1;padding:8px 4px}
  .courtnote{display:none}
}
.summary{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline}
.stat{display:flex;align-items:baseline;gap:6px}
.stat b{font:600 1.76rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.82rem}
.stat.hi b{color:var(--court)}

.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 9px;font-size:.82rem}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--court));flex:none}
.chip[aria-pressed="false"]{opacity:.45}
.chip[aria-pressed="false"] i{background:transparent;outline:1.5px solid var(--c,var(--court))}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums}
.chip.free i{background:var(--surface);border:1.5px dashed var(--muted)}

.status{color:var(--muted);font-size:.85rem}
.status.err{color:var(--now)}
.loading{opacity:.45;transition:opacity .15s;pointer-events:none}
@media (prefers-reduced-motion:reduce){.loading{transition:none}}

/* Week board */
.board-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel)}
.board{display:grid;grid-template-columns:52px repeat(7,minmax(176px,1fr));min-width:1290px;position:relative}
.dayhead{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:10px 8px 0}
.dayhead .d{font:500 1.1rem var(--f-display);display:flex;justify-content:space-between;align-items:baseline}
.dayhead .d small{font:400 .8rem var(--f-body);color:var(--muted)}
.dayhead.today .d,.dayhead.today .d small{color:var(--court)}
.dayhead.today{box-shadow:inset 0 3px 0 var(--court)}
.lanes-h{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin-top:4px}
.lanes-h span{font-size:.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:6px}
.corner{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:3}
.axis{position:relative}
.axis span{position:absolute;right:6px;margin-top:3px;font:400 .72rem var(--f-mono);color:var(--muted)}
.daycol{position:relative;border-left:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:0 4px;
  background-image:repeating-linear-gradient(to bottom,color-mix(in srgb,var(--line) 70%,transparent) 0 1px,transparent 1px var(--step,var(--hour)));background-position:0 var(--off,0)}
.daycol.today{background-color:color-mix(in srgb,var(--court-soft) 60%,transparent)}
.lane{position:relative}
.now{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--now);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--now)}

.slot{position:absolute;left:0;right:0;border-radius:var(--r-tile);padding:5px 6px;overflow:hidden;text-align:left;font-size:.74rem;line-height:1.25;display:flex;flex-direction:column;gap:1px;
  background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.slot .t{font:400 .7rem var(--f-mono);color:var(--muted)}
.slot .l{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .x{white-space:normal;overflow:hidden}
.slot .sub{color:var(--muted)}
.slot .sc{font:500 .72rem var(--f-mono);margin-top:auto}
.slot.league{border-color:color-mix(in srgb,var(--c) 65%,transparent);background:color-mix(in srgb,var(--c) 6%,var(--surface))}
.slot.league .sub,.slot.league .sc{color:var(--c)}
.slot.booking{border-color:color-mix(in srgb,var(--court) 25%,var(--line))}
/* Free slots: neutral dashed tile; only the price chip carries colour (green = cheaper, sand = week's top price) */
.slot.free{background:var(--surface);border:1px dashed color-mix(in srgb,var(--muted) 50%,transparent);color:var(--fg)}
.slot.free .t{color:var(--muted)}
.slot.free .l{font-weight:600}
.slot.free .open{font:600 .62rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pchip{display:inline-block;border-radius:999px;padding:0 8px;font:600 .74rem/1.5 var(--f-body);font-variant-numeric:tabular-nums;background:var(--free-bg);color:var(--free);white-space:nowrap}
.slot.peak .pchip{background:var(--peak-bg);color:var(--peak)}
.agenda .slot .pchip{font-size:.8rem;padding:1px 9px}
/* Booked by someone else: red strip across the top (your own bookings stay solid blue) */
.slot.taken{border-top:3px solid var(--taken)}
.agenda .slot.taken{border-top-width:3px}
.tag.taken{background:var(--taken-soft);color:var(--taken)}
.agenda .slot .court .tag{margin-right:6px;vertical-align:1px}
.slot.mine{background:var(--court);border-color:var(--court);color:#fff}
.slot.mine .t,.slot.mine .sub,.slot.mine .sc{color:color-mix(in srgb,#fff 82%,transparent)}
.slot:hover{border-color:var(--c,var(--court))}
/* Free slots at the week's top price (peak hours) turn padel-ball yellow; cheaper ones stay green */
.slot.free:hover{background:var(--court-soft);border-color:var(--court);border-style:solid}
.slot.past{opacity:.55}
/* Rain plan: outdoor slots where rain is likely */
.slot.wet{box-shadow:inset 3px 0 0 var(--rain)}
.slot.free .open .rw,.agenda .slot.free .rw{color:var(--rain)}
.tag.rain{background:var(--rain-soft);color:var(--rain)}
.rainplan{display:flex;flex-direction:column;gap:8px;border:1px solid color-mix(in srgb,var(--rain) 45%,var(--line));border-radius:var(--r-panel);padding:12px 14px;background:var(--rain-soft)}
.rainplan b{color:var(--rain);font-weight:600}
.rainplan .btn{align-self:flex-start}
/* Share + calendar */
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions .btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg)}
.actions svg{width:16px;height:16px;flex:none}
.shareopts{display:flex;flex-wrap:wrap;gap:8px}
.shareopts[hidden]{display:none}
.tag{display:inline-block;font:500 .62rem var(--f-body);padding:0 5px;border-radius:999px;background:var(--court-soft);color:var(--court);vertical-align:1px}
.slot.mine .tag{background:color-mix(in srgb,#fff 22%,transparent);color:#fff}
/* Weather corner badge (yr.no) */
.slot .top{display:flex;align-items:center;justify-content:space-between;gap:2px;min-height:16px}
.slot .top .t{font-size:.68rem;letter-spacing:-.02em}
.wx{display:inline-flex;flex:none;align-items:center;gap:1px;font:500 .68rem var(--f-body);font-variant-numeric:tabular-nums;color:var(--fg);
  pointer-events:none}
.wx img{width:15px;height:15px;flex:none}
.slot.free .wx{background:transparent;color:var(--fg)}
.slot.mine .wx{color:#fff}
.agenda .wx{font-size:.82rem}
.agenda .wx img{width:22px;height:22px}
.wxrow{display:inline-flex;align-items:center;gap:6px}
.wxrow img{width:28px;height:28px}
.stream{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 16px;background:var(--fg);color:var(--bg);text-decoration:none;font-weight:500}
.stream:hover{background:color-mix(in srgb,var(--fg) 85%,var(--court))}
.stream i{width:9px;height:9px;border-radius:50%;background:var(--now);box-shadow:0 0 0 3px color-mix(in srgb,var(--now) 30%,transparent)}
.drawer a.stream{color:var(--bg)}
.credit{text-align:center;padding-block:8px 0}
.credit a{color:var(--court)}

/* Agenda (phone) */
.agenda{display:none;flex-direction:column;gap:18px}
.agenda h3{font:500 1.21rem var(--f-display);margin:0 0 6px;display:flex;gap:8px;align-items:baseline}
.agenda h3 small{font:400 .82rem var(--f-body);color:var(--muted)}
.agenda h3 .freecount{margin-left:auto;align-self:center;font:500 .72rem var(--f-body);color:var(--free);background:var(--free-bg);border:1px solid var(--free-line);border-radius:999px;padding:1px 9px;white-space:nowrap}
.agenda h3 .freecount.none{color:var(--muted);background:transparent;border-color:var(--line)}
.agenda h3.today,.agenda h3.today small{color:var(--court)}
.agenda ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.agenda .slot{position:static;flex-direction:row;align-items:center;gap:10px;padding:9px 12px;font-size:.85rem;width:100%}
.agenda .slot .t{min-width:4.2em}
.agenda .slot .body{min-width:0;flex:1;display:flex;flex-direction:column}
.agenda .slot .court{color:var(--muted);font-size:.75rem}
.agenda .slot.mine .court{color:color-mix(in srgb,#fff 82%,transparent)}
.agenda .slot.league .court{color:var(--c)}
.agenda .slot .sc{margin:0}
.empty{color:var(--muted);font-size:.85rem}
/* Earlier slots bar (phone list, current week) */
.earlier{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;border-radius:var(--r-tile);padding:10px 14px;background:var(--line);color:var(--fg);font:500 .9rem var(--f-body);text-align:left}
.earlier:hover{background:color-mix(in srgb,var(--line) 70%,var(--muted))}
.earlier .chev{display:inline-block;width:1.1em;color:var(--muted)}
.earlier .n{font:500 .8rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.earlierlist{display:flex;flex-direction:column;gap:18px;opacity:.8}
/* Phones: compact stats (one row, number over label) and a single swipeable row of filter chips */
@media (max-width:760px){
  #weekView{gap:8px}
  .summary{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
  .stat{flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
  .stat b{font-size:1.15rem}
  .stat span{font-size:.66rem;line-height:1.15;letter-spacing:0}
  .filters{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding:0 16px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .filters::-webkit-scrollbar{display:none}
  .chip{flex:none;white-space:nowrap;font-size:.74rem;padding:3px 9px 3px 7px}

let lang = (() => { try { const v = JSON.parse(localStorage.getItem('pw.lang')); return v === 'en' ? 'en' : 'hr'; } catch(e) { return 'hr'; } })();
function t(key, vars){
  let s = (I18N[lang] && I18N[lang][key]) ?? I18N.en[key] ?? key;
  if (vars) for (const k in vars) s = s.split('{'+k+'}').join(vars[k]);
  return s;
}
// Croatian plurals: 1, 21, 31 → one; 2-4, 22-24 → few; everything else → many (English: one / many).
function tn(key, count, vars){
  const n10 = count % 10, n100 = count % 100;
  const form = lang === 'hr'
    ? (n10 === 1 && n100 !== 11 ? 'one' : (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) ? 'few' : 'many')
    : (count === 1 ? 'one' : 'many');
  return t(key + '_' + form, { n: count, ...(vars||{}) });
}

/* ---------- helpers ---------- */
function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// Sporty+ encodes times as decimal hours ×100: 850 = 8:30, 1450 = 14:30
function hrs(t){ return t/100; }
function hm(t){ const h = Math.floor(t/100), m = Math.round((t%100)*0.6); return h+':'+String(m).padStart(2,'0'); }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function rangeText(m){ const f = d => d.toLocaleDateString(LOC(),{day:'numeric',month:'short'}); return f(m)+' – '+f(addDays(m,6)); }
function sameDay(a,b){ return ymd(a)===ymd(b); }

async function api(path, body, method){
  const h = { 'Accept':'application/json', 'x-club': String(cfg.club) };
  if (cfg.token) h.Authorization = cfg.token.startsWith('Bearer') ? cfg.token : 'Bearer '+cfg.token;
  const opt = { headers:h };
  if (body !== undefined) { opt.method = method || 'POST'; h['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  else if (method) opt.method = method;
  const r = await fetch(API+path, opt);
  if (!r.ok) {
    let msg = ''; try { const j = await r.json(); msg = j.error || j.message || ''; } catch(_){}
    const e = new Error(msg || (r.status+' '+path)); e.status = r.status; e.apiMessage = msg; throw e;
  }
  const txt = await r.text(); try { return JSON.parse(txt); } catch(_) { return txt; }
}

/* ---------- weather: MET Norway / yr.no locationforecast ----------
   Hourly for ~2.5 days, then every 6 hours up to ~9 days. Cached for 30 minutes per club. */
/* Courts with a Matchi TV camera (Sporty+ court id -> stream link). Only Padel otvoreni for now. */
/* Outdoor courts get the rain plan. Sporty+ has no indoor/outdoor flag (both courts are "open"), so it's set here. */
const COURT_TYPES = { 797: 'indoor', 798: 'outdoor' };   // Padel Dvorana, Padel otvoreni
const OUTDOOR_COURTS = new Set(Object.keys(COURT_TYPES).filter(id => COURT_TYPES[id] === 'outdoor').map(Number));
// Shown name: "Indoor court" / "Vanjski teren" for known courts, the Sporty+ name otherwise.
function courtLabel(c){ const k = COURT_TYPES[c.id]; return k ? t('court_' + k) : c.name; }
// Mid-sentence: English lower-cases it ("The indoor court is free"); Croatian keeps the capital at sentence start.
function courtInSentence(c){ return lang === 'en' && COURT_TYPES[c.id] ? courtLabel(c).toLowerCase() : courtLabel(c); }
function courtShortLabel(c){ const k = COURT_TYPES[c.id]; return k ? t('courtShort_' + k) : c.name.replace(/^padel\s+/i, '').replace(/^./, x => x.toUpperCase()); }
const COURT_CAMERAS = { 798: 'https://www.matchi.tv/create-stream/start?id=9i2bjHsKpf3&v2' };

const WX_ICONS = 'https://cdn.jsdelivr.net/gh/metno/weathericons@89e3173756248b4696b9b10677b66c4ef435db53/weather/svg/';
function wxText(code){ const k = code.replace(/_(day|night|polartwilight)$/,''); const v = t('wx_'+k); return v !== 'wx_'+k ? v : t('wx_other'); }
function setWeather(raw){
  state.wx = (raw||[]).map(x => ({ t:x.t, temp:x.temp, wind:x.wind, sym:x.sym, rain:x.rain, span:x.span }));
}
function loadCachedWeather(){ const c = store.get('wx.'+cfg.club, null); if (c && Array.isArray(c.series)) { setWeather(c.series); return c.at; } return 0; }
async function loadWeather(){
  const lat = parseFloat(state.club?.latitude), lon = parseFloat(state.club?.longitude);
  if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
  const cached = store.get('wx.'+cfg.club, null);
  if (cached && Date.now() - cached.at < 30*60_000 && cached.lat===lat && cached.lon===lon) return;
  try {
    const r = await fetch(`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${lat.toFixed(2)}&lon=${lon.toFixed(2)}`, { headers:{ Accept:'application/json' } });
    if (!r.ok) return;
    const j = await r.json();
    const series = (j.properties?.timeseries || []).map(p => {
      const nx = p.data.next_1_hours ? { d:p.data.next_1_hours, span:1 } : p.data.next_6_hours ? { d:p.data.next_6_hours, span:6 } : null;
      return { t: Date.parse(p.time), temp: p.data.instant.details.air_temperature, wind: p.data.instant.details.wind_speed,
               sym: nx?.d.summary?.symbol_code || null, rain: nx?.d.details?.precipitation_amount ?? null, span: nx?.span || 1 };
    }).filter(x => x.sym);
    setWeather(series);
    store.set('wx.'+cfg.club, { at: Date.now(), lat, lon, series });
    render();
  } catch(e){ /* weather is a nice-to-have; the schedule works without it */ }
}
// The forecast point covering a slot's start time, or null for past slots and beyond the forecast range.
function weatherFor(s){
  const wx = state.wx; if (!wx || !wx.length) return null;
  const start = slotDate(s).getTime();
  if (slotEnd(s).getTime() < Date.now()) return null;
  let best = null;
  for (const x of wx) { if (x.t <= start) best = x; else break; }
  if (!best) best = wx[0].t - start <= 3600_000 ? wx[0] : null;
  if (!best || start - best.t >= best.span*3600_000) return null;
  return best;
}
// Rain over the whole slot (it can span two hourly points), for outdoor courts only.
function rainFor(s){
  if (!OUTDOOR_COURTS.has(s.court.id) || !state.wx || !state.wx.length) return null;
  const a = slotDate(s).getTime(), b = slotEnd(s).getTime();
  if (b < Date.now()) return null;
  const pts = state.wx.filter(x => x.t < b && x.t + x.span*3600_000 > a);
  if (!pts.length) return null;
  let mm = 0;
  for (const x of pts) { const lo = Math.max(a, x.t), hi = Math.min(b, x.t + x.span*3600_000); mm += (x.rain || 0) * (hi - lo) / (x.span*3600_000); }
  mm = Math.round(mm * 10) / 10;
  const wetSym = pts.find(x => /rain|sleet|snow|thunder/.test(x.sym));
  return { mm, wet: mm >= 0.5 || !!wetSym, sym: (wetSym || pts[0]).sym, six: pts.some(x => x.span > 1) };
}
// Indoor alternative at the same start time, or the nearest free indoor slot that day.
function indoorAlternative(s){
  const day = state.days.find(d => sameDay(d.date, s.date)); if (!day) return null;
  const now = Date.now();
  const free = day.slots.filter(x => x.kind==='free' && !OUTDOOR_COURTS.has(x.court.id) && slotDate(x).getTime() > now);
  const same = free.find(x => x.start === s.start);
  if (same) return { slot: same, same: true };
  const near = free.sort((x,y) => Math.abs(x.start - s.start) - Math.abs(y.start - s.start))[0];
  return near ? { slot: near, same: false } : null;
}
function rainPlan(s){
  const r = rainFor(s); if (!r || !r.wet) return '';
  const alt = indoorAlternative(s);
  const what = r.mm ? t('rainAmount', { mm: r.mm.toLocaleString(LOC()), min: Math.round((slotEnd(s)-slotDate(s))/60000) }) : t('rainSym', { desc: esc(wxText(r.sym)).toLowerCase() });
  let body = `<div>${t('rainDuring', { what, six: r.six ? t('rainSix') : '' })}</div>`;
  if (alt) body += `<div>${alt.same ? t('altSame', { court: esc(courtInSentence(alt.slot.court)) }) : t('altNear', { court: esc(courtInSentence(alt.slot.court)), t: hm(s.start), t2: hm(alt.slot.start) })}</div>

  else body += `<div>${t('noIndoor')}</div>`;
  if (isMine(s) && s.booked) body += `<p class="hint">${t('cancelOutdoor')}</p>`;

}

const LG_ICONS = {
  grid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="6" height="16" rx="1"/><path d="M13 6h8M13 10h8M13 14h8M13 18h8"/></svg>'
};
/* ---------- "Tvoj put": what your pair needs in its league group ----------
   The group (public /v2/league_group/{id}) gives the pairs, their points, sets and games, and how many move up/down.
   Points follow Modesto's rule, checked on every pair of a whole round: 1 per match played + 1 per win + 1 per set
   won. Ties: set difference, then game difference (our assumption; Sporty+ doesn't say). Remaining matches = every
   pairing the group still owes (round robin × rounds) minus the results we have. Each remaining match can end 2-0 or
   2-1 either way (30% of league matches go to a third set), weighted by the Padel Radar win chance; up to 8 matches
   are enumerated exactly, more are sampled. */
const MP_THREE = 0.3, MP_EXACT = 8, MP_SAMPLES = 20000;
const groupCache = new Map();   // id -> { at, g }
async function loadGroup(id){
  const c = groupCache.get(id); if (c && Date.now() - c.at < FRESH_PROFILE) return c.g;
  const r = await api(`/v2/league_group/${id}`), g = r.data || r; groupCache.set(id, { at: Date.now(), g }); return g;
}
// Your pair's group: the current Ploča round, else (another league) the group of its latest league match.
function myGroupId(){
  const pair = state.me && state.rating?.pairOf.get(state.me.id);
  return pair ? (pair.groupId || (pair.last >= Date.now() - RT_ACTIVE_DAYS*864e5 ? pair.lastLg : null)) : null;
}
function pathScenarios(g, history, myTeam){
  const teams = (g.players || []).map(p => { const s = g.stats?.[p.id] || {};
    return { id: p.id, name: p.display_name, pts: s.score ?? 0, sd: (s.sets?.wins||0) - (s.sets?.losses||0), gd: (s.points?.wins||0) - (s.points?.losses||0) }; });
  const n = teams.length, pairsN = n * (n - 1) / 2, rounds = Math.max(1, Math.round(Number(g.total_number_of_games || pairsN) / (pairsN || 1)));
  const key = (a, b) => [a, b].sort((x, y) => x - y).join('-'), done = new Map();
  for (const r of history) if (r.lg === g.id && r.a && r.b) done.set(key(r.a.t, r.b.t), (done.get(key(r.a.t, r.b.t)) || 0) + 1);
  const rem = [];
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
    const a = teams[i], b = teams[j], left = rounds - (done.get(key(a.id, b.id)) || 0);
    const ra = sideStrength(a.id) ?? RT_START, rb = sideStrength(b.id) ?? RT_START;
    for (let k = 0; k < left; k++) rem.push({ a, b, p: 1 / (1 + Math.pow(10, (rb - ra) / 400)) });
  }
  const up = Math.max(0, Number(g.move_up) || 0), down = Math.max(0, Number(g.move_down) || 0);
  const mine = rem.filter(m => m.a.id === myTeam || m.b.id === myTeam);
  const outs = [[2, 0, 1 - MP_THREE], [2, 1, MP_THREE], [1, 2, MP_THREE], [0, 2, 1 - MP_THREE]];
  const tally = { up: 0, down: 0, total: 0 }, byWins = mine.map(() => null).concat(null).map(() => ({ p: 0, up: 0, down: 0 }));
  const play = (pick, weight) => {
    const st = new Map(teams.map(x => [x.id, { ...x }])); let wins = 0;
    rem.forEach((m, i) => { const [sa, sb] = outs[pick(i, m)], aw = sa > sb, A = st.get(m.a.id), B = st.get(m.b.id);
      A.pts += 1 + (aw ? 1 : 0) + sa; B.pts += 1 + (aw ? 0 : 1) + sb; A.sd += sa - sb; B.sd += sb - sa;
      if ((m.a.id === myTeam && aw) || (m.b.id === myTeam && !aw)) wins++; });
    const order = [...st.values()].sort((x, y) => y.pts - x.pts || y.sd - x.sd || y.gd - x.gd), pos = order.findIndex(x => x.id === myTeam);
    const isUp = pos < up, isDown = pos >= n - down;
    tally.total += weight; if (isUp) tally.up += weight; if (isDown) tally.down += weight;
    const b = byWins[wins]; b.p += weight; if (isUp) b.up += weight; if (isDown) b.down += weight;
  };
  const exact = rem.length <= MP_EXACT;
  if (exact) for (let c = 0; c < 4 ** rem.length; c++) {
    let w = 1, x = c; const picks = rem.map(m => { const o = x % 4; x = Math.floor(x / 4); w *= (o < 2 ? m.p : 1 - m.p) * outs[o][2]; return o; });
    play(i => picks[i], w);
  } else for (let s = 0; s < MP_SAMPLES; s++) play((i, m) => { const aw = Math.random() < m.p, three = Math.random() < MP_THREE; return aw ? (three ? 1 : 0) : (three ? 2 : 3); }, 1);
  const me = teams.find(x => x.id === myTeam), pos = [...teams].sort((x, y) => y.pts - x.pts || y.sd - x.sd || y.gd - x.gd).findIndex(x => x.id === myTeam) + 1;
  return { g, me, pos, n, up, down, exact, rem, mine, pUp: tally.up / tally.total, pDown: tally.down / tally.total,
    byWins: byWins.map((b, w) => ({ w, ...b })).filter(b => b.p > 0).reverse() };
}
async function renderMyPath(){

  if (!cfg.token || !state.me) { el.innerHTML = ''; return; }
  try { await loadRatings(); } catch(e) { el.innerHTML = ''; return; }
  const gid = myGroupId(), pair = state.rating.pairOf.get(state.me.id);
  if (!gid || !pair) { el.innerHTML = ''; return; }
  let s;
  try { s = pathScenarios(await loadGroup(gid), store.get(HISTORY_KEY(), {}).list || [], pair.id); } catch(e) { el.innerHTML = ''; return; }
  if (!document.getElementById('lgMine') || !s.me) return;
  const top = Number(s.g.order) <= 1 || ladderLevel(s.g.name) === 0, pct = p => Math.round(p * 100) + '%';
  const sure = p => s.exact && (p === 0 || p >= 0.9995);
  const stayP = top ? 1 - s.pDown : 1 - s.pUp - s.pDown;   // in the top group, finishing first is also staying
  const trio = `<div class="mptrio">${s.up ? `<div><b class="${s.pUp >= .5 ? 'g' : 'n'}">${pct(s.pUp)}</b><span>${top ? t('mp_first') : t('mp_up')}</span></div>` : ''}
    <div><b class="g">${pct(stayP)}</b><span>${t('mp_stay')}</span></div>${s.down ? `<div><b class="${s.pDown >= .5 ? 'r' : 'n'}">${pct(s.pDown)}</b><span>${t('mp_down')}</span></div>` : ''}</div>`;
  const line = b => {
    const pd = b.down / b.p, pu = b.up / b.p, safe = 1 - pd;
    const pill = sure(pu) && pu >= .9995 ? `<span class="mppill pg">${top ? t('mp_sureFirst') : t('mp_sureUp')}</span>`
      : sure(pd) && pd === 0 ? `<span class="mppill pg">${t('mp_sureStay')}${s.up && pu > .005 ? ' · ' + pct(pu) + ' ' + (top ? t('mp_first') : t('mp_up')) : ''}</span>`
      : sure(pd) && pd >= .9995 ? `<span class="mppill pr">${t('mp_sureDown')}</span>`
      : pd >= .5 ? `<span class="mppill pr">${pct(pd)} ${t('mp_down')}</span>` : `<span class="mppill pg">${pct(safe)} ${t('mp_stay')}</span>`;
    return `<span>${t('mp_winsOf', { w: b.w, n: s.mine.length })}</span><span class="mpbar"><i class="g" style="width:${safe*100}%"></i><i class="r" style="width:${pd*100}%"></i></span>${pill}`;
  };
  const opp = m => m.a.id === pair.id ? m.b : m.a, myP = m => m.a.id === pair.id ? m.p : 1 - m.p;
  const when = m => { const sl = allSlots().find(x => x.kind === 'league' && x.teamIds?.includes(m.a.id) && x.teamIds?.includes(m.b.id) && slotEnd(x) >= new Date()); return sl ? ` · ${dayShort(sl.date)} ${hm(sl.start)}` : ''; };
  el.innerHTML = `<section class="mypath"><div class="mphead"><h3>${t('mp_title')} · ${esc(String(s.g.name).trim())}</h3><span class="hint">${t('mp_now', { pos: s.pos, pts: s.me.pts })}</span></div>
    ${s.mine.length ? trio + `<span class="lbl">${t('mp_need')}</span><div class="mpneed">${s.byWins.map(line).join('')}</div>
      <span class="lbl">${t('mp_left')}</span>${s.mine.map(m => `<div class="mpm"><span>${t('mp_vs')} ${esc(opp(m).name || '—')}<small>${when(m)}</small></span><span>${t('mp_winChance', { p: Math.round(myP(m) * 100) })}</span></div>`).join('')}`
      : (s.rem.length ? trio + `<p class="hint">${t('mp_doneMine', { n: s.rem.length })}</p>` : `<p class="hint">${t('mp_doneAll')}</p>`)}
    <p class="hint">${t('mp_note')}</p></section>`;
}

let leaguesSeq = 0;
async function renderLeagues(){
  const el = document.getElementById('leaguesView'), ids = knownLeagues(), seq = ++leaguesSeq;

  el.innerHTML = `<div id="lgMine"></div>` + chips + `<div id="lgBody">${c ? '' : `<p class="empty">${t('lg_loading')}</p>`}</div>`;
  renderMyPath();
  el.querySelectorAll('[data-league]').forEach(b => b.onclick = () => { store.set('league', Number(b.dataset.league)); renderLeagues(); });
  const draw = res => {
    const body = document.getElementById('lgBody'); if (!body || seq !== leaguesSeq) return;
    if (res.error) {
      body.innerHTML = !cfg.token && (res.error.status === 404 || res.error.status === 401 || res.error.status === 403)
        ? `<p class="empty">${t('lg_login')}</p><button class="btn primary" id="lgLogin" type="button">${t('login')}</button>`
        : `<p class="empty">${t('lg_fail')}</p>`;
      document.getElementById('lgLogin')?.addEventListener('click', openLogin);
      return;
    }
    const groups = [...(res.league.groups || [])].sort((a,b) => (a.order ?? 0) - (b.order ?? 0));
    const view = store.get('leagueView', 'grid') === 'list' ? 'list' : 'grid';
    const sw = `<div class="seg vsw" role="group" aria-label="${t('lg_view')}">${['grid','list'].map(v => `<button type="button" data-lview="${v}" aria-pressed="${v===view}" aria-label="${t('lg_view_'+v)}" title="${t('lg_view_'+v)}">${LG_ICONS[v]}</button>`).join('')}</div>`;
    let inner = `<p class="empty">${t('lg_noGroups')}</p>`;
    if (groups.length && view === 'grid') {
      const height = Math.max(...groups.map(g => (g.players||[]).length), 1);
      inner = `<div class="lgrid">${groups.map((g,i) => groupCard(g, i === 0, i === groups.length-1, height)).join('')}</div><p class="hint">${t('lg_legend')}</p>`;
    } else if (groups.length) {
      // Open the group you play in, else the last one picked, else the first.
      const picked = store.get('leagueGroup.'+sel, 0), mine = groups.find(g => (g.players||[]).some(isMeRow));
      const gid = groups.some(g => g.id === picked) ? picked : (mine || groups[0]).id;
      inner = groupDetail(groups, gid) + `<p class="hint">${t('lg_legend')}</p>`;
    }
    body.innerHTML = `<div class="lghero"><h2>${esc(leagueName(sel))}</h2>${groups.length ? sw : ''}</div>` + inner;
    body.querySelectorAll('[data-lview]').forEach(b => b.onclick = () => { store.set('leagueView', b.dataset.lview); draw(res); });
    body.querySelectorAll('[data-group]').forEach(b => b.onclick = () => { store.set('leagueGroup.'+sel, Number(b.dataset.group)); draw(res); body.querySelector(`[data-group="${b.dataset.group}"]`)?.focus(); });
  };
  if (c) draw(c);
  if (!c || Date.now() - c.at >= FRESH_PROFILE) draw(await loadStandings(sel, true));
}

/* ---------- weeks: cached in memory, prefetched, and the current one kept in localStorage ---------- */
const weekCache = new Map();      // monday ymd -> { at, days:[courts[] per day] }
const inflight = new Map();       // monday ymd -> Promise
const FRESH_MS = 60_000;
let showSeq = 0;

function fetchWeek(monday){
  const key = ymd(monday);
  if (inflight.has(key)) return inflight.get(key);
  const q = d => `/v2/court?filter[is_active]=1&filter[club_id]=${cfg.club}&page=1&limit=50&date=${ymd(d)}&parsed2=true` + (cfg.token?'':'&unauth=true');
  const p = Promise.all([...Array(7)].map((_,i) => api(q(addDays(monday,i)))))
    .then(res => {
      // keep only what the page uses, so the cache stays small
      const days = res.map(r => r.data.map(c => ({ id:c.id, name:c.name, reservation_duration:c.reservation_duration, parsed_reservations:c.parsed_reservations })));
      const entry = { at: Date.now(), days };
      weekCache.set(key, entry);
      if (key === ymd(mondayOf(new Date()))) store.set('week.'+cfg.club+'.'+(cfg.token?'auth':'anon'), { key, ...entry });
      return entry;
    })
    .finally(() => inflight.delete(key));
  inflight.set(key, p);
  return p;
}

function applyWeek(monday, entry){
  const dates = [...Array(7)].map((_,i)=>addDays(monday,i));
  const courts = new Map();
  state.days = entry.days.map((list,i) => {
    const slots = [];
    for (const c of list) {
      courts.set(c.id, { id:c.id, name:c.name, dur:c.reservation_duration });
      for (const s of Object.values(c.parsed_reservations||{})) if (!s.hidden) slots.push(normalize(s, c, dates[i]));
    }
    return { date: dates[i], slots };
  });
  state.courts = [...courts.values()];
  const ids = new Set(); state.days.forEach(d=>d.slots.forEach(s=>s.leagueId && ids.add(s.leagueId)));
  rememberLeagues([...ids]);
  const missing = [...ids].filter(id => !state.leagues.has(id));
  if (missing.length) Promise.all(missing.map(loadLeague)).then(() => { if (ymd(state.monday)===ymd(monday)) render(); });
}

function setLoading(on){
  document.getElementById('status').className = 'status';
  document.getElementById('status').textContent = on ? t('loadingWeek') : '';
  document.querySelector('.board-scroll').classList.toggle('loading', on);
  document.getElementById('agenda').classList.toggle('loading', on);
}

// Show a week: instantly from cache when we have it, refreshing in the background if it's stale.
async function showWeek(monday, {force=false}={}){
  state.monday = monday;
  const seq = ++showSeq, key = ymd(monday), cached = weekCache.get(key);
  if (cached) { applyWeek(monday, cached); render(); }
  else { const r = document.getElementById('range'); if (r) r.textContent = rangeText(monday); }
  if (cached && !force && Date.now()-cached.at < FRESH_MS) { setLoading(false); prefetchAround(monday); return; }
  setLoading(!cached);
  try {
    const entry = await fetchWeek(monday);
    if (seq !== showSeq) return;           // user already moved to another week
    applyWeek(monday, entry); render();
    setLoading(false);
    prefetchAround(monday);
  } catch(e) {
    if (seq !== showSeq) return;
    setLoading(false);
    if (!cached){ state.days = []; state.courts = []; render(); }
    const status = document.getElementById('status');
    status.className='status err';
    status.textContent = e.status===401 ? t('tokenRefused') : t('loadFail', { msg: e.message });
  }
}
function prefetchAround(monday){
  for (const d of [7,-7,14]) { const m = addDays(monday,d), c = weekCache.get(ymd(m)); if (!c || Date.now()-c.at > FRESH_MS) fetchWeek(m).catch(()=>{}); }
}
// Used after a booking: refetch the visible week.
async function loadWeek(){ weekCache.delete(ymd(state.monday)); await showWeek(state.monday, {force:true}); }

function normalize(s, court, date){
  const booked = !!s.id;
  const start = booked ? s.start_time : s.time;
  const end = booked ? s.end_time : s.time + (court.reservation_duration/60)*100;
  const comp = s.competition?.object || {};
  const teamIds = [...new Set((s.players||[]).map(p=>p.team_id).filter(Boolean))];
  return {
    raw:s, court, date, booked, start, end,
    price: s.price, leagueId: comp.league_id || null, tournamentId: comp.tournament_id || null,
    kind: !booked ? 'free' : (comp.league_id || comp.tournament_id) ? 'league' : 'booking',
    teamIds, players: s.players||[], recurring: !!s.recurring, openSeats: s.open_seats||0,
    waiting: (s.waiting_list||[]).length, byClub: s.type==='in_behalf', gameId: s.game_id, id: s.id
  };
}

function teamPlayers(id){ return (state.teams.get(id)?.players||[]).map(p=>p.display_name).join(', '); }

function playersHtml(list){ return (list||[]).map(playerLink).join(', '); }
function namedPlayers(s){ return s.players.map(p=>p.display_name).filter(Boolean); }

function isMine(s){
  const m = state.me; if (!m || !s.booked) return false;
  const teamId = m.team?.id;
  return s.players.some(p => (p.id && p.id===m.id) || (teamId && p.team_id===teamId));

function freePrices(){ return allSlots().filter(x=>x.kind==='free' && x.price!=null).map(x=>x.price); }
// Show the 'zauzeto' tag only when the tile's title doesn't already say so.

function slotClass(s){ return s.kind + (isMine(s)?' mine':'') + (s.booked && !isMine(s) ? ' taken' : '') + (rainFor(s)?.wet ? ' wet' : '') + (s.kind==='free' && s.price!=null && s.price === state.peak && state.low < state.peak ? ' peak' : ''); }

// Free slots still bookable that day, on the courts being shown.
function freeLeft(d, now = new Date()){ return d.slots.filter(s => s.kind === 'free' && inCourt(s) && slotEnd(s) >= now).length; }
function dayEnded(d, now = new Date()){ return new Date(d.date.getFullYear(), d.date.getMonth(), d.date.getDate() + 1) <= now; }

/* ---------- calendar: a month popup; pick a day to jump to it ----------
   Days in weeks we already have (shown, cached or prefetched) also show how many slots are still free. */
const calModal = document.getElementById('calModal'), calBox = document.getElementById('calBox');
let calMonth = null, calReturn = null;
function freeByDay(){
  const m = new Map(), now = new Date();
  for (const [key, entry] of weekCache) {
    const monday = new Date(key + 'T00:00');
    entry.days.forEach((list, i) => { const date = addDays(monday, i), slots = [];
      for (const c of list) for (const s of Object.values(c.parsed_reservations || {})) if (!s.hidden && !s.id) slots.push(normalize(s, c, date));
      const d = { date, slots }; if (!dayEnded(d, now)) m.set(ymd(date), freeLeft(d, now)); });
  }
  return m;
}
function openCalendar(){
  calReturn = document.activeElement;
  calMonth = new Date(state.monday.getFullYear(), state.monday.getMonth(), 1);
  const last = addDays(state.monday, 6);
  if (state.monday.getMonth() !== last.getMonth() && sameDay(mondayOf(new Date()), state.monday) && new Date().getMonth() === last.getMonth()) calMonth = new Date(last.getFullYear(), last.getMonth(), 1);
  calModal.hidden = false; renderCalendar();
  (calBox.querySelector('.cday.today') || calBox.querySelector('.cday.wk') || calBox.querySelector('.cday'))?.focus();
}
function closeCalendar(){ calModal.hidden = true; calReturn?.focus?.(); }
function renderCalendar(){
  const now = new Date(), free = freeByDay(), shown = ymd(state.monday);
  const first = mondayOf(calMonth), title = cap(calMonth.toLocaleDateString(LOC(), { month:'long', year:'numeric' })).replace(/\.$/, '');
  const heads = [...Array(7)].map((_, i) => `<span class="ch">${dayShort(addDays(first, i))}</span>`).join('');
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = addDays(first, i), key = ymd(d), n = free.get(key), out = d.getMonth() !== calMonth.getMonth();
    if (i % 7 === 0 && i >= 35 && out) break;   // no empty last row
    const cls = ['cday', out ? 'out' : '', sameDay(d, now) ? 'today' : '', ymd(mondayOf(d)) === shown ? 'wk' : '', d < new Date(now.getFullYear(), now.getMonth(), now.getDate()) ? 'past' : ''].filter(Boolean).join(' ');
    const label = d.toLocaleDateString(LOC(), { weekday:'long', day:'numeric', month:'long' }) + (n == null ? '' : ', ' + (n ? tn('ag_free', n) : t('ag_full')));
    cells += `<button type="button" class="${cls}" data-day="${key}" aria-label="${esc(label)}"${sameDay(d, now) ? ' aria-current="date"' : ''}><b>${d.getDate()}</b><small class="${n === 0 ? 'none' : ''}">${n == null ? '' : n}</small></button>`;
  }
  calBox.innerHTML = `<div class="chead"><button type="button" class="btn icon" id="calPrev" aria-label="${t('prevMonth')}">‹</button><h2 id="calTitle">${esc(title)}</h2><button type="button" class="btn icon" id="calNext" aria-label="${t('nextMonth')}">›</button></div>
    <div class="cgrid">${heads}${cells}</div>
    <div class="cfoot"><span class="hint">${t('calHint')}</span><button type="button" class="btn" id="calClose">${t('close')}</button></div>`;
  document.getElementById('calPrev').onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); renderCalendar(); document.getElementById('calPrev').focus(); };
  document.getElementById('calNext').onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); renderCalendar(); document.getElementById('calNext').focus(); };
  document.getElementById('calClose').onclick = closeCalendar;
  calBox.querySelectorAll('.cday').forEach(b => b.onclick = () => pickDay(b.dataset.day));
}

calModal.addEventListener('keydown', e => {

/* ---------- Enter a result for your own past match ----------
   Same request the official app sends from a booking: POST /v2/result with the booking's game id,
   both teams, and five [a,b] sets (unplayed sets stay 0-0). Scores follow the order of the players array. */
function canEnterResult(s){
  return !!(cfg.token && state.me && s.kind === 'league' && s.booked && s.gameId && isMine(s) && slotEnd(s) < new Date()
    && !state.resultsByGame.has(s.gameId) && s.teamIds.length === 2);

  if (!cfg.token || !state.me || s.kind !== 'league' || !s.booked || !isMine(s) || slotEnd(s) >= new Date() || state.resultsByGame.has(s.gameId)) return '';
  if (!canEnterResult(s)) return `<p class="hint">${t('resultNeedTeams')}</p>`;
  const row = (id, i) => `<span class="tm">${esc(teamLabel(id))}${teamPlayers(id)?`<small>${esc(teamPlayers(id))}</small>`:''}</span>` +
    [0,1,2].map(k => `<input id="sc${i}${k}" inputmode="numeric" maxlength="1" aria-label="${esc(t('setAria', { team: teamLabel(id), n: k+1 }))}" autocomplete="off">`).join('');
  return `<div class="confirm" id="resBox">

      ${row(s.teamIds[0],0)}${row(s.teamIds[1],1)}</div>
    <p class="hint">${t('leaveSet3')}</p>

    <p class="msg" id="resMsg" aria-live="polite"></p></div>`;
}
// Returns { sets:[[a,b]x5], error } after checking it looks like a real padel score.
function readScore(){
  const v = (i,k) => document.getElementById('sc'+i+k).value.trim();
  const sets = [], won = [0,0];
  for (let k = 0; k < 3; k++) {
    const a = v(0,k), b = v(1,k);
    if (a === '' && b === '') { if (k < 2) return { error: t('errTwoSets') }; continue; }
    if (a === '' || b === '') return { error: t('errBoth', { n: k+1 }) };
    const x = +a, y = +b;
    if (!Number.isInteger(x) || !Number.isInteger(y) || x > 7 || y > 7) return { error: t('errRange', { n: k+1 }) };
    const hi = Math.max(x,y), lo = Math.min(x,y);
    if (!((hi === 6 && lo <= 4) || (hi === 7 && (lo === 5 || lo === 6)))) return { error: t('errUnfinished', { n: k+1, x, y }) };
    if (k === 2 && won[0] !== won[1]) return { error: t('errDecided') };
    won[x > y ? 0 : 1]++; sets.push([x,y]);
  }
  if (won[0] === won[1]) return { error: t('errWinner') };
  while (sets.length < 5) sets.push([0,0]);
  return { sets, winner: won[0] > won[1] ? 0 : 1 };
}
function wireResult(s){
  const go = document.getElementById('resGo'); if (!go) return;
  const msg = document.getElementById('resMsg');
  const inputs = [...document.querySelectorAll('#resBox input')];
  let armed = null;
  const disarm = () => { if (armed) { armed = null; go.textContent = t('reviewResult'); msg.className = 'msg'; msg.textContent = ''; } };
  inputs.forEach((el, n) => {
    el.addEventListener('input', () => { el.value = el.value.replace(/[^0-9]/g,''); disarm(); if (el.value && inputs[n+1]) inputs[n+1].focus(); });
  });
  inputs[0].focus();
  go.onclick = async () => {
    if (!armed) {
      const r = readScore();
      if (r.error) { msg.className = 'msg err'; msg.textContent = r.error; return; }
      armed = r;
      const line = r.sets.filter(x => x[0]||x[1]).map(x => x[0]+'-'+x[1]).join(' ');
      msg.className = 'msg';
      msg.innerHTML = `<span class="recap">${t('wonLine', { team: esc(teamLabel(s.teamIds[r.winner])), sets: `<span class="sets">${line}</span>` })}</span><br>${t('officialNote')}`;
      go.textContent = t('submitResult');
      return;
    }
    go.disabled = true; go.textContent = t('submitting');
    const payload = {
      created_at: new Date().toISOString(), verified: null, points: 0, surface: {},
      game_id: s.gameId,
      players: s.teamIds.map(id => ({ id, type: 'team' })),
      sets: armed.sets, tie_break: armed.sets.map(() => [0,0])
    };
    try {
      const res = await api('/v2/result', payload);
      const saved = res && (res.data || res);
      if (saved && saved.id) {
        const t = trimResult({ ...saved,
          game_id: saved.game_id || s.gameId,
          date: saved.date || ymd(new Date()) + ' ' + new Date().toTimeString().slice(0,8),
          sets: saved.sets || payload.sets,
          winner_side: saved.winner_side ?? armed.winner,
          players: saved.players || s.teamIds.map(id => state.teams.get(id) || { id, display_name: teamLabel(id) }) });
        setResults([t, ...state.results]); store.set('results.'+cfg.club, state.results);
      }
      msg.className = 'msg ok'; msg.textContent = t('resultSaved');
      go.hidden = true; inputs.forEach(el => el.disabled = true);
      render();
      loadResults().then(() => { render(); if (!document.getElementById('resultsView').hidden) renderResults(); });
    } catch(e) {
      msg.className = 'msg err';
      msg.textContent = e.status===401 ? t('loginExpired') : t('resultRefused', { msg: e.apiMessage || e.message });
      go.disabled = false; go.textContent = t('submitResult');
    }
  };
}

/* ---------- Add / remove players on your own (friendly) booking ----------
   Sporty+ saves a booking's whole player list at once (PUT /v2/reservation/{id}), the way the official app does when
   you invite or remove someone. We collect every change first and send them in a single save. */
const MAX_PLAYERS = 4;
function canEditPlayers(s){ return !!(cfg.token && state.me && s.booked && s.kind === 'booking' && s.id && isMine(s) && slotEnd(s) >= new Date()); }
function isMePlayer(p){ const m = state.me; return !!m && ((p.id && p.id === m.id) || (m.team?.id && p.team_id === m.team.id)); }
function playersEditor(s){
  if (!canEditPlayers(s)) return '';
  return `<div class="confirm ed" id="edBox">
    <div><b>${t('ed_title')}</b><p class="hint">${t('ed_hint')}</p></div>
    <ul id="edList"></ul>
    <div class="count" id="edCount"></div>
    <div class="field"><label for="edQ">${t('ed_search')}</label><input id="edQ" autocomplete="off" placeholder="${esc(t('ed_searchPh'))}"></div>
    <ul class="hits" id="edHits" aria-live="polite"></ul>
    <button class="btn primary" id="edGo" type="button" style="align-self:flex-start">${t('ed_save')}</button>
    <p class="msg" id="edMsg" aria-live="polite"></p></div>`;
}
function wirePlayersEditor(s){
  const box = document.getElementById('edBox'); if (!box) return;
  const list = document.getElementById('edList'), hits = document.getElementById('edHits'), q = document.getElementById('edQ');
  const go = document.getElementById('edGo'), msg = document.getElementById('edMsg'), count = document.getElementById('edCount');
  const removing = new Set();           // index into s.players
  const adding = [];                    // team objects from the member search
  let armed = false, timer = null, seq = 0;
  const current = () => s.players.length - removing.size + adding.length;
  const name = p => p.display_name || t('ed_pending');
  const disarm = () => { armed = false; go.textContent = t('ed_save'); if (!msg.classList.contains('err')) msg.textContent = ''; };
  function draw(){
    list.innerHTML = s.players.map((p, i) => {
      const me = isMePlayer(p), out = removing.has(i);
      return `<li class="${out ? 'out' : ''}"><span class="nm">${esc(name(p))}${me ? ` <small>(${t('ed_you')})</small>` : ''}${out ? ` <small>${t('ed_willRemove')}</small>` : ''}</span>
        ${me ? '' : `<button class="btn" type="button" data-rm="${i}">${out ? t('ed_undo') : t('ed_remove')}</button>`}</li>`;
    }).join('') + adding.map((p, i) => `<li class="new"><span class="nm">${esc(p.display_name)} <small>+</small></span><button class="btn" type="button" data-un="${i}">${t('ed_undo')}</button></li>`).join('');
    count.textContent = t('ed_count', { n: current(), max: MAX_PLAYERS });
    list.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { const i = +b.dataset.rm; removing.has(i) ? removing.delete(i) : removing.add(i); disarm(); draw(); });
    list.querySelectorAll('[data-un]').forEach(b => b.onclick = () => { adding.splice(+b.dataset.un, 1); disarm(); draw(); search(); });
  }
  const onBooking = id => s.players.some(p => p.team_id === id) || adding.some(a => a.id === id);
  async function search(){
    const term = q.value.trim(), my = ++seq;
    if (term.length < 2) { hits.innerHTML = ''; return; }
    hits.innerHTML = `<li><span class="nm hint">${t('ed_searching')}</span></li>`;
    try {
      const r = await api(`/v2/team?filter[display_name]=${encodeURIComponent(term)}&filter[club]=${cfg.club}&filter[number_of_players]=1&page=1`);
      if (my !== seq) return;
      const found = (r.data || []).slice(0, 12);
      if (!found.length) { hits.innerHTML = `<li><span class="nm hint">${t('ed_noHits')}</span></li>`; return; }
      // Only the name is shown: the search also returns emails and ratings, which we never display.
      hits.innerHTML = found.map((m, i) => `<li><span class="nm">${esc(m.display_name)}</span>${onBooking(m.id)
        ? `<span class="hint">${t('ed_added')}</span>` : `<button class="btn" type="button" data-add="${i}">${t('ed_add')}</button>`}</li>`).join('');
      hits.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
        if (current() >= MAX_PLAYERS) { msg.className = 'msg err'; msg.textContent = t('ed_full', { max: MAX_PLAYERS }); return; }
        msg.className = 'msg'; msg.textContent = '';
        adding.push(found[+b.dataset.add]); disarm(); draw(); search();
      });
    } catch(e) { if (my === seq) hits.innerHTML = `<li><span class="nm msg err">${esc(e.apiMessage || e.message)}</span></li>`; }
  }
  q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 300); });
  draw();
  go.onclick = async () => {
    if (!removing.size && !adding.length) { msg.className = 'msg'; msg.textContent = t('ed_nothing'); return; }
    if (!armed) {
      armed = true; go.textContent = t('ed_confirm'); msg.className = 'msg';
      const out = [...removing].map(i => name(s.players[i])).join(', ') || t('ed_none');
      msg.textContent = t('ed_summary', { add: adding.map(a => a.display_name).join(', ') || t('ed_none'), remove: out });
      return;
    }
    go.disabled = true; go.textContent = t('ed_saving');
    try {
      // Fresh copy of the booking, so we never overwrite a change made elsewhere in the meantime.
      const fresh = await api(`/v2/reservation/${s.id}`);
      const res = fresh && fresh.data && fresh.data.id ? fresh.data : fresh;
      const drop = new Set([...removing].flatMap(i => [s.players[i].team_id, s.players[i].id]).filter(Boolean));
      res.players = (res.players || []).filter(rp => !drop.has(rp.id) && !drop.has(rp.team_id)).concat(adding);
      if (res.players.length > MAX_PLAYERS) throw new Error(t('ed_full', { max: MAX_PLAYERS }));
      await api(`/v2/reservation/${s.id}`, res, 'PUT');
      msg.className = 'msg ok'; msg.textContent = t('ed_saved'); go.hidden = true;
      const key = slotKey(s);
      await loadWeek(); render();
      if (!drawer.hidden && allSlots().some(x => slotKey(x) === key)) openSlot(key);
    } catch(e) {
      msg.className = 'msg err';
      msg.textContent = e.status === 401 ? t('tokenRefusedShort') : t('ed_refused', { msg: e.apiMessage || e.message });
      go.disabled = false; go.textContent = t('ed_save'); armed = false;
    }
  };
}

function wireBooking(s){
  const go = document.getElementById('bookGo'); if (!go) return;
  const msg = document.getElementById('bookMsg');
  api('/v2/reservation/price', bookingPayload(s)).then(p => {
    const n = typeof p==='number' ? p : Object.values(p||{}).filter(v=>typeof v==='number').reduce((a,b)=>a+b, NaN);
    if (Number.isFinite(n)) document.getElementById('bookPrice').textContent = '€'+n;
  }).catch(()=>{});
  let armed = false;
  go.onclick = async () => {
    if (!armed){ armed = true; go.textContent = t('tapConfirm'); msg.className='msg'; msg.textContent = t('bookLine', { court: courtLabel(s.court), date: dateLong(s.date), t: hm(s.start) }); return; }
    go.disabled = true; go.textContent = t('booking');
    try {
      await api('/v2/reservation', bookingPayload(s));
      msg.className = 'msg ok'; msg.textContent = t('bookedOk'); go.hidden = true;
      await loadWeek(); render();
      setTimeout(closeDrawer, 1200);
    } catch(e) {
      msg.className = 'msg err';
      msg.textContent = e.status===401 ? t('tokenRefusedShort') : t('bookRefused', { msg: e.apiMessage || e.message });
      go.disabled = false; go.textContent = t('tryAgain'); armed = true;
    }
  };
}
function allSlots(){ return state.days.flatMap(d=>d.slots); }

function renderSummary(){
  const all = allSlots().filter(inCourt); const league = all.filter(s=>s.kind==='league');
  const played = league.filter(s=>state.resultsByGame.has(s.gameId)).length;

    ...(state.me ? [[mine,t('st_yourBookings'),'hi']] : []),
    [booked,t('st_courtsBooked')],[league.length,t('st_leagueMatches')],[played,t('st_resultsIn')],[freeLeft,t('st_freeLeft')]
  ].map(([n,l,c])=>`<div class="stat ${c||''}"><b>${n}</b><span>${l}</span></div>`).join('') : '';
}

function renderFilters(){
  const counts = {}; for (const s of allSlots().filter(inCourt)) counts[filterKey(s)] = (counts[filterKey(s)]||0)+1;
  const chips = [];
  for (const id of [...state.leagues.keys()].sort((a,b)=>a-b)) {

  }

function slotDate(s){ const d = new Date(s.date); const h = Math.floor(s.start/100); d.setHours(h, Math.round((s.start%100)*0.6)); return d; }
function slotEnd(s){ const d = new Date(s.date); d.setHours(Math.floor(s.end/100), Math.round((s.end%100)*0.6)); return d; }

function slotInner(s, compact){
  if (s.kind==='free') return `<span class="top"><span class="t">${hm(s.start)}</span>${wxBadge(s)}</span><span class="open">${t('free')}${rainFor(s)?.wet ? ` · <span class="rw">${t('tagRain')}</span>` : ''}</span>${s.price!=null?`<span class="l"><span class="pchip">€${s.price}</span></span>`:''}`;
  const r = state.resultsByGame.get(s.gameId);
  const tags = [compact ? '' : takenTag(s), rainFor(s)?.wet?`<span class="tag rain" title="${t('tagRainTitle')}">${t('tagRain')}</span>`:'', s.recurring?`<span class="tag" title="${t('tagWeeklyTitle')}">${t('tagWeekly')}</span>`:'', s.openSeats?`<span class="tag" title="${t('tagSeatsTitle')}">+${s.openSeats}</span>`:''].join(' ');
  const sub = s.kind==='league' ? leagueName(s.leagueId) : s.kind==='booking' ? (s.players.length ? tn('players', s.players.length) : '') : '';
  return `<span class="top"><span class="t">${compact ? hm(s.start) : hm(s.start)+'–'+hm(s.end)}</span>${wxBadge(s)}</span>
    <span class="${compact?'l':'x'}">${esc(slotTitle(s))}</span>
    ${sub||tags.trim()?`<span class="l sub">${esc(sub)} ${tags}</span>`:''}
    ${r?`<span class="sc">${esc(scoreLine(r))}</span>`:''}`;
}

function renderBoard(){
  const board = document.getElementById('board');
  if (!state.days.length){ board.innerHTML=''; return; }
  const all = allSlots();
  const courts = shownCourts(), single = courts.length === 1 && state.courts.length > 1;
  board.classList.toggle('one', single);
  const min = Math.floor(Math.min(...all.map(s=>hrs(s.start)), 8));
  const max = Math.max(...all.map(s=>hrs(s.end)), 22);   // ends with the last slot (e.g. 23:30)
  const H = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour'));
  const height = (max-min)*H;
  // Time marks at slot starts (7:00, 8:30, 10:00 … for 90-minute slots). The step is the most common gap between
  // start times, so other slot lengths work too; with no slots at all, fall back to whole hours.
  const starts = [...new Set(all.map(s => hrs(s.start)))].sort((a,b) => a-b), gaps = new Map();
  starts.slice(1).forEach((x,i) => { const g = +(x - starts[i]).toFixed(2); gaps.set(g, (gaps.get(g)||0) + 1); });
  const step = [...gaps].sort((a,b) => b[1]-a[1] || a[0]-b[0])[0]?.[0] || 1, first = starts.length ? starts[0] : min;
  const ticks = []; for (let x = first; x + step <= max + 1e-6; x += step) ticks.push(x);   // only where a whole slot fits
  const lines = `--step:${step*H}px;--off:${(first-min)*H}px`;
  const now = new Date();
  let html = `<div class="corner"></div>`;
  state.days.forEach((d,i)=>{
    const t = sameDay(d.date, now);
    html += `<div class="dayhead${t?' today':''}" data-day="${ymd(d.date)}"><div class="d">${dayShort(d.date)} <small>${d.date.getDate()}.${d.date.getMonth()+1}.</small></div>
      <div class="lanes-h">${courts.map(c=>`<span title="${esc(c.name)}">${esc(courtLabel(c))}</span>`).join('')}</div></div>`;
  });
  html += `<div class="axis" style="height:${height}px">${ticks.map(x => `<span style="top:${(x-min)*H}px">${hm(Math.round(x*100))}</span>`).join('')}</div>`;
  state.days.forEach((d)=>{
    const t = sameDay(d.date, now);
    html += `<div class="daycol${t?' today':''}" style="height:${height}px;${lines}">`;
    for (const c of courts){
      html += `<div class="lane">`;
      for (const s of d.slots.filter(s=>s.court.id===c.id && visible(s))){
        const top = (hrs(s.start)-min)*H, h = (hrs(s.end)-hrs(s.start))*H - 3;
        const style = `top:${top+1}px;height:${h}px;${s.kind==='league'?'--c:'+leagueColor(s.leagueId):''}`;
        const past = slotEnd(s) < now ? ' past':'';
        html += `<button class="slot ${slotClass(s)}${past}" style="${style}" data-id="${slotKey(s)}">${slotInner(s,!single)}</button>`;
      }
      html += `</div>`;
    }
    if (t){ const nh = now.getHours()+now.getMinutes()/60; if (nh>=min && nh<=max) html += `<div class="now" style="top:${(nh-min)*H}px"></div>`; }
    html += `</div>`;
  });
  board.innerHTML = html;
  board.querySelectorAll('.slot').forEach(b=>b.onclick=()=>openSlot(b.dataset.id));
}

// Phone list. In the current week it opens at today: earlier days and today's finished slots fold into one
// gray "Earlier slots" bar at the top, which expands in place. Other weeks show in full.
function renderAgenda(){
  const el = document.getElementById('agenda'); const now = new Date();
  const single = shownCourts().length === 1 && state.courts.length > 1;
  const meta = s => [single ? null : esc(courtLabel(s.court)), s.kind==='league' ? esc(leagueName(s.leagueId)) : null, s.recurring ? t('weekly') : null].filter(Boolean).join(' · ');
  const row = s => `<li><button class="slot ${slotClass(s)}${slotEnd(s)<now?' past':''}" style="${s.kind==='league'?'--c:'+leagueColor(s.leagueId):''}" data-id="${slotKey(s)}">
        <span class="t">${hm(s.start)}</span><span class="body"><span class="l">${s.kind==='free' ? esc(t('free')) + (rainFor(s)?.wet ? ` · <span class="rw">${t('tagRain')}</span>` : '') : esc(slotTitle(s))}</span>${meta(s)||takenTag(s)?`<span class="court">${takenTag(s)}${meta(s)}</span>`:''}</span>${s.kind==='free' && s.price!=null ? `<span class="pchip">€${s.price}</span>` : ''}${wxBadge(s)}
        ${state.resultsByGame.get(s.gameId)?`<span class="sc">${esc(scoreLine(state.resultsByGame.get(s.gameId)))}</span>`:''}</button></li>`;
  // Free slots still bookable that day, on the courts being shown (no pill for days that are over).
  const dayHead = d => { const today = sameDay(d.date, now), n = freeLeft(d, now);
    const pill = dayEnded(d, now) ? '' : n ? `<span class="freecount">${tn('ag_free', n)}</span>` : `<span class="freecount none">${t('ag_full')}</span>`;
    return `<h3 class="${today?'today':''}">${dayShort(d.date)} <small>${d.date.toLocaleDateString(LOC(),{day:'numeric',month:'long'})}${today?' · '+t('ag_today'):''}</small>${pill}</h3>`; };
  const sorted = d => d.slots.filter(visible).sort((a,b)=>a.start-b.start || courtLabel(a.court).localeCompare(courtLabel(b.court)));
  const thisWeek = ymd(state.monday) === ymd(mondayOf(now));
  const isEarlier = s => slotEnd(s) < now;   // finished slots, earlier days included

  if (!thisWeek) {
    el.innerHTML = state.days.map(d => { const list = sorted(d);
      return `<div data-day="${ymd(d.date)}">${dayHead(d)}${list.length?`<ul>${list.map(row).join('')}</ul>`:`<p class="empty">${t('nothingToday')}</p>`}</div>`; }).join('');
  } else {
    const earlier = state.days.map(d => ({ d, list: sorted(d).filter(isEarlier) })).filter(x => x.list.length);
    const count = earlier.reduce((a,x) => a + x.list.length, 0);
    let html = '';
    if (count) {
      const first = earlier[0].d.date, last = earlier[earlier.length-1].d.date;
      const name = d => sameDay(d, now) ? t('ag_today') : (lang === 'hr' ? dayShort(d).toLowerCase() : dayShort(d));
      const span = sameDay(first, last) ? (sameDay(first, now) ? t('ag_earlierToday') : name(first)) : `${name(first)} – ${name(last)}`;
      html += `<button type="button" class="earlier" id="earlierBtn" aria-expanded="${!!state.showEarlier}">
          <span><span class="chev" aria-hidden="true">${state.showEarlier ? '▾' : '▸'}</span>${state.showEarlier ? t('ag_hideEarlier') : t('ag_earlier')} · ${esc(span)}</span><span class="n">${count}</span></button>`;
      if (state.showEarlier) html += `<div class="earlierlist">${earlier.map(x => `<div data-day="${ymd(x.d.date)}">${dayHead(x.d)}<ul>${x.list.map(row).join('')}</ul></div>`).join('')}</div>`;
    }
    html += state.days.filter(d => d.date >= new Date(now.getFullYear(), now.getMonth(), now.getDate())).map(d => {
      const list = sorted(d).filter(s => !isEarlier(s));
      return `<div data-day="${ymd(d.date)}">${dayHead(d)}${list.length?`<ul>${list.map(row).join('')}</ul>`:`<p class="empty">${t('nothingToday')}</p>`}</div>`;
    }).join('');
    el.innerHTML = html;
    const b = document.getElementById('earlierBtn');
    if (b) b.onclick = () => { state.showEarlier = !state.showEarlier; renderAgenda(); };
  }
  el.querySelectorAll('.slot').forEach(b=>b.onclick=()=>openSlot(b.dataset.id));
}

function slotKey(s){ return ymd(s.date)+'|'+s.court.id+'|'+s.start; }

/* ---------- drawer ---------- */
const drawer = document.getElementById('drawer'), panel = document.getElementById('panel');
drawer.onclick = e => { if (e.target===drawer) closeDrawer(); };
document.addEventListener('keydown', e => { if (e.key==='Escape' && !drawer.hidden) closeDrawer(); });
/* ---------- panel history: Back returns to the previous slot, player or pair ----------
   Every slot / player / pair opened while the panel is already open is stacked. Re-renders of the same view
   (loading → loaded, language switch) don't stack. Login and Settings start fresh. Closing the panel clears it. */
let navStack = [];
function navPush(type, id){
  if (drawer.hidden) navStack = [];
  const top = navStack[navStack.length - 1];
  if (!top || top.type !== type || String(top.id) !== String(id)) navStack.push({ type, id });
}
function navReset(){ navStack = []; }
async function navBack(){
  navStack.pop();
  const prev = navStack[navStack.length - 1];
  if (!prev) return closeDrawer();
  if (prev.type === 'slot') {
    if (!allSlots().some(x => slotKey(x) === prev.id)) await showWeek(mondayOf(new Date(prev.id.slice(0,10) + 'T12:00')));
    openSlot(prev.id);
  } else if (prev.type === 'player') openProfile(prev.id);
  else if (prev.type === 'team') openTeamProfile(prev.id);
  else if (prev.type === 'h2h') { const [k, a, b] = prev.id.split(':'); openH2H(k, a, b); }
  else if (prev.type === 'h2hpick') { const [k, id] = prev.id.split(':'); openH2HPick(k, id); }
}
function closeDrawer(){ drawer.hidden = true; navStack = []; if (location.hash.startsWith('#s=')) { try { history.replaceState(null, '', location.pathname + location.search); } catch(e){} } }
function openDrawer(html){
  const back = navStack.length > 1 ? `<button class="btn back" id="backD" type="button"><span aria-hidden="true">←</span> ${t('back')}</button>` : '<span></span>';
  panel.innerHTML = `<div class="dhead">${back}<button class="btn close" id="closeD" type="button">${t('close')}</button></div>` + html;
  drawer.hidden = false;
  document.getElementById('closeD').onclick = closeDrawer;
  const b = document.getElementById('backD'); if (b) b.onclick = navBack;
  (b || document.getElementById('closeD')).focus();
}

/* ---------- share + calendar ---------- */
function slotLink(s){ return location.origin + location.pathname + '#s=' + encodeURIComponent(slotKey(s)); }
function clubPlace(){ return [state.club?.name, state.club?.city].filter(Boolean).join(', '); }
function shareText(s){
  const day = s.date.toLocaleDateString(LOC(),{weekday:'short',day:'numeric',month:'short'});
  const w = weatherFor(s), rr = rainFor(s);
  const what = s.kind==='free' ? t('freeCourt')+(s.price!=null?' · €'+s.price:'') : slotTitle(s);
  const bits = [`🎾 ${day} ${hm(s.start)}–${hm(s.end)}`, `${courtLabel(s.court)}${state.club?.name ? ' ('+state.club.name+')' : ''}`, what];
  if (w) bits.push(`${Math.round(w.temp)}°${rr?.wet ? ', '+t('rainLikelyShort') : ''}`);
  if (s.openSeats) bits.push(tn('spots', s.openSeats));
  return bits.join(' · ');
}
const icsEsc = t => String(t).replace(/\\/g,'\\\\').replace(/[,;]/g, m => '\\'+m).replace(/\n/g,'\\n');
const icsTime = d => d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
function calEvent(s){
  const title = s.kind==='free' ? `Padel · ${courtLabel(s.court)}` : `Padel · ${slotTitle(s)}`;
  const details = shareText(s) + '\n' + slotLink(s);
  return { title, details, start: slotDate(s), end: slotEnd(s), place: [courtLabel(s.court) + (COURT_TYPES[s.court.id] ? ' ('+s.court.name+')' : ''), clubPlace()].filter(Boolean).join(', ') };
}
function icsFile(s){
  const e = calEvent(s);
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Padel Radar//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:'+slotKey(s).replace(/\|/g,'-')+'@padel-radar','DTSTAMP:'+icsTime(new Date()),
    'DTSTART:'+icsTime(e.start),'DTEND:'+icsTime(e.end),'SUMMARY:'+icsEsc(e.title),'LOCATION:'+icsEsc(e.place),
    'DESCRIPTION:'+icsEsc(e.details),'URL:'+slotLink(s),
    'BEGIN:VALARM','TRIGGER:-PT1H','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.title),'END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
}
function googleCalUrl(s){
  const e = calEvent(s);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(e.title)
    + '&dates=' + icsTime(e.start) + '/' + icsTime(e.end) + '&details=' + encodeURIComponent(e.details) + '&location=' + encodeURIComponent(e.place);
}
const ICON_SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>';
const ICON_CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>';
function actionsSection(s){
  if (slotEnd(s) < new Date()) return '';
  return `<div class="actions">
      <button class="btn" type="button" id="shareBtn">${ICON_SHARE}${t('share')}</button>

    </div>

    </div>

function wireActions(s){
  const sb = document.getElementById('shareBtn'); if (!sb) return;

  sb.onclick = async () => {

/* ---------- cancelling your own booking ----------
   Same rules as the official app: only the person who made the booking (the first player) can cancel, and only until
   the membership's reservation_cancelable hours before the start. Sporty+ checks both again on its side.
   Request: DELETE /v2/reservation/{id}?sendNotif=true (players on the waiting list get told the court is free). */
function cancelInfo(s){
  const me = state.me;
  if (!cfg.token || !me || !s.booked || !s.id || s.kind === 'league' || !isMine(s) || slotDate(s) <= new Date()) return null;
  const booker = s.players[0] || {};
  const isBooker = (booker.id && booker.id === me.id) || (me.team?.id && booker.team_id === me.team.id);
  const hours = Number(me.membership?.reservation_cancelable);
  const deadline = Number.isFinite(hours) && hours > 0 ? new Date(slotDate(s).getTime() - hours * 3600e3) : null;
  return { isBooker, booker, hours, deadline, late: !!(deadline && new Date() > deadline) };
}
const shortWhen = d => cap(d.toLocaleDateString(LOC(), { weekday:'short', day:'numeric', month:'numeric' })) + ' ' + d.toLocaleTimeString(LOC(), { hour:'2-digit', minute:'2-digit' });
function cancelSection(s){
  const c = cancelInfo(s); if (!c) return '';
  if (!c.isBooker) return `<div class="cancelnote"><b>${t('cancelOnly', { name: esc(c.booker.display_name || t('theBooker')) })}</b><span class="hint">${t('cancelOnlyHint')}</span></div>`;
  if (c.late) return `<div class="cancelnote"><b>${t('cancelLate')}</b><span class="hint">${t('cancelLateHint', { when: esc(shortWhen(c.deadline)), h: c.hours })}</span></div>`;
  return `<div class="cancelrow"><button class="btn danger" id="cancelBtn" type="button" aria-haspopup="dialog">${t('cancelBooking')}</button>${c.deadline ? `<span class="hint">${t('cancelUntil', { when: esc(shortWhen(c.deadline)), h: c.hours })}</span>` : ''}</div>`;
}
const confirmModal = document.getElementById('confirmModal'), confirmBox = document.getElementById('confirmBox');
let confirmReturn = null;
function closeConfirm(){ confirmModal.hidden = true; confirmReturn?.focus?.(); }
confirmModal.onclick = e => { if (e.target === confirmModal && !confirmModal.dataset.busy) closeConfirm(); };
confirmModal.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.stopPropagation(); if (!confirmModal.dataset.busy) closeConfirm(); }
  if (e.key === 'Tab') {   // keep focus inside the popup
    const f = [...confirmBox.querySelectorAll('button:not([disabled])')], a = f[0], z = f[f.length - 1];
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
  }
});
function wireCancel(s){
  const b = document.getElementById('cancelBtn'); if (!b) return;
  b.onclick = () => {
    const c = cancelInfo(s); if (!c || !c.isBooker || c.late) return openSlot(slotKey(s));
    confirmReturn = b;
    confirmBox.innerHTML = `<h2 id="cfTitle">${t('cancelQ')}</h2>
      <div class="cfwhat"><b>${esc(cap(dateLong(s.date)))} · ${hm(s.start)}–${hm(s.end)}</b><span>${esc(courtLabel(s.court))}${s.players.length ? ' · ' + tn('players', s.players.length) : ''}</span></div>
      <p class="hint" id="cfBody">${c.deadline ? t('cancelUntil', { when: esc(shortWhen(c.deadline)), h: c.hours }) + ' ' : ''}${t('cancelFinal')}</p>
      <p class="msg" id="cfMsg" aria-live="polite"></p>
      <div class="cfbtns"><button class="btn dangersolid" id="cfGo" type="button">${t('cancelBooking')}</button><button class="btn" id="cfNo" type="button">${t('cancelKeep')}</button></div>`;
    confirmModal.hidden = false; delete confirmModal.dataset.busy;
    const go = document.getElementById('cfGo'), no = document.getElementById('cfNo'), msg = document.getElementById('cfMsg');
    no.focus();
    no.onclick = closeConfirm;
    go.onclick = async () => {
      go.disabled = no.disabled = true; go.textContent = t('cancelling'); confirmModal.dataset.busy = '1';
      msg.className = 'msg'; msg.textContent = '';
      try {
        await api(`/v2/reservation/${s.id}?sendNotif=true`, undefined, 'DELETE');
        msg.className = 'msg ok'; msg.textContent = t('cancelledOk'); go.hidden = no.hidden = true;
        profileCache.clear();
        await loadWeek(); render();
        setTimeout(() => { delete confirmModal.dataset.busy; confirmModal.hidden = true; closeDrawer(); }, 1100);

        go.disabled = no.disabled = false; go.textContent = t('tryAgain');
      }
    };
  };
}
